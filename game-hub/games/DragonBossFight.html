<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dragon Boss Fight</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    margin: 0;
    overflow: hidden;
    background: #090414;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    background: linear-gradient(#120821, #2b0c24 65%, #120713);
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 5;
    pointer-events: none;
}

.barBox {
    width: 320px;
    max-width: 40vw;
    height: 20px;
    background: #260d18;
    border: 2px solid white;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.bar {
    height: 100%;
    transition: width .15s;
}

#playerBar {
    background: linear-gradient(90deg, #00ff88, #00c8ff);
}

#bossBar {
    background: linear-gradient(90deg, #ff1744, #ff7b00);
}

.label {
    font-weight: bold;
    font-size: 14px;
    text-shadow: 0 2px 5px black;
}

#score {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 10px #ffcc00;
}

/* Mobile Controls Layer */
#mobile-controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    height: 120px;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
}

.dpad, .actions {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.btn {
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    color: white;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    touch-action: manipulation;
}

.btn:active {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(0.95);
}

.btn-action {
    background: rgba(255, 59, 85, 0.3);
    border-color: #ff334f;
    font-size: 12px;
}

.btn-jump {
    background: rgba(0, 255, 136, 0.3);
    border-color: #00ff88;
}

.btn-dash {
    background: rgba(0, 200, 255, 0.3);
    border-color: #00c8ff;
}

#screen {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(5, 2, 12, .85);
    text-align: center;
}

#screen.hidden {
    display: none;
}

h1 {
    font-size: clamp(36px, 8vw, 80px);
    margin: 0 0 10px;
    color: #ff334f;
    text-shadow: 0 0 10px #ff1744, 0 0 35px #ff1744;
}

#message {
    font-size: 20px;
    margin-bottom: 25px;
}

.start-btn {
    padding: 15px 35px;
    border: 0;
    border-radius: 12px;
    background: #ff3b55;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #ff1744;
}

.start-btn:hover {
    transform: scale(1.06);
    background: #ff1744;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div class="label">⚔️ HERO</div>
    <div class="barBox">
        <div id="playerBar" class="bar"></div>
    </div>

    <div class="label">🐉 DRAGON</div>
    <div class="barBox">
        <div id="bossBar" class="bar"></div>
    </div>
</div>

<div id="score">🔥 Hits: 0</div>

<div id="mobile-controls">
    <div class="dpad">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="actions">
        <div class="btn btn-action btn-jump" id="btn-jump">⬆️ JUMP</div>
        <div class="btn btn-action btn-dash" id="btn-dash">⚡ DASH</div>
        <div class="btn btn-action" id="btn-attack">⚔️ ATTACK</div>
    </div>
</div>

<div id="screen">
    <h1 id="title">DRAGON BOSS</h1>
    <div id="message">Use W / Up Arrow / Jump Button to jump!</div>
    <button class="start-btn" onclick="startGame()">START FIGHT</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;
let keys = {};
let touchState = { left: false, right: false };
let particles = [];
let projectiles = [];
let enemyProjectiles = [];

let gameRunning = false;
let player;
let dragon;

let hits = 0;
let shake = 0;
let attackCooldown = 0;
let dashCooldown = 0;
let fireTimer = 100;

const GRAVITY = 0.65;
const GROUND_Y_OFFSET = 120;

function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;

    if (player && player.isGrounded) {
        player.y = H - GROUND_Y_OFFSET;
    }
    if (dragon) {
        dragon.y = H - 140;
    }
}

window.addEventListener("resize", resize);

// Keyboard controls
window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "KeyW", "KeyA", "KeyD", "ShiftLeft", "ShiftRight"].includes(e.code)) {
        e.preventDefault();
    }

    // Immediate Jump trigger on press
    if ((e.code === "KeyW" || e.code === "ArrowUp") && gameRunning) {
        playerJump();
    }

    if (e.code === "Enter" && !gameRunning) {
        startGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.code] = false;
});

// Mobile Touch Control Setup
function bindTouch(id, onStart, onEnd) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e) => { e.preventDefault(); onStart(); });
    el.addEventListener("touchend", (e) => { e.preventDefault(); onEnd(); });
    el.addEventListener("mousedown", (e) => { e.preventDefault(); onStart(); });
    el.addEventListener("mouseup", (e) => { e.preventDefault(); onEnd(); });
}

bindTouch("btn-left", () => touchState.left = true, () => touchState.left = false);
bindTouch("btn-right", () => touchState.right = true, () => touchState.right = false);
bindTouch("btn-jump", () => { if (gameRunning) playerJump(); }, () => {});
bindTouch("btn-attack", () => { if (gameRunning) playerAttack(); }, () => {});
bindTouch("btn-dash", () => { if (gameRunning) playerDash(); }, () => {});

function startGame() {
    gameRunning = true;
    document.getElementById("screen").classList.add("hidden");

    hits = 0;
    particles = [];
    projectiles = [];
    enemyProjectiles = [];

    player = {
        x: W * 0.2,
        y: H - GROUND_Y_OFFSET,
        vy: 0,
        w: 48,
        h: 75,
        speed: 7,
        health: 100,
        maxHealth: 100,
        facing: 1,
        invincible: 0,
        animTimer: 0,
        isGrounded: true
    };

    dragon = {
        x: W * 0.8,
        y: H - 140,
        w: 220,
        h: 150,
        health: 500,
        maxHealth: 500,
        phase: 1,
        hurt: 0,
        dir: -1
    };

    attackCooldown = 0;
    dashCooldown = 0;
    fireTimer = 100;

    updateUI();
}

function endGame(win) {
    gameRunning = false;
    const screen = document.getElementById("screen");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const button = screen.querySelector("button");

    screen.classList.remove("hidden");

    if (win) {
        title.textContent = "VICTORY!";
        title.style.color = "#00ff9d";
        title.style.textShadow = "0 0 25px #00ff9d";
        message.textContent = "🐉 The dragon has been slain!";
        button.textContent = "FIGHT AGAIN";
    } else {
        title.textContent = "DEFEATED";
        title.style.color = "#ff334f";
        title.style.textShadow = "0 0 25px #ff1744";
        message.textContent = "The dragon crushed you...";
        button.textContent = "TRY AGAIN";
    }
}

function updateUI() {
    if (!player || !dragon) return;
    document.getElementById("playerBar").style.width = Math.max(0, player.health / player.maxHealth * 100) + "%";
    document.getElementById("bossBar").style.width = Math.max(0, dragon.health / dragon.maxHealth * 100) + "%";
    document.getElementById("score").textContent = "🔥 Hits: " + hits;
}

function spawnParticles(x, y, color, amount = 10) {
    for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            size: Math.random() * 5 + 2,
            color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += .08;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function playerJump() {
    if (player.isGrounded) {
        player.vy = -14.5;
        player.isGrounded = false;
        spawnParticles(player.x, player.y + 20, "#ffffff", 12);
    }
}

function playerDash() {
    if (dashCooldown > 0) return;
    player.x += player.facing * 160;
    player.x = Math.max(30, Math.min(W - 30, player.x));
    player.invincible = 25;
    dashCooldown = 90;
    spawnParticles(player.x, player.y, "#00eaff", 25);
}

function playerAttack() {
    if (attackCooldown > 0) return;

    attackCooldown = 15;
    const direction = player.facing;

    projectiles.push({
        x: player.x + direction * 30,
        y: player.y - 25,
        vx: direction * 16,
        vy: 0,
        life: 50,
        radius: 16
    });

    spawnParticles(player.x + direction * 30, player.y - 25, "#00eaff", 8);
}

function updateProjectiles() {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.life--;

        if (
            Math.abs(p.x - dragon.x) < dragon.w / 1.6 &&
            Math.abs(p.y - dragon.y) < dragon.h / 1.4
        ) {
            dragon.health -= 15;
            dragon.hurt = 8;
            hits++;
            shake = 8;

            spawnParticles(p.x, p.y, "#ffcc00", 15);
            projectiles.splice(i, 1);

            if (dragon.health <= 0) {
                dragon.health = 0;
                endGame(true);
                return;
            }
            continue;
        }

        if (p.life <= 0 || p.x < -50 || p.x > W + 50) {
            projectiles.splice(i, 1);
        }
    }
}

function dragonAttack() {
    if (fireTimer > 0) return;

    fireTimer = Math.max(30, 85 - dragon.phase * 15);

    const targetX = player.x;
    const targetY = player.y - 20;

    const dx = targetX - dragon.x;
    const dy = targetY - dragon.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    enemyProjectiles.push({
        x: dragon.x + (dragon.dir * 40),
        y: dragon.y - 10,
        vx: (dx / distance) * (6 + dragon.phase),
        vy: (dy / distance) * (6 + dragon.phase),
        radius: 18,
        life: 180
    });

    spawnParticles(dragon.x + (dragon.dir * 40), dragon.y - 10, "#ff5e00", 15);
}

function updateEnemyProjectiles() {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        const p = enemyProjectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (
            player.invincible <= 0 &&
            Math.abs(p.x - player.x) < p.radius + player.w / 2 &&
            Math.abs(p.y - player.y) < p.radius + player.h / 2
        ) {
            player.health -= 15;
            player.invincible = 45;
            shake = 12;

            spawnParticles(p.x, p.y, "#ff1744", 20);
            enemyProjectiles.splice(i, 1);

            if (player.health <= 0) {
                player.health = 0;
                endGame(false);
                return;
            }
            continue;
        }

        if (p.life <= 0 || p.x < -100 || p.x > W + 100 || p.y > H + 100) {
            enemyProjectiles.splice(i, 1);
        }
    }
}

function update() {
    if (!gameRunning) return;

    // Movement checks
    if (keys["ArrowLeft"] || keys["KeyA"] || touchState.left) {
        player.x -= player.speed;
        player.facing = -1;
        player.animTimer += 0.2;
    }
    if (keys["ArrowRight"] || keys["KeyD"] || touchState.right) {
        player.x += player.speed;
        player.facing = 1;
        player.animTimer += 0.2;
    }

    if (keys["ShiftLeft"] || keys["ShiftRight"]) {
        playerDash();
    }
    if (keys["Space"]) {
        playerAttack();
    }

    // Apply Jump Gravity & Physics
    player.y += player.vy;
    player.vy += GRAVITY;

    const floorY = H - GROUND_Y_OFFSET;
    if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.isGrounded = true;
    }

    player.x = Math.max(35, Math.min(W - 35, player.x));

    attackCooldown--;
    dashCooldown--;
    fireTimer--;
    player.invincible--;

    // Grounded Dragon behavior
    dragon.x += dragon.dir * (1.5 + dragon.phase);
    if (dragon.x > W - dragon.w / 2) {
        dragon.dir = -1;
    } else if (dragon.x < dragon.w / 2) {
        dragon.dir = 1;
    }

    // Direct melee body collision check
    if (
        player.invincible <= 0 &&
        Math.abs(player.x - dragon.x) < dragon.w / 2.5 &&
        Math.abs(player.y - dragon.y) < dragon.h / 2
    ) {
        player.health -= 20;
        player.invincible = 50;
        shake = 15;
        spawnParticles(player.x, player.y, "#ff1744", 25);

        if (player.health <= 0) {
            player.health = 0;
            endGame(false);
            return;
        }
    }

    // Phase updates
    const hpPercent = dragon.health / dragon.maxHealth;
    if (hpPercent < .66) dragon.phase = 2;
    if (hpPercent < .33) dragon.phase = 3;

    dragon.hurt--;

    dragonAttack();
    updateProjectiles();
    updateEnemyProjectiles();
    updateParticles();

    if (shake > 0) shake--;

    updateUI();
}

function drawBackground() {
    // Moon
    ctx.fillStyle = "#ffe8a3";
    ctx.shadowBlur = 40;
    ctx.shadowColor = "#ffd86b";
    ctx.beginPath();
    ctx.arc(W - 120, 100, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Mountain silhouettes
    ctx.fillStyle = "#160b25";
    ctx.beginPath();
    ctx.moveTo(0, H - 100);
    ctx.lineTo(W * .2, H - 280);
    ctx.lineTo(W * .4, H - 120);
    ctx.lineTo(W * .65, H - 310);
    ctx.lineTo(W * .85, H - 150);
    ctx.lineTo(W, H - 220);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    // Lava Ground
    ctx.fillStyle = "#0c0612";
    ctx.fillRect(0, H - 100, W, 100);

    ctx.strokeStyle = "#ff3b19";
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ff3b19";
    ctx.lineWidth = 3;
    for (let i = 0; i < 10; i++) {
        const x = i * (W / 10) + 30;
        ctx.beginPath();
        ctx.moveTo(x, H);
        ctx.lineTo(x + 15, H - 45);
        ctx.lineTo(x - 5, H - 100);
        ctx.stroke();
    }
    ctx.shadowBlur = 0;
}

function drawPlayer() {
    if (!player) return;
    if (player.invincible > 0 && Math.floor(Date.now() / 50) % 2 === 0) return;

    ctx.save();
    ctx.translate(player.x, player.y);

    const bob = player.isGrounded ? Math.sin(player.animTimer) * 3 : 0;

    // Hero Cape
    ctx.fillStyle = "#ff1744";
    ctx.beginPath();
    ctx.moveTo(-10 * player.facing, -35 + bob);
    ctx.lineTo(-25 * player.facing, 10 + bob);
    ctx.lineTo(-5 * player.facing, 15 + bob);
    ctx.fill();

    // Body Armor
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(-15, -40 + bob, 30, 40);

    // Glowing Chestpiece
    ctx.fillStyle = "#00eaff";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00eaff";
    ctx.fillRect(-5, -30 + bob, 10, 10);

    // Helmet
    ctx.fillStyle = "#7f8c8d";
    ctx.fillRect(-14, -60 + bob, 28, 22);

    // Helmet Visor
    ctx.fillStyle = "#00ff9d";
    ctx.fillRect(player.facing === 1 ? 0 : -12, -54 + bob, 12, 6);

    // Glowing Sword
    ctx.shadowColor = "#00eaff";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(15 * player.facing - 2, -45 + bob, 4 * player.facing, -30);

    ctx.restore();
}

function drawDragon() {
    if (!dragon) return;

    ctx.save();
    ctx.translate(dragon.x, dragon.y);

    const bodyColor = dragon.hurt > 0 ? "#ffffff" : (dragon.phase === 3 ? "#ff0055" : (dragon.phase === 2 ? "#ff5e00" : "#d32f2f"));
    ctx.fillStyle = bodyColor;
    ctx.shadowBlur = 20;
    ctx.shadowColor = bodyColor;

    // Folded Ground Wings
    ctx.beginPath();
    ctx.moveTo(-40 * dragon.dir, 0);
    ctx.lineTo(-100 * dragon.dir, -70);
    ctx.lineTo(-70 * dragon.dir, 30);
    ctx.fill();

    // Grounded Dragon Body Quadruped Shape
    ctx.beginPath();
    ctx.ellipse(0, 0, dragon.w / 2, dragon.h / 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.beginPath();
    ctx.arc(dragon.dir * 80, -30, 35, 0, Math.PI * 2);
    ctx.fill();

    // Dragon Eyes
    ctx.fillStyle = "#ffee55";
    ctx.beginPath();
    ctx.arc(dragon.dir * 90, -35, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(dragon.dir * 92, -35, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawProjectiles() {
    // Hero Attacks
    ctx.fillStyle = "#00eaff";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00eaff";
    for (const p of projectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // Boss Fireballs
    ctx.fillStyle = "#ff3b19";
    ctx.shadowColor = "#ff1744";
    for (const p of enemyProjectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();

    if (shake > 0) {
        ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    drawBackground();

    if (gameRunning) {
        drawPlayer();
        drawDragon();
        drawProjectiles();
        drawParticles();
    }

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

resize();
gameLoop();

</script>
</body>
</html>
