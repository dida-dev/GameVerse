<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Dash — GameVault</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080b16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    .top-nav {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 400px;
      width: 100%;
      z-index: 30;
    }

    .hub-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(124, 92, 255, 0.15);
      border: 1px solid rgba(124, 92, 255, 0.4);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .hub-btn:hover {
      background: rgba(124, 92, 255, 0.35);
      border-color: rgba(124, 92, 255, 0.8);
      transform: translateY(-2px);
    }

    /* Game Canvas Container */
    #game-container {
      position: relative;
      width: 400px;
      height: 520px;
      background: #12101e;
      border: 2px solid rgba(124, 92, 255, 0.3);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      margin-top: 40px;
    }

    /* Dungeon Grid Background Details */
    .dungeon-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    #scoreboard {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      z-index: 10;
      color: #e2e8f0;
    }

    #player {
      position: absolute;
      bottom: 25px;
      left: 180px;
      width: 40px;
      height: 40px;
      font-size: 28px;
      display: grid;
      place-items: center;
      z-index: 5;
      transition: left 0.05s ease-out;
    }

    .trap {
      position: absolute;
      width: 32px;
      height: 32px;
      font-size: 24px;
      display: grid;
      place-items: center;
    }

    .treasure {
      position: absolute;
      width: 30px;
      height: 30px;
      font-size: 24px;
      display: grid;
      place-items: center;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    /* Overlay Screen */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 11, 22, 0.94);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }

    #overlay h1 {
      font-size: 2.2rem;
      color: #ffb703;
      text-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
    }

    #overlay p {
      color: #94a3b8;
      font-size: 0.95rem;
      text-align: center;
      padding: 0 20px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 200px;
      margin-top: 10px;
    }

    button, .action-btn {
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #7c5cff, #00cfff);
      color: #fff;
      box-shadow: 0 4px 15px rgba(124, 92, 255, 0.3);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 207, 255, 0.4);
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="../index.html" class="hub-btn">
      ◀ Return to Hub
    </a>
  </div>

  <div id="game-container">
    <div class="dungeon-bg"></div>
    
    <div id="scoreboard">
      <span>Treasure: <span id="score">0</span></span>
      <span>Health: <span id="health">3</span> HP</span>
    </div>

    <div id="player">🧙</div>

    <div id="overlay">
      <h1 id="title">Dungeon Dash</h1>
      <p id="subtitle">Dodge the traps (🔥/⚙️) and collect the loot (💎/💎)!</p>
      
      <div class="btn-group">
        <button id="start-btn" class="primary-btn" onclick="startGame()">Enter Dungeon</button>
        <a href="../index.html" class="action-btn secondary-btn">Main Menu</a>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subtitleEl = document.getElementById('subtitle');

    let score = 0;
    let health = 3;
    let playerX = 180;
    const playerSpeed = 7;
    let keys = {};
    let entities = []; // Holds both traps and treasures
    let gameInterval;
    let spawnInterval;
    let isPlaying = false;

    const trapTypes = ['🔥', '⚙️', '🗡️', '💀'];
    const treasureTypes = ['💎', '💰', '👑', '🏆'];

    // Controls
    document.addEventListener('keydown', (e) => keys[e.key] = true);
    document.addEventListener('keyup', (e) => keys[e.key] = false);

    container.addEventListener('mousemove', (e) => {
      if (!isPlaying) return;
      const rect = container.getBoundingClientRect();
      playerX = e.clientX - rect.left - 20;
      keepPlayerInBounds();
    });

    function keepPlayerInBounds() {
      if (playerX < 10) playerX = 10;
      if (playerX > 350) playerX = 350;
      player.style.left = playerX + 'px';
    }

    function spawnEntity() {
      const isTreasure = Math.random() > 0.45; // 55% Traps, 45% Treasure
      const el = document.createElement('div');
      
      const type = isTreasure 
        ? treasureTypes[Math.floor(Math.random() * treasureTypes.length)]
        : trapTypes[Math.floor(Math.random() * trapTypes.length)];

      el.textContent = type;
      el.classList.add(isTreasure ? 'treasure' : 'trap');

      const entity = {
        x: 10 + Math.random() * 340,
        y: -30,
        speed: 3 + Math.random() * 2.5 + (score * 0.02),
        isTreasure: isTreasure,
        el: el
      };

      el.style.left = entity.x + 'px';
      el.style.top = entity.y + 'px';
      container.appendChild(el);
      entities.push(entity);
    }

    function update() {
      if (keys['ArrowLeft'] || keys['a']) {
        playerX -= playerSpeed;
        keepPlayerInBounds();
      }
      if (keys['ArrowRight'] || keys['d']) {
        playerX += playerSpeed;
        keepPlayerInBounds();
      }

      for (let i = entities.length - 1; i >= 0; i--) {
        const item = entities[i];
        item.y += item.speed;
        item.el.style.top = item.y + 'px';

        // Collision Check with Player
        if (
          item.y >= 445 && item.y <= 485 &&
          item.x + 30 >= playerX && item.x <= playerX + 40
        ) {
          if (item.isTreasure) {
            score += 25;
            scoreEl.textContent = score;
          } else {
            health--;
            healthEl.textContent = health;
            if (health <= 0) {
              endGame();
            }
          }
          item.el.remove();
          entities.splice(i, 1);
          continue;
        }

        // Clean up items below viewport
        if (item.y > 520) {
          item.el.remove();
          entities.splice(i, 1);
        }
      }
    }

    function startGame() {
      score = 0;
      health = 3;
      playerX = 180;
      scoreEl.textContent = score;
      healthEl.textContent = health;
      player.style.left = playerX + 'px';

      entities.forEach(item => item.el.remove());
      entities = [];

      overlay.style.display = 'none';
      isPlaying = true;

      gameInterval = setInterval(update, 1000 / 60);
      spawnInterval = setInterval(spawnEntity, 750);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      clearInterval(spawnInterval);

      titleEl.textContent = 'Dungeon Over';
      subtitleEl.textContent = `Loot Collected: ${score} Treasure`;
      document.getElementById('start-btn').textContent = 'Try Again';
      overlay.style.display = 'flex';
    }
  </script>
</body>
</html>
