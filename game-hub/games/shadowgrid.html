<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>Shadow Grid</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#03050b;color:#e8fbff;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none; -webkit-user-select:none;
  }
  canvas{
    display:block;
    width:100vw;height:100vh;
    touch-action:none;
  }
  #hud{
    position:fixed;
    top:16px;left:18px;right:18px;
    display:flex; justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    z-index:5;
    font-weight:bold;
    text-shadow:0 0 10px #00eaff;
  }
  .logo{ color:#00eaff; letter-spacing:3px; font-size:18px; }
  .stats{ text-align:right; color:#fff; font-size:14px; line-height:1.8; }
  #alertBox{
    position:fixed; top:75px; left:50%; transform:translateX(-50%);
    width:min(300px,70vw); height:7px;
    border:1px solid #263847; background:#081018;
    z-index:6; opacity:0; transition:.2s;
  }
  #alert{ width:0%; height:100%; background:#ff285f; box-shadow:0 0 15px #ff285f; }
  #screen{
    position:fixed; inset:0; z-index:20;
    display:flex; justify-content:center; align-items:center;
    text-align:center; background:rgba(1,3,9,.82); backdrop-filter:blur(5px);
  }
  .panel{
    width:min(600px,90vw); padding:36px 30px;
    border:1px solid #00d9ff; background:rgba(4,12,24,.94);
    box-shadow: 0 0 40px rgba(0,217,255,.18), inset 0 0 40px rgba(0,217,255,.03);
  }
  h1{
    margin:0; color:#00efff;
    font-size:clamp(38px,9vw,76px);
    letter-spacing:7px;
    text-shadow:0 0 25px #00d9ff;
  }
  #info{ color:#9cb7c8; line-height:1.7; margin:20px 0; }
  button{
    border:0; padding:14px 30px; background:#00d9ff; color:#001018;
    font-weight:900; letter-spacing:1px; cursor:pointer;
    box-shadow:0 0 20px rgba(0,217,255,.3);
  }
  button:hover{background:#8cffff}
  .hidden{display:none!important}

  #mobile{
    position:fixed; bottom:24px; left:20px; right:20px;
    display:flex; justify-content:space-between; align-items:flex-end;
    z-index:15; pointer-events:none;
  }
  .pad{
    width:150px; height:150px; position:relative; pointer-events:auto;
  }
  .mbtn{
    position:absolute; width:54px; height:54px; padding:0;
    border:1.5px solid rgba(0,240,255,.6);
    background:rgba(0,30,45,.85); color:#8cffff; font-size:22px;
    border-radius:10px;
    box-shadow:0 0 12px rgba(0,217,255,.2);
    user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  .mbtn:active{ background:#00d9ff; color:#001018; transform:scale(0.93); }
  .up{left:48px;top:0}
  .down{left:48px;bottom:0}
  .left{left:0;top:48px}
  .right{right:0;top:48px}

  @media(max-width:700px){
    #hud{top:12px}
    .logo{font-size:14px}
    .stats{font-size:11px}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="logo">SHADOW GRID</div>
  <div class="stats">
    LEVEL <span id="level">1</span><br>
    DATA <span id="data">0</span>/<span id="total">3</span> &nbsp; SCORE <span id="score">0</span>
  </div>
</div>

<div id="alertBox"><div id="alert"></div></div>

<div id="screen">
  <div class="panel">
    <h1 id="title">SHADOW GRID</h1>
    <div id="info">
      INFILTRATE THE SECURITY GRID.<br>
      STEAL EVERY DATA CORE.<br>
      AVOID THE GUARDS.<br>
      ESCAPE.
    </div>
    <button id="start">START MISSION</button>
  </div>
</div>

<div id="mobile">
  <div class="pad">
    <button class="mbtn up" data-key="w">▲</button>
    <button class="mbtn left" data-key="a">◀</button>
    <button class="mbtn right" data-key="d">▶</button>
    <button class="mbtn down" data-key="s">▼</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;
let cols = 0, rows = 0, cell = 40;
let map = [];
let player = null;
let guards = [];
let cores = [];
let exit = null;
let level = 1;
let collected = 0;
let totalCores = 3;
let score = 0;
let alertLevel = 0;
let gameState = "menu";
let pulse = 0;
let keys = {};
let particles = [];

// Touch / Swipe vector support
let touchDir = { x: 0, y: 0 };
let touchActive = false;

const screen = document.getElementById("screen");
const title = document.getElementById("title");
const info = document.getElementById("info");
const start = document.getElementById("start");
const alertBox = document.getElementById("alertBox");
const alertBar = document.getElementById("alert");

function resize() {
  W = innerWidth || 800;
  H = innerHeight || 600;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cell = Math.max(34, Math.min(55, Math.floor(Math.min(W, H) / 11)));
  cols = Math.max(12, Math.floor(W / cell));
  rows = Math.max(10, Math.floor(H / cell));
}
addEventListener("resize", resize);
resize();

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  if (e.key.toLowerCase() === "r") {
    if (gameState !== "playing") startGame();
    else startLevel();
  }
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

// Canvas touch drag steering
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchActive = true;
}, { passive: true });

canvas.addEventListener("touchmove", e => {
  if (!touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dist = Math.hypot(dx, dy);
  if (dist > 10) {
    touchDir.x = dx / dist;
    touchDir.y = dy / dist;
  }
}, { passive: true });

canvas.addEventListener("touchend", () => {
  touchActive = false;
  touchDir.x = 0;
  touchDir.y = 0;
});

start.onclick = () => {
  if (gameState === "playing") return;
  level = 1;
  score = 0;
  startGame();
};

document.querySelectorAll(".mbtn").forEach(btn => {
  const k = btn.dataset.key;
  const pressDown = e => { e.preventDefault(); keys[k] = true; };
  const pressUp = e => { e.preventDefault(); keys[k] = false; };
  btn.addEventListener("touchstart", pressDown, { passive: false });
  btn.addEventListener("touchend", pressUp, { passive: false });
  btn.addEventListener("touchcancel", pressUp, { passive: false });
  btn.addEventListener("mousedown", pressDown);
  btn.addEventListener("mouseup", pressUp);
  btn.addEventListener("mouseleave", pressUp);
});

function startGame() {
  startLevel();
  screen.classList.add("hidden");
  gameState = "playing";
}

function startLevel() {
  generateMap();
  collected = 0;
  alertLevel = 0;
  particles = [];
  player = { x: 1.5, y: 1.5, speed: 3.2 };
  guards = [];
  cores = [];
  totalCores = Math.min(5, 2 + level);

  for (let i = 0; i < 2 + Math.min(level, 4); i++) {
    const p = findFarPoint(7);
    guards.push({
      x: p.x + .5,
      y: p.y + .5,
      dir: Math.random() * Math.PI * 2,
      speed: 0.65 + level * .08 + Math.random() * .3,
      range: 4.5 + Math.min(level * .25, 2),
      cone: .62,
      turnTimer: Math.random() * 2
    });
  }

  for (let i = 0; i < totalCores; i++) {
    const p = findFarPoint(5);
    cores.push({
      x: p.x + .5,
      y: p.y + .5,
      taken: false,
      phase: Math.random() * Math.PI * 2
    });
  }

  const ep = findFarPoint(8);
  exit = { x: ep.x + .5, y: ep.y + .5, active: false };
  updateHUD();
}

function generateMap() {
  map = Array.from({ length: rows }, () => Array(cols).fill(1));
  const startX = 1;
  const startY = 1;
  const stack = [[startX, startY]];
  map[startY][startX] = 0;
  const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];

  while (stack.length) {
    const current = stack[stack.length - 1];
    const x = current[0];
    const y = current[1];
    const choices = dirs
      .map(d => [x + d[0], y + d[1], d[0] / 2, d[1] / 2])
      .filter(p => p[0] > 0 && p[0] < cols - 1 && p[1] > 0 && p[1] < rows - 1 && map[p[1]] && map[p[1]][p[0]] === 1);

    if (!choices.length) {
      stack.pop();
      continue;
    }

    const c = choices[Math.floor(Math.random() * choices.length)];
    if (map[y + c[3]] && map[c[1]]) {
      map[y + c[3]][x + c[2]] = 0;
      map[c[1]][c[0]] = 0;
    }
    stack.push([c[0], c[1]]);
  }

  for (let i = 0; i < Math.floor(cols * rows * 0.035); i++) {
    const x = 1 + Math.floor(Math.random() * (cols - 2));
    const y = 1 + Math.floor(Math.random() * (rows - 2));
    if (map[y] && map[y][x] === 1) {
      let open = 0;
      if (!map[y - 1]?.[x]) open++;
      if (!map[y + 1]?.[x]) open++;
      if (!map[y]?.[x - 1]) open++;
      if (!map[y]?.[x + 1]) open++;
      if (open >= 2) map[y][x] = 0;
    }
  }

  for (let y = 1; y <= 2; y++) {
    for (let x = 1; x <= 2; x++) {
      if (y < rows - 1 && x < cols - 1 && map[y]) map[y][x] = 0;
    }
  }
}

function findFarPoint(minDistance) {
  for (let i = 0; i < 1000; i++) {
    const x = 1 + Math.floor(Math.random() * (cols - 2));
    const y = 1 + Math.floor(Math.random() * (rows - 2));
    if (!map[y] || map[y][x] !== 0) continue;
    const d = Math.hypot(x - 1, y - 1);
    if (d >= minDistance) return { x, y };
  }
  return { x: Math.max(1, cols - 2), y: Math.max(1, rows - 2) };
}

function wall(x, y) {
  const gx = Math.floor(x);
  const gy = Math.floor(y);
  if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return true;
  if (!map[gy]) return true;
  return map[gy][gx] === 1;
}

function canMove(x, y, r = .21) {
  return !wall(x - r, y - r) && !wall(x + r, y - r) && !wall(x - r, y + r) && !wall(x + r, y + r);
}

function update(dt) {
  if (gameState !== "playing") return;
  pulse += dt;
  let dx = 0;
  let dy = 0;
  if (keys.w || keys.arrowup) dy--;
  if (keys.s || keys.arrowdown) dy++;
  if (keys.a || keys.arrowleft) dx--;
  if (keys.d || keys.arrowright) dx++;

  if (touchActive && (touchDir.x !== 0 || touchDir.y !== 0)) {
    dx = touchDir.x;
    dy = touchDir.y;
  }

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
    const amount = player.speed * dt;
    const nx = player.x + dx * amount;
    const ny = player.y + dy * amount;
    if (canMove(nx, player.y)) player.x = nx;
    if (canMove(player.x, ny)) player.y = ny;
  }

  updateGuards(dt);
  updateCores();
  updateExit();
  alertLevel = Math.max(0, alertLevel - dt * 10);
  if (alertLevel >= 100) {
    lose();
    return;
  }
  score += dt * 5;
  updateParticles(dt);
  updateHUD();
}

function updateGuards(dt) {
  for (const g of guards) {
    g.turnTimer -= dt;
    const playerDist = Math.hypot(player.x - g.x, player.y - g.y);
    let sees = canSee(g);

    if (sees) {
      const target = Math.atan2(player.y - g.y, player.x - g.x);
      let diff = angleDiff(target, g.dir);
      g.dir += Math.sign(diff) * dt * 2.8;
      alertLevel += dt * (playerDist < 2.2 ? 55 : 30);
      if (alertLevel > 60) g.speed += dt * .3;
    } else {
      if (g.turnTimer <= 0) {
        g.dir += (Math.random() - .5) * 1.8;
        g.turnTimer = 1 + Math.random() * 3;
      }
    }

    const nx = g.x + Math.cos(g.dir) * g.speed * dt;
    const ny = g.y + Math.sin(g.dir) * g.speed * dt;
    if (canMove(nx, ny, .18)) {
      g.x = nx;
      g.y = ny;
    } else {
      g.dir += Math.PI * (.5 + Math.random() * .5);
      g.turnTimer = 0;
    }
  }
}

function canSee(g) {
  const dx = player.x - g.x;
  const dy = player.y - g.y;
  const dist = Math.hypot(dx, dy);
  if (dist > g.range) return false;
  const target = Math.atan2(dy, dx);
  const diff = angleDiff(target, g.dir);
  if (Math.abs(diff) > g.cone) return false;
  const steps = Math.ceil(dist * 10);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = g.x + dx * t;
    const y = g.y + dy * t;
    if (wall(x, y)) return false;
  }
  return true;
}

function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function updateCores() {
  for (const c of cores) {
    if (c.taken) continue;
    const d = Math.hypot(player.x - c.x, player.y - c.y);
    if (d < .55) {
      c.taken = true;
      collected++;
      score += 350;
      burst(c.x, c.y, "#ffd84d", 18);
    }
  }
}

function updateExit() {
  if (!exit || collected < totalCores) return;
  exit.active = true;
  const d = Math.hypot(player.x - exit.x, player.y - exit.y);
  if (d < .65) {
    levelComplete();
  }
}

function levelComplete() {
  gameState = "levelComplete";
  const bonus = 1000 + level * 250;
  score += bonus;
  title.textContent = "GRID CLEARED";
  info.innerHTML = `LEVEL ${level} COMPLETE.<br>ALL DATA RECOVERED.<br>BONUS: ${bonus}<br><br>GET READY FOR LEVEL ${level + 1}`;
  start.textContent = "NEXT LEVEL";
  screen.classList.remove("hidden");
  start.onclick = () => {
    level++;
    startLevel();
    screen.classList.add("hidden");
    gameState = "playing";
  };
}

function lose() {
  gameState = "dead";
  burst(player.x, player.y, "#ff285f", 35);
  title.textContent = "SYSTEM LOCKED";
  info.innerHTML = `YOU WERE DETECTED.<br>DATA RECOVERED: ${collected}/${totalCores}<br>SCORE: ${Math.floor(score)}`;
  start.textContent = "RETRY";
  screen.classList.remove("hidden");
  start.onclick = () => {
    level = 1;
    score = 0;
    startGame();
  };
}

function updateHUD() {
  document.getElementById("level").textContent = level;
  document.getElementById("data").textContent = collected;
  document.getElementById("total").textContent = totalCores;
  document.getElementById("score").textContent = Math.floor(score);
  alertBox.style.opacity = (gameState === "playing" && alertLevel > 1) ? "1" : "0";
  alertBar.style.width = Math.min(100, alertLevel) + "%";
}

function burst(x, y, color, count) {
  const ox = (W - cols * cell) / 2;
  const oy = (H - rows * cell) / 2;
  const px = ox + x * cell;
  const py = oy + y * cell;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 20 + Math.random() * 90;
    particles.push({
      x: px,
      y: py,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: .5 + Math.random() * .7,
      color
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= .97;
    p.vy *= .97;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.fillStyle = "#03050b";
  ctx.fillRect(0, 0, W, H);
  const ox = (W - cols * cell) / 2;
  const oy = (H - rows * cell) / 2;
  drawMap(ox, oy);
  drawExit(ox, oy);
  drawCores(ox, oy);
  drawVision(ox, oy);
  drawGuards(ox, oy);
  drawParticles();
  drawPlayer(ox, oy);
  drawVignette();
}

function drawMap(ox, oy) {
  if (!map || map.length === 0) return;
  for (let y = 0; y < rows; y++) {
    if (!map[y]) continue;
    for (let x = 0; x < cols; x++) {
      const px = ox + x * cell;
      const py = oy + y * cell;
      if (map[y][x]) {
        ctx.fillStyle = "#0e1621";
        ctx.fillRect(px, py, cell, cell);
        ctx.fillStyle = "rgba(0,220,255,.035)";
        ctx.fillRect(px + 2, py + 2, cell - 4, cell - 4);
        ctx.strokeStyle = "rgba(0,220,255,.08)";
        ctx.strokeRect(px, py, cell, cell);
      } else {
        ctx.fillStyle = "#050a12";
        ctx.fillRect(px, py, cell, cell);
        ctx.strokeStyle = "rgba(0,220,255,.025)";
        ctx.strokeRect(px, py, cell, cell);
      }
    }
  }
}

function drawExit(ox, oy) {
  if (!exit) return;
  const x = ox + exit.x * cell;
  const y = oy + exit.y * cell;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = exit.active ? "#00ff9d" : "#34404d";
  ctx.lineWidth = 3;
  if (exit.active) {
    ctx.shadowColor = "#00ff9d";
    ctx.shadowBlur = 25;
  }
  ctx.beginPath();
  ctx.arc(0, 0, cell * (.23 + Math.sin(pulse * 3) * .025), 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-cell * .12, 0);
  ctx.lineTo(cell * .12, 0);
  ctx.stroke();
  ctx.restore();
}

function drawCores(ox, oy) {
  for (const c of cores) {
    if (c.taken) continue;
    const x = ox + c.x * cell;
    const y = oy + c.y * cell;
    ctx.save();
    ctx.translate(x, y);
    const size = cell * (.14 + Math.sin(pulse * 4 + c.phase) * .025);
    ctx.shadowColor = "#ffd84d";
    ctx.shadowBlur = 25;
    ctx.fillStyle = "#ffd84d";
    ctx.beginPath();
    ctx.moveTo(0, -size * 1.6);
    ctx.lineTo(size, 0);
    ctx.lineTo(0, size * 1.6);
    ctx.lineTo(-size, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawVision(ox, oy) {
  for (const g of guards) {
    const x = ox + g.x * cell;
    const y = oy + g.y * cell;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.dir);
    const danger = canSee(g);
    ctx.fillStyle = danger ? "rgba(255,20,80,.17)" : "rgba(255,20,80,.075)";
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, g.range * cell, -g.cone, g.cone);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function drawGuards(ox, oy) {
  for (const g of guards) {
    const x = ox + g.x * cell;
    const y = oy + g.y * cell;
    const danger = canSee(g);
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = danger ? "#ff174f" : "#ff2c6d";
    ctx.shadowBlur = danger ? 30 : 18;
    ctx.fillStyle = "#ff2c6d";
    ctx.beginPath();
    ctx.arc(0, 0, cell * .19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(Math.cos(g.dir) * cell * .08, Math.sin(g.dir) * cell * .08, cell * .045, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(ox, oy) {
  if (!player) return;
  const x = ox + player.x * cell;
  const y = oy + player.y * cell;
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "#00f5ff";
  ctx.shadowBlur = 22;
  ctx.fillStyle = "#00eaff";
  ctx.beginPath();
  ctx.moveTo(0, -cell * .25);
  ctx.lineTo(cell * .2, cell * .2);
  ctx.lineTo(0, cell * .11);
  ctx.lineTo(-cell * .2, cell * .2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#00141c";
  ctx.beginPath();
  ctx.arc(0, 0, cell * .065, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .7);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,.5)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.04, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
