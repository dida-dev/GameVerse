<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw a Perfect Circle</title>
<style>
    :root {
        --bg: #11151c;
        --panel: #1d2432;
        --cyan: #32e6ff;
        --green: #00ff87;
        --yellow: #ffea00;
        --red: #ff3d81;
        --text: #ffffff;
        --muted: #64748b;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
    }

    /* Back to Hub Button */
    #hubBtn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 10px 18px;
        background: rgba(29, 36, 50, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        border-radius: 20px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        z-index: 20;
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.15s ease, background 0.15s ease;
    }

    #hubBtn:active {
        transform: scale(0.94);
        background: rgba(50, 230, 255, 0.2);
    }

    /* HUD Elements */
    #ui {
        position: fixed;
        top: 30px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        z-index: 10;
    }

    .score-card {
        text-align: center;
        background: rgba(29, 36, 50, 0.85);
        padding: 14px 28px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        min-width: 200px;
    }

    .score-val {
        font-size: 56px;
        font-weight: 900;
        line-height: 1;
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
        transition: color 0.1s ease;
    }

    .best-val {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    #instruction {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        pointer-events: none;
        z-index: 10;
        text-align: center;
        width: 90%;
        text-transform: uppercase;
        transition: opacity 0.2s ease;
    }

    #resetBtn {
        position: fixed;
        bottom: 85px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 32px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: var(--text);
        border-radius: 30px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #resetBtn.active {
        opacity: 1;
        pointer-events: auto;
    }

    #resetBtn:active {
        transform: translateX(-50%) scale(0.95);
    }
</style>
</head>
<body>

<button id="hubBtn">◄ Hub</button>

<div id="ui">
    <div class="score-card">
        <div class="score-val" id="score">0.0%</div>
        <div class="best-val" id="best">BEST: 0.0%</div>
    </div>
</div>

<button id="resetBtn">Try Again</button>
<div id="instruction">Draw a circle around the dot</div>

<canvas id="canvas"></canvas>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const resetBtn = document.getElementById("resetBtn");
const hubBtn = document.getElementById("hubBtn");
const instructionEl = document.getElementById("instruction");

let width = 0;
let height = 0;
let dpr = 1;

let isDrawing = false;
let isFinished = false;
let points = [];
let pointScores = [];
let currentScore = 0;
let targetRadius = 0;

let bestScore = parseFloat(localStorage.getItem("circle_best_neal")) || 0;
bestEl.textContent = `BEST: ${bestScore.toFixed(1)}%`;

/* Canvas Resize */
function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawCenterDot();
}

window.addEventListener("resize", resize);

function drawCenterDot() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.beginPath();
    ctx.arc(width / 2, height / 2, 6, 0, Math.PI * 2);
    ctx.fill();
}

function getPos(e) {
    if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
}

function getColorForScore(score) {
    if (score >= 90) return "#00ff87";
    if (score >= 75) return "#32e6ff";
    if (score >= 50) return "#ffea00";
    return "#ff3d81";
}

/* Dynamic Live Calculation */
function processLiveScore() {
    const center = { x: width / 2, y: height / 2 };

    if (points.length < 5) return;

    if (targetRadius === 0) {
        let sumR = 0;
        const initialCount = Math.min(points.length, 10);
        for (let i = 0; i < initialCount; i++) {
            sumR += Math.hypot(points[i].x - center.x, points[i].y - center.y);
        }
        targetRadius = sumR / initialCount;
    }

    const latestPt = points[points.length - 1];
    const dist = Math.hypot(latestPt.x - center.x, latestPt.y - center.y);
    const diff = Math.abs(dist - targetRadius);

    let pointScore = Math.max(0, 100 - (diff / targetRadius) * 200);
    pointScores.push(pointScore);

    let sumScore = 0;
    for (let s of pointScores) sumScore += s;
    currentScore = sumScore / pointScores.length;

    if (points.length > 30) {
        const startPt = points[0];
        const gap = Math.hypot(latestPt.x - startPt.x, latestPt.y - startPt.y);
        if (gap < targetRadius * 0.35) {
            const gapPenalty = (gap / targetRadius) * 15;
            currentScore = Math.max(0, currentScore - gapPenalty);
        }
    }

    scoreEl.textContent = `${currentScore.toFixed(1)}%`;
    scoreEl.style.color = getColorForScore(currentScore);
}

function startDrawing(e) {
    if (isFinished) return;
    isDrawing = true;
    points = [];
    pointScores = [];
    targetRadius = 0;
    currentScore = 100;

    const pos = getPos(e);
    points.push(pos);

    instructionEl.style.opacity = "0";
    scoreEl.textContent = "100.0%";
    scoreEl.style.color = "var(--green)";
}

function continueDrawing(e) {
    if (!isDrawing) return;

    const pos = getPos(e);
    const lastPoint = points[points.length - 1];

    const dist = Math.hypot(pos.x - lastPoint.x, pos.y - lastPoint.y);
    if (dist > 3) {
        points.push(pos);
        processLiveScore();
        renderPath();
    }
}

function stopDrawing() {
    if (!isDrawing) return;
    isDrawing = false;

    if (points.length < 15) {
        resetGame();
        return;
    }

    isFinished = true;

    if (currentScore > bestScore) {
        bestScore = currentScore;
        localStorage.setItem("circle_best_neal", bestScore);
        bestEl.textContent = `BEST: ${bestScore.toFixed(1)}%`;
    }

    renderFinalCircle();
}

function renderPath() {
    ctx.clearRect(0, 0, width, height);
    drawCenterDot();

    if (points.length < 2) return;

    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    for (let i = 1; i < points.length; i++) {
        const segmentScore = pointScores[i - 1] !== undefined ? pointScores[i - 1] : currentScore;
        ctx.strokeStyle = getColorForScore(segmentScore);

        ctx.beginPath();
        ctx.moveTo(points[i - 1].x, points[i - 1].y);
        ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
    }
}

function renderFinalCircle() {
    renderPath();

    const center = { x: width / 2, y: height / 2 };

    if (targetRadius > 0) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, targetRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    resetBtn.classList.add("active");
}

function resetGame() {
    isDrawing = false;
    isFinished = false;
    points = [];
    pointScores = [];
    targetRadius = 0;
    currentScore = 0;

    scoreEl.textContent = "0.0%";
    scoreEl.style.color = "var(--cyan)";
    instructionEl.style.opacity = "1";
    resetBtn.classList.remove("active");
    drawCenterDot();
}

/* Navigate up one directory level to the root index.html */
hubBtn.addEventListener("click", () => {
    window.location.href = "../index.html";
});

/* Controls (Mouse + Touch) */
canvas.addEventListener("mousedown", startDrawing);
window.addEventListener("mousemove", continueDrawing);
window.addEventListener("mouseup", stopDrawing);

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    startDrawing(e);
}, { passive: false });

window.addEventListener("touchmove", (e) => {
    continueDrawing(e);
}, { passive: true });

window.addEventListener("touchend", stopDrawing);

resetBtn.addEventListener("click", resetGame);

// Init
resize();
</script>

</body>
</html>
