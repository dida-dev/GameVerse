<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaxy Defender</title>
<style>
* { box-sizing: border-box; user-select: none; touch-action: manipulation; }
body { margin: 0; overflow: hidden; background: #05050f; font-family: sans-serif; color: white; }
canvas { display: block; background: #08081a; }
#ui { position: fixed; top: 15px; left: 15px; font-weight: bold; font-size: 18px; pointer-events: none; }
#controls { position: fixed; bottom: 15px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; }
.btn { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid #fff; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.btn-fire { background: rgba(255,50,50,0.4); border-color: #ff334f; width: 75px; height: 75px; }
#screen { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; }
#screen.hidden { display: none; }
button { padding: 15px 30px; background: #00eaff; border: 0; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">🚀 HP: <span id="hp">100</span> | ⭐ Score: <span id="score">0</span></div>
<div id="controls">
    <div style="display:flex; gap:10px;">
        <div class="btn" id="left">◀</div>
        <div class="btn" id="right">▶</div>
    </div>
    <div class="btn btn-fire" id="fire">🔥</div>
</div>
<div id="screen">
    <h1 id="title" style="color:#00eaff;">GALAXY DEFENDER</h1>
    <button onclick="startGame()">PLAY GAME</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W, H, player, bullets = [], enemies = [], score = 0, running = false, keys = {};

function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
window.addEventListener("resize", resize);
resize();

function bind(id, press, release) {
    const el = document.getElementById(id);
    el.addEventListener("touchstart", (e)=>{e.preventDefault(); press();});
    el.addEventListener("touchend", (e)=>{e.preventDefault(); release();});
    el.addEventListener("mousedown", (e)=>{e.preventDefault(); press();});
    el.addEventListener("mouseup", (e)=>{e.preventDefault(); release();});
}
bind("left", ()=>keys.left=true, ()=>keys.left=false);
bind("right", ()=>keys.right=true, ()=>keys.right=false);
bind("fire", ()=>shoot(), ()=>{});

window.addEventListener("keydown", e => {
    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if(e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if(e.code === "Space") shoot();
});
window.addEventListener("keyup", e => {
    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if(e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
});

function shoot() {
    if(!running) return;
    bullets.push({ x: player.x, y: player.y - 20, speed: 12 });
}

function startGame() {
    score = 0; bullets = []; enemies = []; running = true;
    player = { x: W/2, y: H - 120, w: 40, h: 40, hp: 100 };
    document.getElementById("screen").classList.add("hidden");
    document.getElementById("score").textContent = score;
    document.getElementById("hp").textContent = player.hp;
}

function update() {
    if(!running) return;
    if(keys.left) player.x -= 7;
    if(keys.right) player.x += 7;
    player.x = Math.max(20, Math.min(W-20, player.x));

    for(let i=bullets.length-1; i>=0; i--) {
        bullets[i].y -= bullets[i].speed;
        if(bullets[i].y < 0) bullets.splice(i,1);
    }

    if(Math.random() < 0.04) {
        enemies.push({ x: Math.random()*(W-40)+20, y: -20, r: 15+Math.random()*15, speed: 3+Math.random()*3 });
    }

    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.speed;

        // Bullet hit
        for(let j=bullets.length-1; j>=0; j--) {
            let b = bullets[j];
            if(Math.hypot(e.x - b.x, e.y - b.y) < e.r + 5) {
                enemies.splice(i,1);
                bullets.splice(j,1);
                score += 10;
                document.getElementById("score").textContent = score;
                break;
            }
        }

        // Player hit
        if(e && Math.hypot(e.x - player.x, e.y - player.y) < e.r + 20) {
            player.hp -= 20;
            enemies.splice(i,1);
            document.getElementById("hp").textContent = player.hp;
            if(player.hp <= 0) {
                running = false;
                document.getElementById("title").textContent = "GAME OVER";
                document.getElementById("screen").classList.remove("hidden");
            }
        }
    }
}

function draw() {
    ctx.clearRect(0,0,W,H);
    if(running) {
        // Player
        ctx.fillStyle = "#00eaff";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 20);
        ctx.lineTo(player.x - 20, player.y + 20);
        ctx.lineTo(player.x + 20, player.y + 20);
        ctx.fill();

        // Bullets
        ctx.fillStyle = "#ffcc00";
        for(let b of bullets) ctx.fillRect(b.x-3, b.y, 6, 12);

        // Enemies
        ctx.fillStyle = "#ff334f";
        for(let e of enemies) {
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
        }
    }
    requestAnimationFrame(()=>{ update(); draw(); });
}
draw();
</script>
</body>
</html>
