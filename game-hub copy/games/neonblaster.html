<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>Neon Blaster: Arcade Odyssey</title>
<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #030308;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #game-container {
        position: relative;
        width: 100%;
        max-width: 420px;
        height: 100%;
        max-height: 800px;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at center, #0f0c29 0%, #030308 100%);
        box-shadow: 0 0 35px rgba(0, 243, 255, 0.2);
        overflow: hidden;
    }

    header {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.02);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 10;
    }

    .stat-box {
        text-align: center;
    }

    .stat-label {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #00f3ff;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .stat-value {
        font-size: 18px;
        font-weight: 800;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        min-width: 55px;
    }

    #canvas-wrapper {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        background: #030308;
    }

    /* Joysticks */

    .joystick-zone {
        position: absolute;
        bottom: 25px;
        width: 110px;
        height: 110px;
        background: rgba(255, 255, 255, 0.03);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        z-index: 20;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #joystick-move {
        left: 20px;
    }

    #joystick-fire {
        right: 20px;
        border-color: rgba(255, 0, 85, 0.2);
    }

    .joystick-handle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 45px;
        height: 45px;
        margin-left: -22.5px;
        margin-top: -22.5px;
        border-radius: 50%;
        pointer-events: none;
        transition: transform 0.05s linear;
    }

    #handle-move {
        background: linear-gradient(135deg, #00f3ff, #0066ff);
        box-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
    }

    #handle-fire {
        background: linear-gradient(135deg, #ff0055, #ff9900);
        box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
    }

    footer {
        flex-shrink: 0;
        padding: 12px 20px 20px;
        display: flex;
        justify-content: space-around;
        gap: 15px;
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 10;
    }

    .btn {
        background: linear-gradient(135deg, #00f3ff, #0066ff);
        border: none;
        color: #030308;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 800;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
        transition: transform 0.1s;
        touch-action: manipulation;
    }

    .btn:active {
        transform: scale(0.95);
    }

    #overlay {
        position: absolute;
        inset: 0;
        background: rgba(3, 3, 8, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.3s ease;
        padding: 20px;
    }

    #overlay h1 {
        font-size: 30px;
        margin: 0 0 10px;
        background: linear-gradient(135deg, #00f3ff, #ff0055);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    #overlay p {
        color: #a0a0b0;
        font-size: 13px;
        margin: 0 0 25px;
        text-align: center;
        padding: 0 25px;
        line-height: 1.5;
        white-space: pre-line;
    }

    @media (max-height: 600px) {
        header {
            padding: 8px 15px;
        }

        footer {
            padding: 8px 15px;
        }

        .joystick-zone {
            bottom: 10px;
        }
    }
</style>

</head> <body> <div id="game-container">
<header>
    <div class="stat-box">
        <div class="stat-label">Score</div>
        <div id="score-val" class="stat-value">0</div>
    </div>

    <div class="stat-box">
        <div class="stat-label">Shields</div>
        <div id="lives-val" class="stat-value">🛡️🛡️🛡️</div>
    </div>

    <div class="stat-box">
        <div class="stat-label">High</div>
        <div id="high-score-val" class="stat-value">0</div>
    </div>
</header>

<div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="joystick-move" class="joystick-zone">
        <div id="handle-move" class="joystick-handle"></div>
    </div>

    <div id="joystick-fire" class="joystick-zone">
        <div id="handle-fire" class="joystick-handle"></div>
    </div>
</div>

<footer>
    <button class="btn" id="sound-btn">Audio: ON</button>
    <button class="btn" id="restart-btn">Restart</button>
</footer>

<div id="overlay">
    <h1 id="overlay-title">NEON BLASTER</h1>

    <p id="overlay-text">
        Left Joystick moves your ship.
        Right Joystick aims and shoots lasers at alien drones.
        Survive the onslaught!
    </p>

    <button class="btn" id="start-btn"
            style="font-size:16px;padding:12px 35px;">
        START MISSION
    </button>
</div>

</div> <script> "use strict";
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const wrapper = document.getElementById("canvas-wrapper");

const scoreEl = document.getElementById("score-val");
const livesEl = document.getElementById("lives-val");
const highScoreEl = document.getElementById("high-score-val");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayText = document.getElementById("overlay-text");
const startBtn = document.getElementById("start-btn");

let gameActive = false;
let score = 0;
let lives = 3;
let frameCount = 0;
let soundEnabled = true;

let highScore = Number(localStorage.getItem("neon_blaster_high")) || 0;

highScoreEl.textContent = highScore;

/* =========================
PLAYER
========================= */

const player = {
x: 0,
y: 0,
w: 36,
h: 36,
speed: 4.5
};

/* =========================
GAME OBJECTS
========================= */

let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

/* =========================
JOYSTICKS
========================= */

let moveDir = {
x: 0,
y: 0
};

let fireDir = {
x: 0,
y: -1,
active: false
};

/* =========================
AUDIO
========================= */

let audioCtx = null;

function initAudio() {
if (!audioCtx) {
const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

    if (AudioContext) {
        audioCtx = new AudioContext();
    }
}

if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
}

}

function playTone(freq, type, duration, volume = 0.1) {
if (!soundEnabled || !audioCtx) return;

try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(
        freq,
        audioCtx.currentTime
    );

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);

} catch (error) {
    console.warn("Audio error:", error);
}

}

function sfxShoot() {
playTone(720, "triangle", 0.08, 0.08);
}

function sfxExplode() {
playTone(140, "sawtooth", 0.25, 0.12);
}

function sfxHit() {
playTone(90, "square", 0.2, 0.15);
}

/* =========================
CANVAS RESIZE
========================= */

function resize() {
const rect = wrapper.getBoundingClientRect();

const dpr = Math.min(window.devicePixelRatio || 1, 2);

canvas.width = Math.max(1, Math.floor(rect.width * dpr));
canvas.height = Math.max(1, Math.floor(rect.height * dpr));

canvas.style.width = rect.width + "px";
canvas.style.height = rect.height + "px";

ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

if (!gameActive) {
    player.x = rect.width / 2;
    player.y = Math.max(60, rect.height - 120);
}

createStars();

}

function getGameWidth() {
return wrapper.clientWidth;
}

function getGameHeight() {
return wrapper.clientHeight;
}

window.addEventListener("resize", resize);

/* =========================
STARFIELD
========================= */

function createStars() {
stars = [];

const width = getGameWidth();
const height = getGameHeight();

for (let i = 0; i < 50; i++) {
    stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        speed: 0.5 + Math.random() * 1.5
    });
}

}

/* =========================
JOYSTICK
========================= */

function setupJoystick(zoneId, handleId, callback) {
const zone = document.getElementById(zoneId);
const handle = document.getElementById(handleId);

let activePointerId = null;

const maxDist = 38;

function updateStick(event) {
    const rect = zone.getBoundingClientRect();

    const cx = rect.width / 2;
    const cy = rect.height / 2;

    let dx =
        event.clientX -
        rect.left -
        cx;

    let dy =
        event.clientY -
        rect.top -
        cy;

    const distance = Math.hypot(dx, dy);

    if (distance > maxDist) {
        dx = (dx / distance) * maxDist;
        dy = (dy / distance) * maxDist;
    }

    handle.style.transform =
        `translate(${dx}px, ${dy}px)`;

    callback(
        dx / maxDist,
        dy / maxDist,
        true
    );
}

function resetStick(event) {
    if (event.pointerId !== activePointerId) return;

    activePointerId = null;

    handle.style.transform =
        "translate(0px, 0px)";

    callback(0, 0, false);

    try {
        zone.releasePointerCapture(event.pointerId);
    } catch (e) {}
}

zone.addEventListener("pointerdown", event => {
    event.preventDefault();

    initAudio();

    if (activePointerId !== null) return;

    activePointerId = event.pointerId;

    try {
        zone.setPointerCapture(event.pointerId);
    } catch (e) {}

    updateStick(event);
});

zone.addEventListener("pointermove", event => {
    event.preventDefault();

    if (event.pointerId === activePointerId) {
        updateStick(event);
    }
});

zone.addEventListener("pointerup", resetStick);
zone.addEventListener("pointercancel", resetStick);
zone.addEventListener("lostpointercapture", event => {
    if (event.pointerId === activePointerId) {
        activePointerId = null;
        handle.style.transform =
            "translate(0px, 0px)";
        callback(0, 0, false);
    }
});

}

setupJoystick(
"joystick-move",
"handle-move",
(x, y) => {
moveDir.x = x;
moveDir.y = y;
}
);

setupJoystick(
"joystick-fire",
"handle-fire",
(x, y, active) => {
fireDir.x = x;
fireDir.y = y;
fireDir.active = active;
}
);

/* =========================
ENEMIES
========================= */

function spawnEnemy() {
const width = getGameWidth();

const margin = 30;

const x =
    margin +
    Math.random() *
    Math.max(1, width - margin * 2);

enemies.push({
    x,
    y: -30,
    w: 32,
    h: 32,
    speed: 1.5 + Math.random() * 1.5,
    health: 2
});

}

/* =========================
PARTICLES
========================= */

function spawnParticles(x, y, color) {
for (let i = 0; i < 10; i++) {
const angle =
Math.random() * Math.PI * 2;

    const speed =
        1 + Math.random() * 4;

    particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        size: 2 + Math.random() * 3
    });
}

}

/* =========================
FIRE
========================= */

function shoot() {
if (!fireDir.active) return;

const length =
    Math.hypot(
        fireDir.x,
        fireDir.y
    ) || 1;

const vx =
    (fireDir.x / length) * 8;

const vy =
    (fireDir.y / length) * 8;

bullets.push({
    x: player.x,
    y: player.y,
    vx,
    vy
});

sfxShoot();

}

/* =========================
GAME UPDATE
========================= */

function update() {
if (!gameActive) return;

frameCount++;

const width = getGameWidth();
const height = getGameHeight();

/* Stars */

for (const star of stars) {
    star.y += star.speed;

    if (star.y > height) {
        star.y = 0;
        star.x = Math.random() * width;
    }
}

/* Player */

player.x += moveDir.x * player.speed;
player.y += moveDir.y * player.speed;

player.x = Math.max(
    25,
    Math.min(width - 25, player.x)
);

player.y = Math.max(
    50,
    Math.min(height - 50, player.y)
);

/* Shooting */

if (
    fireDir.active &&
    frameCount % 10 === 0
) {
    shoot();
}

/* Enemy spawning */

if (frameCount % 45 === 0) {
    spawnEnemy();
}

/* Bullets */

for (
    let i = bullets.length - 1;
    i >= 0;
    i--
) {
    const bullet = bullets[i];

    bullet.x += bullet.vx;
    bullet.y += bullet.vy;

    if (
        bullet.x < -20 ||
        bullet.x > width + 20 ||
        bullet.y < -20 ||
        bullet.y > height + 20
    ) {
        bullets.splice(i, 1);
        continue;
    }

    let bulletHit = false;

    for (
        let j = enemies.length - 1;
        j >= 0;
        j--
    ) {
        const enemy = enemies[j];

        if (
            Math.hypot(
                bullet.x - enemy.x,
                bullet.y - enemy.y
            ) < 22
        ) {
            enemy.health--;

            bullets.splice(i, 1);
            bulletHit = true;

            spawnParticles(
                bullet.x,
                bullet.y,
                "#00f3ff"
            );

            if (enemy.health <= 0) {
                sfxExplode();

                score += 15;

                scoreEl.textContent = score;

                spawnParticles(
                    enemy.x,
                    enemy.y,
                    "#ff0055"
                );

                enemies.splice(j, 1);
            }

            break;
        }
    }

    if (bulletHit) continue;
}

/* Enemies */

for (
    let i = enemies.length - 1;
    i >= 0;
    i--
) {
    const enemy = enemies[i];

    enemy.y += enemy.speed;

    /* Player collision */

    if (
        Math.hypot(
            player.x - enemy.x,
            player.y - enemy.y
        ) < 25
    ) {
        sfxHit();

        lives--;

        updateLivesUI();

        spawnParticles(
            player.x,
            player.y,
            "#ff0055"
        );

        enemies.splice(i, 1);

        if (lives <= 0) {
            endGame();
            return;
        }

        continue;
    }

    /* Enemy escaped */

    if (enemy.y > height + 40) {
        enemies.splice(i, 1);
    }
}

/* Particles */

for (
    let i = particles.length - 1;
    i >= 0;
    i--
) {
    const particle = particles[i];

    particle.x += particle.vx;
    particle.y += particle.vy;

    particle.vx *= 0.98;
    particle.vy *= 0.98;

    particle.life -= 0.04;

    if (particle.life <= 0) {
        particles.splice(i, 1);
    }
}

}

/* =========================
UI
========================= */

function updateLivesUI() {
livesEl.textContent =
"🛡️".repeat(Math.max(0, lives));
}

function showOverlay(
title,
message,
buttonText
) {
overlayTitle.textContent = title;
overlayText.textContent = message;
startBtn.textContent = buttonText;

overlay.style.display = "flex";

requestAnimationFrame(() => {
    overlay.style.opacity = "1";
});

}

function hideOverlay() {
overlay.style.opacity = "0";

setTimeout(() => {
    if (gameActive) {
        overlay.style.display = "none";
    }
}, 300);

}

/* =========================
DRAW
========================= */

function draw() {
const width = getGameWidth();
const height = getGameHeight();

ctx.clearRect(0, 0, width, height);

/* Stars */

ctx.fillStyle = "#ffffff";

for (const star of stars) {
    ctx.globalAlpha =
        Math.min(1, star.size / 2);

    ctx.fillRect(
        star.x,
        star.y,
        star.size,
        star.size
    );
}

ctx.globalAlpha = 1;

/* Player */

ctx.save();

ctx.translate(
    player.x,
    player.y
);

ctx.fillStyle =
    "rgba(0,243,255,0.2)";

ctx.strokeStyle = "#00f3ff";

ctx.shadowColor = "#00f3ff";
ctx.shadowBlur = 12;

ctx.lineWidth = 2;

ctx.beginPath();

ctx.moveTo(0, -18);
ctx.lineTo(16, 16);
ctx.lineTo(0, 8);
ctx.lineTo(-16, 16);
ctx.closePath();

ctx.fill();
ctx.stroke();

ctx.restore();

/* Bullets */

ctx.fillStyle = "#00f3ff";
ctx.shadowColor = "#00f3ff";
ctx.shadowBlur = 8;

for (const bullet of bullets) {
    ctx.beginPath();

    ctx.arc(
        bullet.x,
        bullet.y,
        3.5,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

ctx.shadowBlur = 0;

/* Enemies */

for (const enemy of enemies) {
    ctx.save();

    ctx.translate(
        enemy.x,
        enemy.y
    );

    ctx.fillStyle =
        "rgba(255,0,85,0.25)";

    ctx.strokeStyle = "#ff0055";

    ctx.shadowColor = "#ff0055";
    ctx.shadowBlur = 10;

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        16,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

/* Particles */

for (const particle of particles) {
    ctx.save();

    ctx.globalAlpha =
        Math.max(0, particle.life);

    ctx.fillStyle = particle.color;

    ctx.shadowColor = particle.color;
    ctx.shadowBlur = 6;

    ctx.beginPath();

    ctx.arc(
        particle.x,
        particle.y,
        particle.size,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}

ctx.globalAlpha = 1;

}

/* =========================
GAME LOOP
========================= */

function loop() {
update();
draw();

requestAnimationFrame(loop);

}

/* =========================
START GAME
========================= */

function startGame() {
initAudio();

score = 0;
lives = 3;
frameCount = 0;

gameActive = true;

bullets = [];
enemies = [];
particles = [];

moveDir = {
    x: 0,
    y: 0
};

fireDir = {
    x: 0,
    y: -1,
    active: false
};

player.x = getGameWidth() / 2;
player.y = Math.max(
    60,
    getGameHeight() - 120
);

scoreEl.textContent = "0";

updateLivesUI();

hideOverlay();

}

/* =========================
END GAME
========================= */

function endGame() {
if (!gameActive) return;

gameActive = false;

moveDir.x = 0;
moveDir.y = 0;

fireDir.active = false;

if (score > highScore) {
    highScore = score;

    localStorage.setItem(
        "neon_blaster_high",
        String(highScore)
    );

    highScoreEl.textContent =
        highScore;
}

showOverlay(
    "MISSION FAILED",
    `Final Score: ${score}\nBest Score: ${highScore}`,
    "PLAY AGAIN"
);

}

/* =========================
BUTTONS
========================= */

startBtn.addEventListener(
"click",
startGame
);

/*

IMPORTANT:

Restart should NOT call endGame().

It simply starts a fresh game.
*/
document
.getElementById("restart-btn")
.addEventListener("click", () => {
startGame();
});

document
.getElementById("sound-btn")
.addEventListener("click", () => {
soundEnabled = !soundEnabled;

    document.getElementById(
        "sound-btn"
    ).textContent =
        soundEnabled
            ? "Audio: ON"
            : "Audio: OFF";

    if (soundEnabled) {
        initAudio();
    }
});

/* =========================
INITIALIZE
========================= */

resize();
updateLivesUI();
loop();

</script> </body> </html>
