<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Platformer Adventure</title>
    <!-- Tailwind CSS for UI overlays and menus -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for retro/arcade typography -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            touch-action: none;
        }
        .arcade-font {
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Custom UI glow effects */
        .arcade-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .btn-arcade {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #1e40af;
        }
        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e40af;
        }
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center select-none relative">

    <!-- Main Game Container -->
    <div id="game-container" class="relative w-full h-full max-w-5xl max-h-[750px] aspect-[4/3] bg-slate-900 shadow-2xl rounded-2xl overflow-hidden border-4 border-slate-700 flex flex-col">
        
        <!-- HUD Header -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-20 bg-gradient-to-b from-slate-950/80 to-transparent pointer-events-none">

                    <span id="hud-coins" class="arcade-font text-xs text-yellow-400">0 / 0</span>
                </div>
                <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700">

                <button id="btn-restart" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl arcade-font text-xs btn-arcade border-b-4 border-amber-800">

                <button id="btn-quit" class="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white rounded-xl arcade-font text-xs btn-arcade border-b-4 border-rose-800">

        <!-- GAMEOVER OVERLAY -->

    <script>
        // --- SOUND SYNTHESIZER (Web Audio API) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playJump() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playCoin() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            playDie() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }
            playWin() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.2);
                });
            }
        }
        const sounds = new SoundEngine();

        // --- STREAMING_CHUNK:Defining levels and world structure... ---

                ],
                hazards: [
                    { x: 350, y: 500, w: 200, h: 20, type: 'spikes' },
                    { x: 1150, y: 500, w: 300, h: 20, type: 'spikes' },

                ],
                coins: [

                    { x: 1350, y: 250, w: 150, h: 20, type: 'moving', minX: 1300, maxX: 1600, speed: 3.5 },
                    { x: 1700, y: 180, w: 140, h: 20, type: 'normal' },

                ],
                hazards: [

                ],
                coins: [
                    { x: 240, y: 360 }, { x: 500, y: 250 },
                    { x: 860, y: 170 }, { x: 1120, y: 300 },
                    { x: 1420, y: 200 }, { x: 1760, y: 130 },
                    { x: 2060, y: 240 }, { x: 2420, y: 170 },
                    { x: 2760, y: 290 }, { x: 2800, y: 290 }
                ],
                door: { x: 3000, y: 440, w: 40, h: 80 }
            }
        ];

        // --- STREAMING_CHUNK:Initializing game state and variables... ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to match internal aspect ratio/resolution
        function resizeCanvas() {
            canvas.width = 1024;
            canvas.height = 768;
        }
        resizeCanvas();

        let gameState = 'MENU'; // MENU, LEVEL_SELECT, PLAYING, PAUSED, GAMEOVER, VICTORY
        let currentLevelIndex = 0;
        let score = 0;
        let lives = 3;
        let coinsCollected = 0;
        let totalCoinsInLevel = 0;
        let levelTimer = 0;
        let timerInterval = null;
        let highscore = localStorage.getItem('neon_platformer_highscore') || 0;
        document.getElementById('menu-highscore').innerText = highscore;

        // Player Object
        let player = {
            x: 100,
            y: 400,
            w: 32,
            h: 44,
            vx: 0,
            vy: 0,
            speed: 5.5,
            jumpForce: -13.5,
            gravity: 0.6,
            grounded: false,
            facing: 'right',
            animFrame: 0
        };

        // Camera Object
        let camera = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height
        };

        // Input Tracking
        const keys = { left: false, right: false, up: false, jump: false };

        // Particles System
        let particles = [];
        function spawnParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // Active Level Data Runtime Copies
        let activePlatforms = [];
        let activeHazards = [];
        let activeCoins = [];
        let activeDoor = null;

        // --- STREAMING_CHUNK:Implementing level loader and entity reset... ---
        function loadLevel(index) {
            currentLevelIndex = index;
            const lvl = levels[index];
            player.x = lvl.spawn.x;
            player.y = lvl.spawn.y;
            player.vx = 0;
            player.vy = 0;
            
            // Deep copy platforms, hazards, coins
            activePlatforms = JSON.parse(JSON.stringify(lvl.platforms));
            activeHazards = JSON.parse(JSON.stringify(lvl.hazards));
            activeCoins = JSON.parse(JSON.stringify(lvl.coins)).map(c => ({ ...c, collected: false, floatOffset: Math.random() * 10 }));
            activeDoor = JSON.parse(JSON.stringify(lvl.door));

            coinsCollected = 0;
            totalCoinsInLevel = activeCoins.length;
            
            document.getElementById('hud-level').innerText = `LVL ${lvl.id}`;
            updateHUD();

            // Reset Timer
            levelTimer = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    levelTimer++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('hud-coins').innerText = `${coinsCollected} / ${totalCoinsInLevel}`;
            document.getElementById('hud-lives').innerText = lives;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(levelTimer / 60).toString().padStart(2, '0');
            const secs = (levelTimer % 60).toString().padStart(2, '0');
            document.getElementById('hud-timer').innerText = `${mins}:${secs}`;
        }

        // --- STREAMING_CHUNK:Implementing physics and collision detection... ---
        function rectIntersect(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function updatePhysics() {
            if (gameState !== 'PLAYING') return;

            // Horizontal Movement
            if (keys.left) {
                player.vx = -player.speed;
                player.facing = 'left';
            } else if (keys.right) {
                player.vx = player.speed;
                player.facing = 'right';
            } else {
                player.vx *= 0.8; // Friction
            }

            player.x += player.vx;

            // Horizontal platform collisions
            for (let p of activePlatforms) {
                if (p.type === 'moving') {
                    if (!p.dir) p.dir = 1;
                    p.x += p.speed * p.dir;
                    if (p.x <= p.minX || p.x >= p.maxX) p.dir *= -1;
                }
                if (rectIntersect(player, p)) {
                    if (player.vx > 0) player.x = p.x - player.w;
                    else if (player.vx < 0) player.x = p.x + p.w;
                    player.vx = 0;
                }
            }

            // Vertical Movement & Gravity
            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            // Vertical platform collisions
            for (let p of activePlatforms) {
                if (rectIntersect(player, p)) {
                    if (player.vy > 0) { // Landing
                        player.y = p.y - player.h;
                        player.grounded = true;
                        if (p.type === 'bounce') {
                            player.vy = player.jumpForce * 1.4;
                            sounds.playJump();
                            spawnParticles(player.x + player.w/2, player.y + player.h, '#38bdf8', 8);
                        } else {
                            player.vy = 0;
                        }
                        if (p.type === 'moving') {
                            player.x += p.speed * p.dir;
                        }
                    } else if (player.vy < 0) { // Hitting ceiling
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            // Jump Action
            if (keys.jump && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                sounds.playJump();
                spawnParticles(player.x + player.w/2, player.y + player.h, '#38bdf8', 10);
                keys.jump = false; // consume jump
            }

            // Fall off screen (Death)
            const lvl = levels[currentLevelIndex];
            if (player.y > lvl.height + 50) {
                handlePlayerDeath();
            }

            // Hazard Collisions
            for (let h of activeHazards) {
                if (rectIntersect(player, h)) {
                    handlePlayerDeath();
                    break;
                }
            }

            // Coin Collections
            for (let c of activeCoins) {
                if (!c.collected) {
                    const coinBox = { x: c.x - 12, y: c.y - 12, w: 24, h: 24 };
                    if (rectIntersect(player, coinBox)) {
                        c.collected = true;
                        coinsCollected++;
                        score += 100;
                        updateHUD();
                        sounds.playCoin();
                        spawnParticles(c.x, c.y, '#facc15', 8);
                    }
                }
            }

            // Door Collision (Victory check)
            if (activeDoor && rectIntersect(player, activeDoor)) {
                handleVictory();
            }

            // Camera Follow Player
            camera.x = player.x - camera.width / 2 + player.w / 2;
            camera.x = Math.max(0, Math.min(camera.x, lvl.width - camera.width));
            camera.y = 0; // Fixed vertical camera for side-scroller feel
        }

        function handlePlayerDeath() {
            sounds.playDie();
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#f43f5e', 25);
            lives--;
            updateHUD();
            if (lives <= 0) {
                gameState = 'GAMEOVER';
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('gameover-score').innerText = score;
                document.getElementById('gameover-overlay').classList.remove('hidden');
            } else {
                // Respawn at level start
                const lvl = levels[currentLevelIndex];
                player.x = lvl.spawn.x;
                player.y = lvl.spawn.y;
                player.vx = 0;
                player.vy = 0;
            }
        }

        function handleVictory() {
            gameState = 'VICTORY';
            if (timerInterval) clearInterval(timerInterval);
            sounds.playWin();

            // Calculate bonus score
            const timeBonus = Math.max(0, 300 - levelTimer) * 5;
            const levelScore = (coinsCollected * 100) + timeBonus;
            score += levelScore;

            if (score > highscore) {
                highscore = score;
                localStorage.setItem('neon_platformer_highscore', highscore);
            }

            document.getElementById('victory-time').innerText = document.getElementById('hud-timer').innerText;
            document.getElementById('victory-coins').innerText = `${coinsCollected} / ${totalCoinsInLevel}`;
            document.getElementById('victory-score').innerText = score;
            document.getElementById('victory-overlay').classList.remove('hidden');
        }

        // --- STREAMING_CHUNK:Implementing retro vector graphics rendering... ---
        function drawBackground() {
            const lvl = levels[currentLevelIndex];
            ctx.fillStyle = lvl.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Parallax Grid / Cyber Aesthetic elements
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offsetX = -(camera.x * 0.3) % gridSize;
            for (let x = offsetX; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Draw Platforms
            for (let p of activePlatforms) {
                if (p.type === 'ground') {
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                } else if (p.type === 'bounce') {
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#fda4af';
                    ctx.fillRect(p.x, p.y + 4, p.w, 4);
                } else {
                    ctx.fillStyle = '#334155';
                    ctx.fillRect(p.x, p.y, p.w, p.h);
                    ctx.fillStyle = '#818cf8';
                    ctx.fillRect(p.x, p.y, p.w, 4);
                }
            }

            // Draw Hazards (Spikes)
            for (let h of activeHazards) {
                ctx.fillStyle = '#e11d48';
                const spikeWidth = 20;
                const count = Math.floor(h.w / spikeWidth);
                for (let i = 0; i < count; i++) {
                    ctx.beginPath();
                    ctx.moveTo(h.x + i * spikeWidth, h.y + h.h);
                    ctx.lineTo(h.x + (i + 0.5) * spikeWidth, h.y);
                    ctx.lineTo(h.x + (i + 1) * spikeWidth, h.y + h.h);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Draw Coins
            for (let c of activeCoins) {
                if (!c.collected) {
                    c.floatOffset += 0.1;
                    const floatY = c.y + Math.sin(c.floatOffset) * 4;
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(c.x, floatY, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(c.x, floatY, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw Exit Door
            if (activeDoor) {
                ctx.fillStyle = '#065f46';
                ctx.fillRect(activeDoor.x, activeDoor.y, activeDoor.w, activeDoor.h);
                ctx.fillStyle = '#34d399';
                ctx.fillRect(activeDoor.x + 4, activeDoor.y + 4, activeDoor.w - 8, activeDoor.h - 4);
                // Portal glow effect
                ctx.fillStyle = '#a7f3d0';
                ctx.fillRect(activeDoor.x + 10, activeDoor.y + 20, activeDoor.w - 20, activeDoor.h - 30);
            }

            // Draw Player (Retro Neon Explorer Robot)
            ctx.fillStyle = '#38bdf8';
            // Body
            ctx.fillRect(player.x, player.y + 12, player.w, player.h - 12);
            // Visor / Head
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(player.x + 4, player.y, player.w - 8, 16);
            ctx.fillStyle = '#22d3ee';
            if (player.facing === 'right') {
                ctx.fillRect(player.x + 16, player.y + 4, 10, 6);
            } else {
                ctx.fillRect(player.x + 6, player.y + 4, 10, 6);
            }
            // Legs / Wheels
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.x + 4, player.y + player.h - 6, 8, 6);
            ctx.fillRect(player.x + player.w - 12, player.y + player.h - 6, 8, 6);

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // --- STREAMING_CHUNK:Implementing game loop and input event listeners... ---
        function gameLoop() {
            updatePhysics();
            updateParticles();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // Input Handlers
        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
            if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
            if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) {
                keys.jump = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
            if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
            if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.jump = false;
        });

        // Mobile Touch Controls Binding
        const bindTouch = (id, keyName) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        bindTouch('touch-left', 'left');
        bindTouch('touch-right', 'right');
        bindTouch('touch-jump', 'jump');

        // --- STREAMING_CHUNK:Wiring UI navigation and menu events... ---
        document.getElementById('btn-start').addEventListener('click', () => {
            sounds.init();
            document.getElementById('menu-overlay').classList.add('hidden');
            lives = 3;
            score = 0;
            loadLevel(0);
            gameState = 'PLAYING';
        });

        document.getElementById('btn-levels').addEventListener('click', () => {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';
            levels.forEach((lvl, idx) => {
                const btn = document.createElement('button');
                btn.className = 'py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl arcade-font text-xs btn-arcade border-b-4 border-slate-900 flex flex-col items-center justify-center space-y-1';
                btn.innerHTML = `<span>STAGE ${lvl.id}</span><span class="text-[10px] text-slate-400">Level ${lvl.id}</span>`;
                btn.addEventListener('click', () => {
                    sounds.init();
                    document.getElementById('level-overlay').classList.add('hidden');
                    lives = 3;
                    score = 0;
                    loadLevel(idx);
                    gameState = 'PLAYING';
                });
                grid.appendChild(btn);
            });
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('level-overlay').classList.remove('hidden');
        });

        document.getElementById('btn-back-menu').addEventListener('click', () => {
            document.getElementById('level-overlay').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('pause-overlay').classList.remove('hidden');
            }
        });

        document.getElementById('btn-resume').addEventListener('click', () => {
            document.getElementById('pause-overlay').classList.add('hidden');
            gameState = 'PLAYING';
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('pause-overlay').classList.add('hidden');
            loadLevel(currentLevelIndex);
            gameState = 'PLAYING';
        });

        document.getElementById('btn-quit').addEventListener('click', () => {
            document.getElementById('pause-overlay').classList.add('hidden');
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('menu-overlay').classList.remove('hidden');
            gameState = 'MENU';
        });

        document.getElementById('btn-try-again').addEventListener('click', () => {
            document.getElementById('gameover-overlay').classList.add('hidden');
            lives = 3;
            score = 0;
            loadLevel(currentLevelIndex);
            gameState = 'PLAYING';
        });

        document.getElementById('btn-gameover-menu').addEventListener('click', () => {
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
            gameState = 'MENU';
        });

        document.getElementById('btn-next-level').addEventListener('click', () => {
            document.getElementById('victory-overlay').classList.add('hidden');
            if (currentLevelIndex + 1 < levels.length) {
                loadLevel(currentLevelIndex + 1);
                gameState = 'PLAYING';
            } else {
                // Return to menu if all levels beaten
                document.getElementById('menu-overlay').classList.remove('hidden');
                gameState = 'MENU';
            }
        });

        document.getElementById('btn-victory-menu').addEventListener('click', () => {
            document.getElementById('victory-overlay').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
            gameState = 'MENU';
        });

        // Start Animation Loop
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
