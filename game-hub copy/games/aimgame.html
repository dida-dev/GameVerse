<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Trainer Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* This wrapper aligns your top UI score and the game container vertically */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Gives space between the score bar and the game */
        }

        #ui {
            display: flex;
            gap: 40px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #game-container {
            width: 800px;
            height: 500px;
            background: #2a2a2a;
            border: 3px solid #555;
            border-radius: 12px;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Perfect flexbox centering inside the game container for screens */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .target {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #ff4757 40%, #ff6b81 40%, #ff6b81 60%, #fff 60%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        #start-screen {
            text-align: center;
            z-index: 10;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #26af5f;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="menu">
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Time Left: <span id="timer">30</span>s</div>
        </div>

        <div id="game-container">
            <div id="start-screen">
                <h1>🎯 Aim Trainer</h1>
                <p>Click the targets as fast as you can!</p>
                <button onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let targetInterval = null;
        let isPlaying = false;

        function startGame() {
            container.innerHTML = '';
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            isPlaying = true;

            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnTarget();
            targetInterval = setInterval(spawnTarget, 700);
        }

        function spawnTarget() {
            if (!isPlaying) return;

            const target = document.createElement('div');
            target.classList.add('target');

            const padding = 40;
            const maxX = container.clientWidth - padding * 2;
            const maxY = container.clientHeight - padding * 2;
            const x = Math.random() * maxX + padding;
            const y = Math.random() * maxY + padding;

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;

            target.addEventListener('click', (e) => {
                e.stopPropagation();
                score += 10;
                scoreDisplay.textContent = score;
                target.remove();
            });

            container.appendChild(target);

            setTimeout(() => {
                if (target.parentElement) {
                    target.remove();
                }
            }, 1200);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(targetInterval);

            container.innerHTML = `
                <div id="start-screen">
                    <h1>Game Over! 🎉</h1>
                    <p>Your Final Score: <strong>${score}</strong></p>
                    <button onclick="startGame()">Play Again</button>
                </div>
            `;
        }
    </script>
</body>
</html>
