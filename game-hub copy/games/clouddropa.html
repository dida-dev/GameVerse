<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cloud Drop: Starry Sky Weaver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09091b;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09091b 100%);
        }
    </style>
</head>
<body>

<div id="game-container">
    <header class="flex justify-between items-center px-5 py-3.5 bg-black/40 border-b border-indigo-500/20 z-10 backdrop-blur-md">
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-indigo-300 uppercase mb-0.5">Constellations</div>
            <div id="score-val" class="text-lg font-extrabold text-white">0</div>
        </div>
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-indigo-300 uppercase mb-0.5">Night Glow (Life)</div>
            <div id="lives-val" class="text-base font-extrabold text-amber-300">⭐⭐⭐</div>
        </div>
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-indigo-300 uppercase mb-0.5">Best</div>
            <div id="high-score-val" class="text-lg font-extrabold text-white">0</div>
        </div>
    </header>

    <div class="relative flex-grow flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Virtual Joystick for mobile/touch -->
        <div id="joystick-base" class="absolute bottom-6 left-6 w-28 h-28 rounded-full bg-white/10 border-2 border-white/20 hidden touch-none z-20 flex items-center justify-center backdrop-blur-sm">
            <div id="joystick-thumb" class="absolute w-12 h-12 rounded-full bg-indigo-400/90 shadow-lg pointer-events-none transition-transform duration-75"></div>
        </div>
    </div>

    <footer class="px-5 py-3 flex justify-around bg-black/50 border-t border-indigo-500/20 z-10 backdrop-blur-md">
        <button id="sound-btn" class="bg-gradient-to-r from-indigo-600 to-purple-600 border-none text-white px-4 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Audio: ON</button>
        <button id="control-mode-btn" class="bg-gradient-to-r from-purple-600 to-pink-600 border-none text-white px-4 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Mode: Follow</button>
        <button id="restart-btn" class="bg-gradient-to-r from-indigo-600 to-purple-600 border-none text-white px-4 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Restart</button>
    </footer>

    <div id="overlay" class="absolute inset-0 bg-[#09091b]/92 backdrop-blur-xl flex flex-col items-center justify-center z-100 transition-opacity duration-300 px-6 text-center">
        <div class="text-5xl mb-3 animate-pulse">☁️✨</div>
        <h1 class="text-3xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-pink-300">CLOUD DROP</h1>
        <p class="text-indigo-200 text-xs mb-6 leading-relaxed max-w-xs">
            Glide your little cloud spirit across the celestial night sky to weave shining stars into constellations before they fade away. Avoid storm clouds! Use <b>WASD / Arrows</b>, <b>On-Screen Joystick</b>, or <b>Mouse Follow</b>.
        </p>
        <button id="start-btn" class="bg-gradient-to-r from-indigo-500 to-pink-600 border-none text-white px-8 py-3.5 text-base font-extrabold rounded-full cursor-pointer shadow-2xl active:scale-95 transition-transform">WEAVE THE SKIES</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameActive = false;
    let score = 0;
    let highScore = localStorage.getItem('cloud_drop_high_v1') || 0;
    let lives = 3;
    let soundEnabled = true;
    let controlMode = 'follow'; // 'follow' or 'keys'

    document.getElementById('high-score-val').innerText = highScore;

    // Cloud Spirit entity
    let cloud = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        speed: 4.5,
        radius: 20,
        targetX: canvas.width / 2,
        targetY: canvas.height / 2
    };

    let stars = [];
    let currentConstellation = []; // indices or star objects connected so far
    let activeConstellationGoal = 3; // number of stars needed to complete one constellation
    let stormClouds = [];
    let particles = [];
    let stardust = [];

    // Keyboard state
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    // Joystick state
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };
    let joystickVector = { x: 0, y: 0 };
    const joystickBase = document.getElementById('joystick-base');
    const joystickThumb = document.getElementById('joystick-thumb');

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!soundEnabled || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function sfxTouchStar() { playTone(523.25, 'sine', 0.1, 0.12); }
    function sfxCompleteConstellation() {
        playTone(587.33, 'triangle', 0.15, 0.15);
        setTimeout(() => playTone(880, 'triangle', 0.25, 0.15), 100);
    }
    function sfxStorm() { playTone(120, 'sawtooth', 0.25, 0.15); }

    function updatePointer(clientX, clientY) {
        if (controlMode !== 'follow') return;
        const rect = canvas.getBoundingClientRect();
        cloud.targetX = clientX - rect.left;
        cloud.targetY = clientY - rect.top;
    }

    canvas.addEventListener('mousemove', (e) => { updatePointer(e.clientX, e.clientY); });
    canvas.addEventListener('touchmove', (e) => {
        if (controlMode === 'follow' && e.touches.length > 0) {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });
    canvas.addEventListener('touchstart', (e) => {
        initAudio();
        if (controlMode === 'follow' && e.touches.length > 0) {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
        initAudio();
        if (keys.hasOwnProperty(e.key) || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            keys[e.key] = true;
            if (controlMode === 'follow') setControlMode('keys');
        }
    });
    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key) || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            keys[e.key] = false;
        }
    });

    joystickBase.addEventListener('touchstart', (e) => {
        initAudio();
        joystickActive = true;
        const rect = joystickBase.getBoundingClientRect();
        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (!joystickActive) return;
        for (let i = 0; i < e.touches.length; i++) {
            updateJoystick(e.touches[i].clientX, e.touches[i].clientY);
        }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
        if (joystickActive) {
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickThumb.style.transform = `translate(0px, 0px)`;
        }
    });

    function updateJoystick(clientX, clientY) {
        const dx = clientX - joystickCenter.x;
        const dy = clientY - joystickCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 38;
        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);

        joystickVector.x = (Math.cos(angle) * clampedDist) / maxDist;
        joystickVector.y = (Math.sin(angle) * clampedDist) / maxDist;
        joystickThumb.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
    }

    function setControlMode(mode) {
        controlMode = mode;
        const btn = document.getElementById('control-mode-btn');
        if (controlMode === 'follow') {
            btn.innerText = "Mode: Follow";
            joystickBase.classList.add('hidden');
            canvas.style.cursor = 'none';
        } else {
            btn.innerText = "Mode: Joystick/WASD";
            joystickBase.classList.remove('hidden');
            canvas.style.cursor = 'default';
        }
    }

    document.getElementById('control-mode-btn').addEventListener('click', () => {
        setControlMode(controlMode === 'follow' ? 'keys' : 'follow');
    });

    function spawnStar() {
        stars.push({
            x: 40 + Math.random() * (canvas.width - 80),
            y: 50 + Math.random() * (canvas.height - 100),
            life: 1.0, // fades over time
            decay: 0.0015 + Math.random() * 0.002,
            radius: 10,
            pulse: Math.random() * Math.PI
        });
    }

    function spawnStormCloud() {
        stormClouds.push({
            x: Math.random() < 0.5 ? -40 : canvas.width + 40,
            y: Math.random() * canvas.height,
            vx: (Math.random() < 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.5),
            vy: (Math.random() - 0.5) * 1.2,
            radius: 22
        });
    }

    function initLevel() {
        stars = [];
        currentConstellation = [];
        stormClouds = [];

        for (let i = 0; i < 5; i++) spawnStar();
        for (let i = 0; i < 2; i++) spawnStormCloud();

        stardust = [];
        for (let i = 0; i < 25; i++) {
            stardust.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: 1 + Math.random() * 1.8,
                alpha: 0.2 + Math.random() * 0.6
            });
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 3;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: 2.5 + Math.random() * 2.5
            });
        }
    }

    function update() {
        if (!gameActive) return;

        if (controlMode === 'follow') {
            const dx = cloud.targetX - cloud.x;
            const dy = cloud.targetY - cloud.y;
            cloud.x += dx * 0.15;
            cloud.y += dy * 0.15;
        } else {
            let dx = 0;
            let dy = 0;

            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;

            if (joystickActive && (Math.abs(joystickVector.x) > 0.05 || Math.abs(joystickVector.y) > 0.05)) {
                dx = joystickVector.x;
                dy = joystickVector.y;
            }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            cloud.x += dx * cloud.speed;
            cloud.y += dy * cloud.speed;
        }

        // Screen boundary clamp
        cloud.x = Math.max(cloud.radius, Math.min(canvas.width - cloud.radius, cloud.x));
        cloud.y = Math.max(cloud.radius, Math.min(canvas.height - cloud.radius, cloud.y));

        // Update stars (fading over time)
        for (let i = stars.length - 1; i >= 0; i--) {
            let s = stars[i];
            s.life -= s.decay;
            s.pulse += 0.08;

            // Check if faded completely
            if (s.life <= 0) {
                // If it was part of active constellation, remove from current constellation
                const indexInConstellation = currentConstellation.indexOf(s);
                if (indexInConstellation !== -1) {
                    currentConstellation.splice(indexInConstellation);
                }
                stars.splice(i, 1);
                spawnStar();
                continue;
            }

            // Check collision with cloud spirit to weave star into constellation
            const dist = Math.hypot(cloud.x - s.x, cloud.y - s.y);
            if (dist < cloud.radius + s.radius) {
                if (!currentConstellation.includes(s)) {
                    sfxTouchStar();
                    currentConstellation.push(s);
                    spawnParticles(s.x, s.y, '#93c5fd');

                    // Check if constellation is completed (e.g., 3 or 4 connected stars)
                    if (currentConstellation.length >= activeConstellationGoal) {
                        sfxCompleteConstellation();
                        score += 50;
                        document.getElementById('score-val').innerText = score;
                        spawnParticles(cloud.x, cloud.y, '#f472b6');

                        // Clear constellation and respawn fresh stars
                        currentConstellation = [];
                        stars = [];
                        for (let j = 0; j < 5; j++) spawnStar();

                        // Add storm cloud as difficulty increases
                        if (score % 150 === 0 && stormClouds.length < 5) {
                            spawnStormCloud();
                        }
                    }
                }
            }
        }

        // Ensure minimum stars on screen
        while (stars.length < 5) {
            spawnStar();
        }

        // Update storm clouds (obstacles)
        stormClouds.forEach(storm => {
            storm.x += storm.vx;
            storm.y += storm.vy;

            if (storm.x < -50) storm.x = canvas.width + 50;
            if (storm.x > canvas.width + 50) storm.x = -50;
            if (storm.y < -50 || storm.y > canvas.height + 50) storm.vy *= -1;

            const dist = Math.hypot(cloud.x - storm.x, cloud.y - storm.y);
            if (dist < cloud.radius + storm.radius) {
                sfxStorm();
                lives--;
                updateLivesUI();
                spawnParticles(cloud.x, cloud.y, '#ef4444');

                // Bounce away
                storm.vx *= -1;
                cloud.x += (Math.random() - 0.5) * 60;
                cloud.y += (Math.random() - 0.5) * 60;

                if (lives <= 0) {
                    endGame();
                }
            }
        });

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.035;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function updateLivesUI() {
        let h = '';
        for (let i = 0; i < lives; i++) h += '⭐';
        document.getElementById('lives-val').innerText = h;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background stardust
        stardust.forEach(sd => {
            ctx.fillStyle = `rgba(255, 255, 255, ${sd.alpha})`;
            ctx.beginPath();
            ctx.arc(sd.x, sd.y, sd.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Constellation weaving lines connecting collected stars
        if (currentConstellation.length > 1) {
            ctx.save();
            ctx.strokeStyle = 'rgba(147, 197, 253, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(currentConstellation[0].x, currentConstellation[0].y);
            for (let i = 1; i < currentConstellation.length; i++) {
                ctx.lineTo(currentConstellation[i].x, currentConstellation[i].y);
            }
            // Also link last collected star to current cloud position for magical feel
            ctx.lineTo(cloud.x, cloud.y);
            ctx.stroke();
            ctx.restore();
        }

        // Draw Stars
        stars.forEach(s => {
            const isConnected = currentConstellation.includes(s);
            const scalePulse = Math.sin(s.pulse) * 2;
            ctx.save();
            ctx.translate(s.x, s.y);

            // Glow
            ctx.shadowBlur = isConnected ? 16 : 10;
            ctx.shadowColor = isConnected ? '#f472b6' : '#93c5fd';

            ctx.fillStyle = isConnected ? '#f472b6' : `rgba(254, 240, 138, ${s.life})`;
            ctx.beginPath();
            ctx.arc(0, 0, s.radius + scaleValue(scalePulse), 0, Math.PI * 2);
            ctx.fill();

            // Star sparkles symbol
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(isConnected ? '💖' : '✨', 0, 0);

            // Fading ring indicator
            if (!isConnected) {
                ctx.strokeStyle = `rgba(147, 197, 253, ${s.life * 0.6})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, (s.radius + 6) * (2 - s.life), 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        });

        // Draw Storm Clouds (Obstacles)
        stormClouds.forEach(storm => {
            ctx.save();
            ctx.translate(storm.x, storm.y);
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(0, 0, storm.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚡', 0, 0);
            ctx.restore();
        });

        // Draw Cloud Spirit
        ctx.save();
        ctx.translate(cloud.x, cloud.y);

        // Soft aura glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#818cf8';

        ctx.fillStyle = 'rgba(241, 245, 249, 0.9)';
        ctx.beginPath();
        ctx.arc(0, 0, cloud.radius, 0, Math.PI * 2);
        ctx.fill();

        // Fluffy cloud puffs
        ctx.beginPath();
        ctx.arc(-8, -4, 10, 0, Math.PI * 2);
        ctx.arc(8, -4, 10, 0, Math.PI * 2);
        ctx.arc(0, -10, 12, 0, Math.PI * 2);
        ctx.fill();

        // Cute face
        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.arc(-5, 2, 2, 0, Math.PI * 2);
        ctx.arc(5, 2, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Draw Particles
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function scaleValue(val) {
        return Math.max(-2, Math.min(2, val));
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function startGame() {
        initAudio();
        score = 0;
        lives = 3;
        gameActive = true;
        document.getElementById('score-val').innerText = score;
        updateLivesUI();
        initLevel();

        cloud.x = canvas.width / 2;
        cloud.y = canvas.height / 2;
        cloud.targetX = cloud.x;
        cloud.targetY = cloud.y;

        const overlay = document.getElementById('overlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
    }

    function endGame() {
        gameActive = false;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('cloud_drop_high_v1', highScore);
            document.getElementById('high-score-val').innerText = highScore;
        }

        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.opacity = '1', 10);

        overlay.querySelector('div').innerText = "🌌✨";
        overlay.querySelector('h1').innerText = "NIGHT REST";
        overlay.querySelector('p').innerText = `Constellations Weaved: ${score}\nBest Score: ${highScore}`;
        document.getElementById('start-btn').innerText = "WEAVE AGAIN";
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', () => {
        endGame();
        startGame();
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? "Audio: ON" : "Audio: OFF";
    });

    initLevel();
    loop();
</script>

</body>
</html>
