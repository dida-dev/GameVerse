<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Rush — Obby Generator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050816;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, #17215c 0%, transparent 35%),
        linear-gradient(#050816, #09051c);
    }

    /* Background stars */
    #game::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.45;
      background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, #6df 1px, transparent 1px);
      background-size: 70px 70px, 110px 110px;
      background-position: 10px 20px, 40px 60px;
    }

    #world {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 6000px;
      height: 100%;
      will-change: transform;
    }

    .platform {
      position: absolute;
      height: 30px;
      border-radius: 12px;
      background: linear-gradient(90deg, #00eaff, #7b2cff);
      box-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(123, 44, 255, 0.8);
    }

    .platform::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -7px;
      height: 7px;
      border-radius: 0 0 10px 10px;
      background: rgba(0, 234, 255, 0.25);
    }

    .danger {
      position: absolute;
      height: 25px;
      border-radius: 8px;
      background: #ff1744;
      box-shadow:
        0 0 12px #ff1744,
        0 0 30px rgba(255, 23, 68, 0.8);
    }

    .finish {
      position: absolute;
      width: 70px;
      height: 110px;
      border: 4px solid #00ff9d;
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      box-shadow: 0 0 30px #00ff9d;
    }

    .finish::before {
      content: "FINISH";
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ff9d;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #00ff9d;
    }

    #player {
      position: absolute;
      width: 32px;
      height: 42px;
      border-radius: 9px;
      background: linear-gradient(135deg, #fff, #00eaff 45%, #7b2cff);
      box-shadow:
        0 0 12px #00eaff,
        0 0 30px #7b2cff;
      z-index: 20;
      will-change: left, top;
    }

    #player::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: #07101e;
      border-radius: 50%;
      top: 9px;
      left: 7px;
      box-shadow: 11px 0 #07101e;
    }

    #hud {
      position: fixed;
      z-index: 100;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92%, 700px);
    }

    .hud-card {
      background: rgba(7, 12, 32, 0.75);
      border: 1px solid rgba(0, 234, 255, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    .title {
      font-weight: 900;
      letter-spacing: 2px;
      color: #00eaff;
      text-shadow: 0 0 12px #00eaff;
    }

    .progress {
      height: 8px;
      background: #11172d;
    }

    .progress-bar {
      background: linear-gradient(90deg, #00eaff, #7b2cff, #ff2bd6);
      box-shadow: 0 0 12px #7b2cff;
    }

    #message {
      position: fixed;
      z-index: 200;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.8);
      width: min(90%, 480px);
      text-align: center;
      padding: 35px;
      border-radius: 25px;
      background: rgba(5, 8, 22, .94);
      border: 1px solid #00eaff;
      box-shadow: 0 0 60px rgba(0, 234, 255, .3);
      opacity: 0;
      pointer-events: none;
      transition: .3s;
    }

    #message.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    #message h1 {
      font-weight: 900;
      color: #00ff9d;
      text-shadow: 0 0 20px #00ff9d;
    }

    #controls {
      position: fixed;
      z-index: 100;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }

    .control-btn {
      width: 65px;
      height: 65px;
      border: 1px solid rgba(0, 234, 255, .4);
      border-radius: 18px;
      background: rgba(7, 12, 32, .8);
      color: white;
      font-size: 25px;
      box-shadow: 0 0 20px rgba(0,234,255,.15);
      touch-action: none;
    }

    .control-btn:active {
      background: #00eaff;
      color: #06101c;
      transform: scale(.94);
    }

    #tip {
      position: fixed;
      z-index: 100;
      bottom: 18px;
      right: 20px;
      color: rgba(255,255,255,.5);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      #tip {
        display: none;
      }

      .hud-card {
        padding: 10px;
      }

      .title {
        font-size: 14px;
      }

      #controls {
        bottom: 15px;
      }

      .control-btn {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div class="hud-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div class="title">⚡ NEON RUSH</div>
        <div>
          <span id="deaths">☠ 0</span>
          <span class="ms-3">⏱ <span id="timer">0.0</span>s</span>
        </div>
      </div>

      <div class="progress">
        <div id="progressBar" class="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div id="world">
    <div id="player"></div>
  </div>

  <div id="message">
    <h1>🏆 YOU WON!</h1>
    <p class="lead mb-2">You conquered the random obby generator.</p>
    <p>Your time: <strong id="finalTime">0</strong>s</p>
    <button class="btn btn-lg btn-info fw-bold" onclick="restart()">
      PLAY AGAIN (NEW LEVEL)
    </button>
  </div>

  <div id="controls">
    <button class="control-btn" id="left">◀</button>
    <button class="control-btn" id="jump">▲</button>
    <button class="control-btn" id="right">▶</button>
  </div>

  <div id="tip">
    A / D or ← / → to move • Space to jump
  </div>

</div>

<script>
  const world = document.getElementById("world");
  const progressBar = document.getElementById("progressBar");
  const timerEl = document.getElementById("timer");
  const deathsEl = document.getElementById("deaths");
  const message = document.getElementById("message");
  const finalTime = document.getElementById("finalTime");

  let player = document.getElementById("player");
  let platforms = [];
  let dangers = [];
  let finish = null;
  let finishX = 4000;

  const keys = {
    left: false,
    right: false
  };

  let x = 100;
  let y = 100;
  let vx = 0;
  let vy = 0;

  let grounded = false;
  let coyoteTimer = 0;
  let jumpBufferTimer = 0;

  let deaths = 0;
  let startTime = performance.now();
  let won = false;

  const gravity = 0.7;
  const moveSpeed = 0.85;
  const maxSpeed = 7.5;
  const jumpPower = 14.5;

  const playerWidth = 32;
  const playerHeight = 42;

  function generateLevel() {
    // Clear old elements from world except player
    world.innerHTML = '<div id="player"></div>';
    player = document.getElementById("player");
    platforms = [];
    dangers = [];

    let curX = 0;
    let curY = window.innerHeight * 0.78;
    const totalSteps = 16;

    // 1. Safe starting platform
    createPlatform(curX, curY, 320);
    curX += 320;

    for (let i = 0; i < totalSteps; i++) {
      const gap = Math.floor(Math.random() * 50) + 75; // 75px to 125px gap
      curX += gap;

      const heightDelta = (Math.random() - 0.5) * 160;
      curY = Math.max(window.innerHeight * 0.35, Math.min(window.innerHeight * 0.8, curY + heightDelta));

      const pWidth = Math.floor(Math.random() * 60) + 150; // 150px to 210px width

      // Danger block in the gap
      createDanger(curX - gap + 5, curY + 60, gap - 10);

      // Platform
      createPlatform(curX, curY, pWidth);
      curX += pWidth;
    }

    // Finish line at the end
    finishX = curX + 60;
    createFinish(finishX, curY - 80);
  }

  function createPlatform(left, topPx, width) {
    const p = document.createElement("div");
    p.className = "platform";
    p.style.left = left + "px";
    p.style.top = (topPx / window.innerHeight) * 100 + "%";
    p.style.width = width + "px";
    world.appendChild(p);
    platforms.push(p);
  }

  function createDanger(left, topPx, width) {
    const d = document.createElement("div");
    d.className = "danger";
    d.style.left = left + "px";
    d.style.top = (topPx / window.innerHeight) * 100 + "%";
    d.style.width = width + "px";
    world.appendChild(d);
    dangers.push(d);
  }

  function createFinish(left, topPx) {
    const f = document.createElement("div");
    f.className = "finish";
    f.style.left = left + "px";
    f.style.top = (topPx / window.innerHeight) * 100 + "%";
    world.appendChild(f);
    finish = f;
  }

  function rectsOverlap(a, b) {
    return (
      a.left < b.right &&
      a.right > b.left &&
      a.top < b.bottom &&
      a.bottom > b.top
    );
  }

  function getPlayerRect() {
    return {
      left: x,
      right: x + playerWidth,
      top: y,
      bottom: y + playerHeight
    };
  }

  function getPlatformRect(el) {
    return {
      left: el.offsetLeft,
      right: el.offsetLeft + el.offsetWidth,
      top: el.offsetTop,
      bottom: el.offsetTop + el.offsetHeight
    };
  }

  function resetPlayer() {
    x = 100;
    y = window.innerHeight * 0.78 - playerHeight - 10;
    vx = 0;
    vy = 0;
    coyoteTimer = 0;
    jumpBufferTimer = 0;
  }

  function die() {
    if (won) return;
    deaths++;
    deathsEl.textContent = "☠ " + deaths;
    resetPlayer();
  }

  function jump() {
    if (!won) {
      jumpBufferTimer = 10;
    }
  }

  function updatePhysics() {
    if (won) return;

    if (keys.left) vx -= moveSpeed;
    if (keys.right) vx += moveSpeed;

    if (!keys.left && !keys.right) {
      vx *= 0.82;
    }

    vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));

    const oldY = y;

    vy += gravity;
    y += vy;
    x += vx;

    grounded = false;

    // Platform collision
    for (const platform of platforms) {
      const r = getPlatformRect(platform);
      const playerRect = getPlayerRect();

      const horizontal =
        playerRect.right > r.left &&
        playerRect.left < r.right;

      const wasAbove = oldY + playerHeight <= r.top;
      const nowBelow = y + playerHeight >= r.top;

      if (
        horizontal &&
        wasAbove &&
        nowBelow &&
        vy >= 0
      ) {
        y = r.top - playerHeight;
        vy = 0;
        grounded = true;
      }
    }

    // Coyote time
    if (grounded) {
      coyoteTimer = 10;
    } else if (coyoteTimer > 0) {
      coyoteTimer--;
    }

    // Jump buffer
    if (jumpBufferTimer > 0) {
      jumpBufferTimer--;
    }

    if (jumpBufferTimer > 0 && (grounded || coyoteTimer > 0)) {
      vy = -jumpPower;
      grounded = false;
      coyoteTimer = 0;
      jumpBufferTimer = 0;
    }

    // Danger collision
    const p = getPlayerRect();
    for (const danger of dangers) {
      const d = {
        left: danger.offsetLeft,
        right: danger.offsetLeft + danger.offsetWidth,
        top: danger.offsetTop,
        bottom: danger.offsetTop + danger.offsetHeight
      };

      if (rectsOverlap(p, d)) {
        die();
        return;
      }
    }

    // Fall out of bounds
    if (y > window.innerHeight + 100) {
      die();
      return;
    }

    if (x < 0) {
      x = 0;
      vx = 0;
    }

    // Finish collision
    if (finish) {
      const finishRect = {
        left: finish.offsetLeft,
        right: finish.offsetLeft + finish.offsetWidth,
        top: finish.offsetTop,
        bottom: finish.offsetTop + finish.offsetHeight
      };

      if (rectsOverlap(p, finishRect)) {
        win();
      }
    }
  }

  function updateCamera() {
    const screenCenter = window.innerWidth * 0.38;
    let cameraX = x - screenCenter;

    cameraX = Math.max(0, Math.min(cameraX, finishX - window.innerWidth + 200));

    world.style.transform = `translateX(${-cameraX}px)`;

    const progress = Math.min(
      100,
      Math.max(0, (x / finishX) * 100)
    );

    progressBar.style.width = progress + "%";
  }

  function render() {
    player.style.left = x + "px";
    player.style.top = y + "px";
  }

  function win() {
    won = true;
    const time = ((performance.now() - startTime) / 1000).toFixed(1);
    finalTime.textContent = time;
    message.classList.add("show");
  }

  function restart() {
    won = false;
    message.classList.remove("show");
    deaths = 0;
    deathsEl.textContent = "☠ 0";
    generateLevel();
    startTime = performance.now();
    resetPlayer();
  }

  function gameLoop() {
    updatePhysics();
    updateCamera();
    render();

    if (!won) {
      timerEl.textContent = ((performance.now() - startTime) / 1000).toFixed(1);
    }

    requestAnimationFrame(gameLoop);
  }

  // Keyboard events
  document.addEventListener("keydown", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      jump();
    }
    if (e.code === "KeyR") restart();
  });

  document.addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  });

  // Mobile controls
  function setupButton(btn, onDown, onUp) {
    btn.addEventListener("pointerdown", e => { e.preventDefault(); onDown(); });
    btn.addEventListener("pointerup", e => { e.preventDefault(); onUp(); });
    btn.addEventListener("pointercancel", onUp);
    btn.addEventListener("pointerleave", onUp);
  }

  setupButton(document.getElementById("left"), () => keys.left = true, () => keys.left = false);
  setupButton(document.getElementById("right"), () => keys.right = true, () => keys.right = false);

  document.getElementById("jump").addEventListener("pointerdown", e => {
    e.preventDefault();
    jump();
  });

  // Initialize first random level
  generateLevel();
  resetPlayer();
  gameLoop();
</script>

</body>
</html>
