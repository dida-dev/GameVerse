<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Drift Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background: #030712; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: none; }
        h1 { font-size: 1.5rem; margin-bottom: 2px; color: #00ffcc; text-shadow: 0 0 12px rgba(0,255,204,0.6); letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px; text-align: center; }
        .game-container { position: relative; background: #0b0f19; border: 2px solid #1f293d; border-radius: 12px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        canvas { display: block; background: #050811; border-radius: 8px; width: 100%; max-width: 480px; height: auto; aspect-ratio: 4 / 5; }
        .ui-panel { display: flex; justify-content: space-between; width: 100%; max-width: 496px; margin-top: 8px; font-size: 0.85rem; font-weight: bold; }
        .stat { background: #111827; padding: 6px 12px; border-radius: 6px; border: 1px solid #1f293d; }
        .stat span { color: #00ffcc; }
        .controls { display: flex; justify-content: space-between; width: 100%; max-width: 496px; margin-top: 10px; gap: 10px; }
        .btn-ctrl { background: #1f293d; color: #00ffcc; border: 2px solid #374151; font-size: 1.5rem; font-weight: bold; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 1; }
        .btn-ctrl:active { background: #00ffcc; color: #050811; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.5); }
    </style>
</head>
<body>

    <h1>CYBER-DRIFT RUNNER</h1>
    <p>Dodge incoming firewalls and collect data cores! Use A/D, Left/Right arrows, or touch buttons.</p>

    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
    </div>

    <div class="ui-panel">
        <div class="stat">SCORE: <span id="scoreVal">0</span></div>
        <div class="stat">COMBO: <span id="comboVal">x1</span></div>
        <div class="stat">SHIELD: <span id="shieldVal">100</span>%</div>
    </div>

    <div class="controls">
        <button class="btn-ctrl" id="leftBtn">&#9664; LEFT</button>
        <button class="btn-ctrl" id="rightBtn">RIGHT &#9654;</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let combo = 1;
let shield = 100;
let gameRunning = true;
let frameCount = 0;
let gameSpeed = 4;

// Player Ship
let player = {
    x: 200,
    y: 420,
    w: 32,
    h: 32,
    targetX: 200,
    speed: 0.2
};

let obstacles = [];
let particles = [];

// Input state
let keys = { left: false, right: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Touch support
const setupTouch = (id, dir) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[dir] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[dir] = false; });
    btn.addEventListener('mousedown', () => { keys[dir] = true; });
    btn.addEventListener('mouseup', () => { keys[dir] = false; });
};
setupTouch('leftBtn', 'left');
setupTouch('rightBtn', 'right');

function spawnParticle(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 25,
            color: color
        });
    }
}

function update() {
    if (!gameRunning) return;

    frameCount++;
    gameSpeed = 4 + Math.floor(score / 500);

    // Movement logic
    if (keys.left) player.targetX -= 7;
    if (keys.right) player.targetX += 7;
    player.targetX = Math.max(30, Math.min(canvas.width - 30, player.targetX));
    player.x += (player.targetX - player.x) * 0.3;

    // Spawn obstacles & data cores
    if (frameCount % Math.max(25, 60 - Math.floor(score / 300)) === 0) {
        let isCore = Math.random() > 0.35;
        obstacles.push({
            x: 40 + Math.random() * (canvas.width - 80),
            y: -40,
            w: isCore ? 22 : 36,
            h: isCore ? 22 : 36,
            type: isCore ? 'core' : 'firewall',
            speed: gameSpeed + (isCore ? 0 : Math.random() * 2)
        });
    }

    // Update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        // Collision check with player
        if (
            player.x - player.w/2 < obs.x + obs.w/2 &&
            player.x + player.w/2 > obs.x - obs.w/2 &&
            player.y - player.h/2 < obs.y + obs.h/2 &&
            player.y + player.h/2 > obs.y - obs.h/2
        ) {
            if (obs.type === 'core') {
                score += 50 * combo;
                combo = Math.min(5, combo + 1);
                spawnParticle(obs.x, obs.y, '#00ffcc');
            } else {
                shield -= 25;
                combo = 1;
                spawnParticle(obs.x, obs.y, '#ef4444');
                if (shield <= 0) {
                    shield = 0;
                    gameRunning = false;
                }
            }
            obstacles.splice(i, 1);
            continue;
        }

        // Remove offscreen
        if (obs.y > canvas.height + 50) {
            obstacles.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    score += 1;
}

function draw() {
    ctx.fillStyle = '#050811';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw grid lines moving down for speed effect
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 1;
    let offset = (frameCount * gameSpeed) % 40;
    for (let y = offset; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Draw obstacles & cores
    for (let obs of obstacles) {
        ctx.save();
        ctx.translate(obs.x, obs.y);
        if (obs.type === 'core') {
            ctx.fillStyle = '#00ffcc';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 10;
            ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
        } else {
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.fillRect(-obs.w/2, -obs.h/2, obs.w, obs.h);
        }
        ctx.restore();
    }

    // Draw particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    }

    // Draw Player Ship
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(0, -player.h/2);
    ctx.lineTo(player.w/2, player.h/2);
    ctx.lineTo(-player.w/2, player.h/2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Game Over Overlay
    if (!gameRunning) {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("SYSTEM CRASHED", canvas.width/2, canvas.height/2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.fillText("Tap or press R to Reboot", canvas.width/2, canvas.height/2 + 20);
    }

    // Update UI Elements
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('comboVal').innerText = 'x' + combo;
    document.getElementById('shieldVal').innerText = shield;
}

window.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && !gameRunning) {
        score = 0;
        shield = 100;
        combo = 1;
        obstacles = [];
        particles = [];
        gameRunning = true;
    }
});

canvas.addEventListener('click', () => {
    if (!gameRunning) {
        score = 0;
        shield = 100;
        combo = 1;
        obstacles = [];
        particles = [];
        gameRunning = true;
    }
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
