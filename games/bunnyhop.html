<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meadow Maze: The Lost Bunny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1e293b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1b4332 0%, #081c15 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
            background: #2d6a4f;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header class="flex justify-between items-center px-5 py-4 bg-black/30 border-b border-white/10 z-10">
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-emerald-300 uppercase mb-0.5">Carrots</div>
            <div id="score-val" class="text-lg font-extrabold text-white">0</div>
        </div>
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-emerald-300 uppercase mb-0.5">Lives</div>
            <div id="lives-val" class="text-lg font-extrabold text-white">❤️❤️❤️</div>
        </div>
        <div class="text-center">
            <div class="text-[10px] tracking-widest text-emerald-300 uppercase mb-0.5">Best</div>
            <div id="high-score-val" class="text-lg font-extrabold text-white">0</div>
        </div>
    </header>

    <div class="relative flex-grow flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Virtual Joystick Overlay for Mobile -->
        <div id="joystick-base" class="absolute bottom-6 left-6 w-28 h-28 rounded-full bg-black/20 border-2 border-white/20 hidden touch-none z-20 flex items-center justify-center">
            <div id="joystick-thumb" class="absolute w-12 h-12 rounded-full bg-emerald-400/80 shadow-lg pointer-events-none transition-transform duration-75"></div>
        </div>
    </div>

    <footer class="px-5 py-3 flex justify-around bg-black/40 border-t border-white/10 z-10">
        <button id="sound-btn" class="bg-gradient-to-r from-emerald-600 to-teal-700 border-none text-white px-5 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Audio: ON</button>
        <button id="control-mode-btn" class="bg-gradient-to-r from-teal-600 to-cyan-700 border-none text-white px-4 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Mode: Follow</button>
        <button id="restart-btn" class="bg-gradient-to-r from-emerald-600 to-teal-700 border-none text-white px-5 py-2 text-xs font-bold rounded-full cursor-pointer shadow-lg active:scale-95 transition-transform">Restart</button>
    </footer>

    <div id="overlay" class="absolute inset-0 bg-[#081c15]/90 backdrop-blur-md flex flex-col items-center justify-center z-100 transition-opacity duration-300">
        <h1 class="text-3xl font-bold mb-2 text-emerald-300 text-center drop-shadow-md">MEADOW MAZE</h1>
        <p class="text-emerald-100 text-xs mb-6 text-center px-6 leading-relaxed">
            Guide the bunny through the labyrinth! Use <b>WASD / Arrows</b>, the <b>On-Screen Joystick</b>, or switch to <b>Mouse Follow</b> mode. Collect carrots & avoid hedgehogs!
        </p>
        <button id="start-btn" class="bg-gradient-to-r from-emerald-500 to-teal-600 border-none text-white px-8 py-3 text-base font-extrabold rounded-full cursor-pointer shadow-xl active:scale-95 transition-transform">START EXPLORING</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameActive = false;
    let score = 0;
    let highScore = localStorage.getItem('meadow_maze_high_v2') || 0;
    let lives = 3;
    let soundEnabled = true;
    let controlMode = 'follow'; // 'follow' or 'keys' (WASD/Joystick)

    document.getElementById('high-score-val').innerText = highScore;

    // Maze Grid Settings
    const cols = 9;
    const rows = 13;
    let cellSize = Math.min(canvas.width / cols, canvas.height / rows);

    // Bunny Entity
    let bunny = {
        x: cellSize * 1.5,
        y: cellSize * 1.5,
        vx: 0,
        vy: 0,
        speed: 2.8,
        radius: 12,
        targetX: cellSize * 1.5,
        targetY: cellSize * 1.5
    };

    let maze = [];
    let carrots = [];
    let hedgehogs = [];
    let particles = [];

    // Keyboard state
    let keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    // Joystick state
    let joystickActive = false;
    let joystickCenter = { x: 0, y: 0 };
    let joystickVector = { x: 0, y: 0 };
    const joystickBase = document.getElementById('joystick-base');
    const joystickThumb = document.getElementById('joystick-thumb');

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!soundEnabled || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function sfxCarrot() { playTone(650, 'sine', 0.1, 0.12); }
    function sfxHit() { playTone(120, 'sawtooth', 0.25, 0.15); }

    function updatePointer(clientX, clientY) {
        if (controlMode !== 'follow') return;
        const rect = canvas.getBoundingClientRect();
        bunny.targetX = clientX - rect.left;
        bunny.targetY = clientY - rect.top;
    }

    canvas.addEventListener('mousemove', (e) => { updatePointer(e.clientX, e.clientY); });
    canvas.addEventListener('touchmove', (e) => {
        if (controlMode === 'follow' && e.touches.length > 0) {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });
    canvas.addEventListener('touchstart', (e) => {
        initAudio();
        if (controlMode === 'follow' && e.touches.length > 0) {
            updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
        initAudio();
        if (keys.hasOwnProperty(e.key) || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            keys[e.key] = true;
            if (controlMode === 'follow') setControlMode('keys');
        }
    });
    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key) || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            keys[e.key] = false;
        }
    });

    // Virtual Joystick Touch Events
    joystickBase.addEventListener('touchstart', (e) => {
        initAudio();
        joystickActive = true;
        const rect = joystickBase.getBoundingClientRect();
        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (!joystickActive) return;
        for (let i = 0; i < e.touches.length; i++) {
            updateJoystick(e.touches[i].clientX, e.touches[i].clientY);
        }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
        if (joystickActive) {
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickThumb.style.transform = `translate(0px, 0px)`;
        }
    });

    function updateJoystick(clientX, clientY) {
        const dx = clientX - joystickCenter.x;
        const dy = clientY - joystickCenter.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 35;

        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxDist);

        joystickVector.x = (Math.cos(angle) * clampedDist) / maxDist;
        joystickVector.y = (Math.sin(angle) * clampedDist) / maxDist;

        joystickThumb.style.transform = `translate(${Math.cos(angle) * clampedDist}px, ${Math.sin(angle) * clampedDist}px)`;
    }

    function setControlMode(mode) {
        controlMode = mode;
        const btn = document.getElementById('control-mode-btn');
        if (controlMode === 'follow') {
            btn.innerText = "Mode: Follow";
            joystickBase.classList.add('hidden');
            canvas.style.cursor = 'none';
        } else {
            btn.innerText = "Mode: Joystick/WASD";
            joystickBase.classList.remove('hidden');
            canvas.style.cursor = 'default';
        }
    }

    document.getElementById('control-mode-btn').addEventListener('click', () => {
        setControlMode(controlMode === 'follow' ? 'keys' : 'follow');
    });

    function generateMaze() {
        cellSize = Math.min(canvas.width / cols, canvas.height / rows);
        maze = [];
        for (let r = 0; r < rows; r++) {
            let row = [];
            for (let c = 0; c < cols; c++) {
                if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
                    row.push(1);
                } else {
                    row.push((Math.random() < 0.26 && !(r === 1 && c === 1)) ? 1 : 0);
                }
            }
            maze.push(row);
        }

        maze[1][1] = 0;
        maze[1][2] = 0;
        maze[2][1] = 0;

        carrots = [];
        hedgehogs = [];
        for (let r = 1; r < rows - 1; r++) {
            for (let c = 1; c < cols - 1; c++) {
                if (maze[r][c] === 0 && !(r === 1 && c === 1)) {
                    const rand = Math.random();
                    if (rand < 0.35) {
                        carrots.push({ c: c, r: r });
                    } else if (rand < 0.44 && hedgehogs.length < 3) {
                        hedgehogs.push({
                            x: c * cellSize + cellSize / 2,
                            y: r * cellSize + cellSize / 2,
                            vx: (Math.random() < 0.5 ? 1 : -1) * 1.1,
                            c: c,
                            r: r
                        });
                    }
                }
            }
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 2;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: 2 + Math.random() * 2
            });
        }
    }

    function update() {
        if (!gameActive) return;

        if (controlMode === 'follow') {
            bunny.x += (bunny.targetX - bunny.x) * 0.2;
            bunny.y += (bunny.targetY - bunny.y) * 0.2;
        } else {
            let dx = 0;
            let dy = 0;

            if (keys.w || keys.ArrowUp) dy -= 1;
            if (keys.s || keys.ArrowDown) dy += 1;
            if (keys.a || keys.ArrowLeft) dx -= 1;
            if (keys.d || keys.ArrowRight) dx += 1;

            if (joystickActive && (Math.abs(joystickVector.x) > 0.05 || Math.abs(joystickVector.y) > 0.05)) {
                dx = joystickVector.x;
                dy = joystickVector.y;
            }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            bunny.x += dx * bunny.speed;
            bunny.y += dy * bunny.speed;
        }

        // Wall collision check against grid
        const cellC = Math.floor(bunny.x / cellSize);
        const cellR = Math.floor(bunny.y / cellSize);

        if (cellR >= 0 && cellR < rows && cellC >= 0 && cellC < cols) {
            if (maze[cellR][cellC] === 1) {
                bunny.x = Math.max(cellSize, Math.min(canvas.width - cellSize, bunny.x));
                bunny.y = Math.max(cellSize, Math.min(canvas.height - cellSize, bunny.y));
            }
        }

        // Carrot Collection Check
        for (let i = carrots.length - 1; i >= 0; i--) {
            const car = carrots[i];
            const cx = car.c * cellSize + cellSize / 2;
            const cy = car.r * cellSize + cellSize / 2;
            const dist = Math.hypot(bunny.x - cx, bunny.y - cy);
            if (dist < bunny.radius + 10) {
                sfxCarrot();
                score += 20;
                document.getElementById('score-val').innerText = score;
                spawnParticles(cx, cy, '#f4a261');
                carrots.splice(i, 1);
            }
        }

        // Advance to next maze level if all carrots collected
        if (carrots.length === 0) {
            generateMaze();
            bunny.x = cellSize * 1.5;
            bunny.y = cellSize * 1.5;
            bunny.targetX = bunny.x;
            bunny.targetY = bunny.y;
        }

        // Update wandering hedgehogs
        hedgehogs.forEach(h => {
            h.x += h.vx;
            const hc = Math.floor(h.x / cellSize);
            const hr = Math.floor(h.y / cellSize);
            if (hc <= 0 || hc >= cols - 1 || maze[hr][hc] === 1) {
                h.vx *= -1;
            }

            const dist = Math.hypot(bunny.x - h.x, bunny.y - h.y);
            if (dist < bunny.radius + 10) {
                sfxHit();
                lives--;
                updateLivesUI();
                spawnParticles(bunny.x, bunny.y, '#e76f51');
                bunny.x = cellSize * 1.5;
                bunny.y = cellSize * 1.5;
                bunny.targetX = bunny.x;
                bunny.targetY = bunny.y;

                if (lives <= 0) {
                    endGame();
                }
            }
        });

        // Update particle physics
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.04;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function updateLivesUI() {
        let h = '';
        for (let i = 0; i < lives; i++) h += '❤️';
        document.getElementById('lives-val').innerText = h;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Maze Walls & Paths
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = c * cellSize;
                const y = r * cellSize;
                if (maze[r][c] === 1) {
                    ctx.fillStyle = '#1b4332';
                    ctx.strokeStyle = '#081c15';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, cellSize - 4, cellSize - 4, 6);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#40916c';
                    ctx.fillRect(x, y, cellSize, cellSize);
                }
            }
        }

        // Draw Carrots
        carrots.forEach(car => {
            const cx = car.c * cellSize + cellSize / 2;
            const cy = car.r * cellSize + cellSize / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.fillStyle = '#f4a261';
            ctx.beginPath();
            ctx.arc(0, 2, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#52b788';
            ctx.fillRect(-2, -10, 4, 6);
            ctx.restore();
        });

        // Draw Hedgehogs
        hedgehogs.forEach(h => {
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.fillStyle = '#6c757d';
            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-4, -3, 2.5, 0, Math.PI * 2);
            ctx.arc(4, -3, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // Draw Bunny
        ctx.save();
        ctx.translate(bunny.x, bunny.y);
        ctx.fillStyle = '#f8f9fa';
        ctx.strokeStyle = '#343a40';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, bunny.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(-4, -14, 3, 8, -0.2, 0, Math.PI * 2);
        ctx.ellipse(4, -14, 3, 8, 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#f8f9fa';
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#212529';
        ctx.beginPath();
        ctx.arc(-4, -2, 2, 0, Math.PI * 2);
        ctx.arc(4, -2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Draw Particles
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function startGame() {
        initAudio();
        score = 0;
        lives = 3;
        gameActive = true;
        document.getElementById('score-val').innerText = score;
        updateLivesUI();
        generateMaze();

        const overlay = document.getElementById('overlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
    }

    function endGame() {
        gameActive = false;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('meadow_maze_high_v2', highScore);
            document.getElementById('high-score-val').innerText = highScore;
        }

        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.opacity = '1', 10);

        overlay.querySelector('h1').innerText = "MEADOW TRIP";
        overlay.querySelector('p').innerText = `Carrots Collected: ${score}\nBest Score: ${highScore}`;
        document.getElementById('start-btn').innerText = "PLAY AGAIN";
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', () => {
        endGame();
        startGame();
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? "Audio: ON" : "Audio: OFF";
    });

    generateMaze();
    loop();
</script>

</body>
</html>
