<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #303b78, #0b1020 65%);
}

.game {
    width: min(95vw, 900px);
    text-align: center;
    padding: 25px;
}

h1 {
    margin: 0;
    font-size: clamp(34px, 8vw, 54px);
    letter-spacing: 2px;
}

.subtitle {
    color: #aeb8d8;
    margin: 8px 0 20px;
}

/* MODE BUTTONS */

.modes {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.mode {
    width: auto;
    margin: 0;
    padding: 10px 20px;
    background: #141b33;
    border: 1px solid #39476f;
}

.mode:hover {
    background: #29355d;
}

.mode.active {
    background: #5965ff;
    border-color: #7c85ff;
    box-shadow: 0 0 15px #5965ff66;
}

/* STATS */

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.stat {
    min-width: 110px;
    padding: 10px 16px;
    background: #141b33;
    border: 1px solid #334064;
    border-radius: 12px;
}

.stat span {
    display: block;
    color: #9eabd0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.stat strong {
    font-size: 22px;
}

/* CARD BOARD */

.board {
    display: grid;
    gap: 12px;
    width: min(90vw, 700px);
    margin: auto;
}

/* EASY = 4 x 4 */

.board.easy {
    grid-template-columns: repeat(4, 1fr);
}

/* MEDIUM = 5 x 4 */

.board.medium {
    grid-template-columns: repeat(5, 1fr);
}

/* HARD = 6 x 6 */

.board.hard {
    grid-template-columns: repeat(6, 1fr);
}

.card {
    aspect-ratio: 1;
    perspective: 800px;
    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.45s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.front {
    background: linear-gradient(
        135deg,
        #5965ff,
        #8b5cf6
    );

    border: 2px solid #7882ff;

    font-size: clamp(25px, 6vw, 42px);

    box-shadow:
        0 8px 20px #0004;
}

.front::after {
    content: "?";
    font-weight: bold;
}

.back {
    transform: rotateY(180deg);

    background: #18213d;

    border: 2px solid #44547f;

    font-size: clamp(25px, 6vw, 44px);
}

.matched .back {
    border-color: #54e36a;

    box-shadow:
        0 0 20px #54e36a66;
}

/* BUTTON */

button {
    border: none;
    border-radius: 10px;
    padding: 12px 22px;

    background: #5965ff;

    color: white;

    font-weight: bold;

    font-size: 14px;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #707aff;

    transform: translateY(-2px);
}

#restart {
    margin-top: 22px;
}

/* MESSAGE */

.message {
    min-height: 28px;

    margin-top: 15px;

    color: #ffe14d;

    font-weight: bold;
}

/* MOBILE */

@media (max-width: 600px) {

    .game {
        padding: 15px;
    }

    .board {
        gap: 7px;
    }

    .board.hard {
        gap: 5px;
    }

    .face {
        border-radius: 9px;
    }

    .stat {
        min-width: 90px;
        padding: 8px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🧠 Memory Match</h1>

    <div class="subtitle">
        Match the cards. Train your brain. Beat your best score!
    </div>

    <!-- GAME MODES -->

    <div class="modes">

        <button
            class="mode active"
            data-mode="easy">
            🟢 Easy
        </button>

        <button
            class="mode"
            data-mode="medium">
            🟡 Medium
        </button>

        <button
            class="mode"
            data-mode="hard">
            🔴 Hard
        </button>

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <span>Moves</span>
            <strong id="moves">0</strong>
        </div>

        <div class="stat">
            <span>Pairs</span>
            <strong id="pairs">0 / 8</strong>
        </div>

        <div class="stat">
            <span>Time</span>
            <strong id="time">0s</strong>
        </div>

    </div>

    <!-- BOARD -->

    <div
        class="board easy"
        id="board">
    </div>

    <button id="restart">
        🔄 New Game
    </button>

    <div
        class="message"
        id="message">
    </div>

</div>


<script>

/* =========================
   GAME DATA
========================= */

const emojiPool = [

    "🍕",
    "🚀",
    "🐱",
    "⚽",
    "🎮",
    "🦄",
    "🍩",
    "🌟",
    "🍔",
    "🐼",
    "🎸",
    "🔥",
    "🍎",
    "👾",
    "🐸",
    "💎",
    "🌈",
    "🦊"
];


/*
    EASY
    4 × 4 = 16 cards
    8 pairs

    MEDIUM
    5 × 4 = 20 cards
    10 pairs

    HARD
    6 × 6 = 36 cards
    18 pairs
*/

const modes = {

    easy: {
        pairs: 8,
        className: "easy"
    },

    medium: {
        pairs: 10,
        className: "medium"
    },

    hard: {
        pairs: 18,
        className: "hard"
    }

};


/* =========================
   ELEMENTS
========================= */

const board =
    document.getElementById("board");

const movesText =
    document.getElementById("moves");

const pairsText =
    document.getElementById("pairs");

const timeText =
    document.getElementById("time");

const message =
    document.getElementById("message");

const restartButton =
    document.getElementById("restart");

const modeButtons =
    document.querySelectorAll(".mode");


/* =========================
   VARIABLES
========================= */

let currentMode = "easy";

let cards = [];

let firstCard = null;
let secondCard = null;

let locked = false;

let moves = 0;

let matchedPairs = 0;

let seconds = 0;

let timer = null;

let gameStarted = false;


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

    return array;
}


/* =========================
   START GAME
========================= */

function startGame() {

    const settings =
        modes[currentMode];

    clearInterval(timer);

    board.innerHTML = "";

    board.className =
        "board " + settings.className;

    firstCard = null;
    secondCard = null;

    locked = false;

    moves = 0;

    matchedPairs = 0;

    seconds = 0;

    gameStarted = false;

    movesText.textContent = "0";

    pairsText.textContent =
        `0 / ${settings.pairs}`;

    timeText.textContent = "0s";

    message.textContent = "";


    /*
        Pick enough emojis
        for this difficulty.
    */

    const selected =
        emojiPool.slice(
            0,
            settings.pairs
        );


    cards = shuffle([
        ...selected,
        ...selected
    ]);


    cards.forEach(
        (emoji, index) => {

            const card =
                createCard(
                    emoji,
                    index
                );

            board.appendChild(card);

        }
    );

}


/* =========================
   CREATE CARD
========================= */

function createCard(
    emoji,
    index
) {

    const card =
        document.createElement("div");

    card.className = "card";

    card.dataset.value = emoji;

    card.dataset.index = index;


    card.innerHTML = `

        <div class="card-inner">

            <div class="face front"></div>

            <div class="face back">
                ${emoji}
            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => flipCard(card)
    );


    return card;
}


/* =========================
   TIMER
========================= */

function startTimer() {

    if (gameStarted) return;

    gameStarted = true;

    timer = setInterval(() => {

        seconds++;

        timeText.textContent =
            seconds + "s";

    }, 1000);

}


/* =========================
   FLIP CARD
========================= */

function flipCard(card) {

    if (locked) return;

    if (card === firstCard) return;

    if (
        card.classList.contains(
            "matched"
        )
    ) {
        return;
    }


    startTimer();

    card.classList.add("flipped");


    if (!firstCard) {

        firstCard = card;

        return;

    }


    secondCard = card;

    moves++;

    movesText.textContent = moves;

    checkMatch();

}


/* =========================
   CHECK MATCH
========================= */

function checkMatch() {

    const match =
        firstCard.dataset.value ===
        secondCard.dataset.value;


    if (match) {

        firstCard.classList.add(
            "matched"
        );

        secondCard.classList.add(
            "matched"
        );

        matchedPairs++;


        const totalPairs =
            modes[currentMode].pairs;

        pairsText.textContent =
            `${matchedPairs} / ${totalPairs}`;


        resetTurn();


        if (
            matchedPairs ===
            totalPairs
        ) {

            gameWon();

        }

    }

    else {

        locked = true;

        setTimeout(() => {

            firstCard.classList.remove(
                "flipped"
            );

            secondCard.classList.remove(
                "flipped"
            );

            resetTurn();

        }, 800);

    }

}


/* =========================
   RESET TURN
========================= */

function resetTurn() {

    firstCard = null;

    secondCard = null;

    locked = false;

}


/* =========================
   WIN
========================= */

function gameWon() {

    clearInterval(timer);

    const difficulty =
        currentMode.toUpperCase();

    message.textContent =
        `🎉 ${difficulty} COMPLETE! ` +
        `${moves} moves • ${seconds}s`;

}


/* =========================
   CHANGE MODE
========================= */

modeButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            modeButtons.forEach(
                btn =>
                    btn.classList.remove(
                        "active"
                    )
            );

            button.classList.add(
                "active"
            );

            currentMode =
                button.dataset.mode;

            startGame();

        }
    );

});


/* =========================
   NEW GAME
========================= */

restartButton.addEventListener(
    "click",
    startGame
);


/* =========================
   START
========================= */

startGame();

</script>

</body>
</html>
