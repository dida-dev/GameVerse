<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Skyline Obby</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07111f;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* ---------------- UI ---------------- */

#ui {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10;

    padding: 12px 16px;

    background: rgba(4, 12, 25, .78);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px;

    color: white;
    backdrop-filter: blur(8px);

    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

#title {
    color: #62ddff;
    font-size: 20px;
    font-weight: 900;
}

#stats {
    margin-top: 5px;
    font-size: 13px;
    color: #d8e9ff;
}

#controls {
    position: fixed;
    left: 14px;
    bottom: 14px;

    z-index: 10;

    padding: 9px 13px;

    color: #d8e9ff;
    background: rgba(4,12,25,.7);
    border-radius: 10px;

    font-size: 12px;
}

/* ---------------- MOBILE CONTROLS ---------------- */

#mobileControls {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
}

.control {
    pointer-events: auto;

    position: absolute;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.3);

    background: rgba(20,45,70,.65);

    color: white;

    font-size: 28px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;

    backdrop-filter: blur(5px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.3),
        inset 0 0 15px rgba(255,255,255,.05);

    -webkit-tap-highlight-color: transparent;
}

.control:active {
    background: rgba(70,210,255,.8);
    transform: scale(.92);
}

#left {
    left: 20px;
    bottom: 28px;
}

#right {
    left: 105px;
    bottom: 28px;
}

#jump {
    right: 25px;
    bottom: 30px;

    width: 85px;
    height: 85px;

    background: rgba(40,170,230,.65);
}

/* Show controls on touch devices */
@media (pointer: coarse) {
    #mobileControls {
        display: block;
    }

    #controls {
        display: none;
    }

    #ui {
        transform: scale(.9);
        transform-origin: top left;
    }
}

/* ---------------- WIN SCREEN ---------------- */

#message {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.7);

    color: white;
}

.panel {
    width: min(90%, 430px);

    text-align: center;

    padding: 35px 25px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #122944,
            #07111f
        );

    border: 2px solid #50ddff;

    box-shadow:
        0 0 70px rgba(50,210,255,.25);
}

.panel h1 {
    margin: 0 0 12px;

    font-size: 40px;

    color: #66e4ff;
}

.panel p {
    color: #d9e9f8;
    line-height: 1.6;
}

button {
    border: none;

    padding: 13px 25px;

    border-radius: 12px;

    background: #40d4ff;
    color: #03101b;

    font-weight: bold;
    font-size: 16px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- UI -->

<div id="ui">
    <div id="title">🌆 SKYLINE OBBY</div>

    <div id="stats">
        Checkpoint:
        <span id="checkpoint">1</span>/8
        &nbsp; • &nbsp;

        Coins:
        <span id="coins">0</span>/10

        &nbsp; • &nbsp;

        Time:
        <span id="time">0.0</span>s
    </div>
</div>

<div id="controls">
    A/D or ←/→ = Move &nbsp; • &nbsp; Space = Jump
</div>

<!-- MOBILE -->

<div id="mobileControls">

    <div class="control"
         id="left">
        ◀
    </div>

    <div class="control"
         id="right">
        ▶
    </div>

    <div class="control"
         id="jump">
        ▲
    </div>

</div>

<!-- WIN -->

<div id="message">

    <div class="panel">

        <h1>🏆 YOU WON!</h1>

        <p id="finalText"></p>

        <button onclick="location.reload()">
            PLAY AGAIN
        </button>

    </div>

</div>

<script>

/* =========================================================
   SETUP
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   GAME SETTINGS
========================================================= */

const GRAVITY = 0.48;

const JUMP_POWER = -11.5;

const MOVE_SPEED = 4.8;

const MAX_FALL_SPEED = 13;

let cameraX = 0;

let cameraY = 0;

let gameWon = false;

let startTime =
    performance.now();

let coinsCollected = 0;

let currentCheckpoint = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 70,

    y: 440,

    width: 28,

    height: 42,

    vx: 0,

    vy: 0,

    grounded: false

};


/* =========================================================
   PLATFORMS

   These have intentionally been made easier.

   Maximum horizontal gaps are small enough
   for the jump distance.
========================================================= */

const platforms = [

    {
        x: 0,
        y: 520,
        w: 360,
        h: 80,
        checkpoint: true
    },

    {
        x: 410,
        y: 470,
        w: 190,
        h: 130,
        checkpoint: true
    },

    {
        x: 645,
        y: 425,
        w: 180,
        h: 175,
        checkpoint: true
    },

    {
        x: 870,
        y: 465,
        w: 200,
        h: 135,
        checkpoint: true
    },

    {
        x: 1115,
        y: 410,
        w: 190,
        h: 190,
        checkpoint: true
    },

    {
        x: 1350,
        y: 450,
        w: 210,
        h: 150,
        checkpoint: true
    },

    {
        x: 1605,
        y: 390,
        w: 190,
        h: 210,
        checkpoint: true
    },

    {
        x: 1840,
        y: 435,
        w: 210,
        h: 165,
        checkpoint: true
    },

    {
        x: 2095,
        y: 375,
        w: 210,
        h: 225,
        checkpoint: true
    },

    {
        x: 2350,
        y: 320,
        w: 300,
        h: 280,
        finish: true
    }

];


/* =========================================================
   CHECKPOINTS
========================================================= */

const checkpoints = [

    {
        x: 60,
        y: 470
    },

    {
        x: 435,
        y: 420
    },

    {
        x: 670,
        y: 375
    },

    {
        x: 895,
        y: 415
    },

    {
        x: 1140,
        y: 360
    },

    {
        x: 1375,
        y: 400
    },

    {
        x: 1630,
        y: 340
    },

    {
        x: 1865,
        y: 385
    },

    {
        x: 2120,
        y: 325
    }

];


/* =========================================================
   COINS
========================================================= */

const coins = [

    {x: 280, y: 455, got:false},

    {x: 490, y: 405, got:false},

    {x: 725, y: 360, got:false},

    {x: 955, y: 400, got:false},

    {x: 1200, y: 345, got:false},

    {x: 1440, y: 385, got:false},

    {x: 1695, y: 325, got:false},

    {x: 1935, y: 370, got:false},

    {x: 2185, y: 310, got:false},

    {x: 2490, y: 260, got:false}

];


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if (
            e.code === "Space" ||
            e.key === "ArrowUp"
        ) {

            e.preventDefault();

            jump();

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;

    }
);


/* =========================================================
   MOBILE INPUT
========================================================= */

function setupButton(
    id,
    key
) {

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );
}

setupButton("left", "a");

setupButton("right", "d");

document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            jump();

        }
    );


/* =========================================================
   JUMP
========================================================= */

function jump() {

    if (
        player.grounded &&
        !gameWon
    ) {

        player.vy =
            JUMP_POWER;

        player.grounded =
            false;
    }
}


/* =========================================================
   DRAW HELPERS
========================================================= */

function rect(
    x,
    y,
    w,
    h,
    color
) {

    ctx.fillStyle = color;

    ctx.fillRect(
        Math.round(
            x - cameraX
        ),
        Math.round(
            y - cameraY
        ),
        w,
        h
    );
}


function circle(
    x,
    y,
    r,
    color
) {

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        x - cameraX,
        y - cameraY,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   SKY
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    gradient.addColorStop(
        0,
        "#06132c"
    );

    gradient.addColorStop(
        .5,
        "#16466a"
    );

    gradient.addColorStop(
        1,
        "#ff795f"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Moon */

    circle(
        850,
        110,
        48,
        "#fff1c4"
    );

    circle(
        870,
        95,
        45,
        "#122541"
    );


    /* Stars */

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        const x =
            (i * 197)
            - cameraX * .12;

        const y =
            (i * 83) % 280;

        ctx.fillStyle =
            "rgba(255,255,255,.7)";

        ctx.fillRect(
            x,
            y,
            2,
            2
        );
    }
}


/* =========================================================
   BACKGROUND CITY
========================================================= */

function drawCity() {

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const x =
            i * 95
            - cameraX * .2;

        const height =
            100 +
            ((i * 53) % 210);

        const y =
            canvas.height -
            height;

        const colors = [
            "#091a2d",
            "#0c2238",
            "#102b44",
            "#0a1c31"
        ];

        ctx.fillStyle =
            colors[i % colors.length];

        ctx.fillRect(
            x,
            y,
            78,
            height
        );


        /* Windows */

        for (
            let wy = y + 18;
            wy < canvas.height;
            wy += 25
        ) {

            for (
                let wx = x + 10;
                wx < x + 65;
                wx += 22
            ) {

                if (
                    (i + wy + wx) % 4
                    !== 0
                ) {

                    ctx.fillStyle =
                        (i + wx) % 2
                        ? "#ffd86a"
                        : "#53d9ff";

                    ctx.globalAlpha =
                        .55;

                    ctx.fillRect(
                        wx,
                        wy,
                        8,
                        11
                    );

                    ctx.globalAlpha =
                        1;
                }
            }
        }
    }
}


/* =========================================================
   PLATFORMS
========================================================= */

function drawPlatforms() {

    platforms.forEach(
        (p, index) => {

            /* Building */

            rect(
                p.x,
                p.y,
                p.w,
                p.h,
                p.finish
                    ? "#173f56"
                    : "#172b43"
            );


            /* Side shadow */

            rect(
                p.x + p.w - 12,
                p.y + 10,
                12,
                p.h,
                "#091727"
            );


            /* Roof */

            rect(
                p.x,
                p.y,
                p.w,
                10,
                p.finish
                    ? "#ffe05c"
                    : "#3ad9ff"
            );


            /* Windows */

            for (
                let yy =
                    p.y + 35;

                yy <
                    p.y + p.h - 15;

                yy += 32
            ) {

                for (
                    let xx =
                        p.x + 18;

                    xx <
                        p.x + p.w - 18;

                    xx += 30
                ) {

                    ctx.fillStyle =
                        ((xx + yy) / 30) % 3
                        === 0
                        ? "#ffd969"
                        : "#4ed6ff";

                    ctx.globalAlpha =
                        .5;

                    rect(
                        xx,
                        yy,
                        10,
                        14,
                        ctx.fillStyle
                    );

                    ctx.globalAlpha =
                        1;
                }
            }


            /* Checkpoint flag */

            if (
                p.checkpoint
            ) {

                rect(
                    p.x + 15,
                    p.y - 42,
                    4,
                    42,
                    "#e7f6ff"
                );

                const active =
                    index <=
                    currentCheckpoint;

                ctx.fillStyle =
                    active
                    ? "#39ff91"
                    : "#ff5577";

                ctx.beginPath();

                ctx.moveTo(
                    p.x + 19 -
                    cameraX,

                    p.y - 40 -
                    cameraY
                );

                ctx.lineTo(
                    p.x + 55 -
                    cameraX,

                    p.y - 28 -
                    cameraY
                );

                ctx.lineTo(
                    p.x + 19 -
                    cameraX,

                    p.y - 16 -
                    cameraY
                );

                ctx.closePath();

                ctx.fill();
            }


            /* Finish flag */

            if (
                p.finish
            ) {

                rect(
                    p.x + p.w / 2 - 4,
                    p.y - 85,
                    8,
                    85,
                    "#effcff"
                );

                ctx.fillStyle =
                    "#ffdc4f";

                ctx.beginPath();

                ctx.moveTo(
                    p.x + p.w / 2 + 4 -
                    cameraX,

                    p.y - 83 -
                    cameraY
                );

                ctx.lineTo(
                    p.x + p.w / 2 + 65 -
                    cameraX,

                    p.y - 60 -
                    cameraY
                );

                ctx.lineTo(
                    p.x + p.w / 2 + 4 -
                    cameraX,

                    p.y - 37 -
                    cameraY
                );

                ctx.closePath();

                ctx.fill();
            }

        }
    );
}


/* =========================================================
   COINS
========================================================= */

function drawCoins() {

    coins.forEach(
        coin => {

            if (
                coin.got
            ) return;

            const bob =
                Math.sin(
                    performance.now() /
                    180 +
                    coin.x
                ) * 5;

            circle(
                coin.x,
                coin.y + bob,
                11,
                "#ffd43d"
            );

            circle(
                coin.x,
                coin.y + bob,
                6,
                "#fff2a1"
            );
        }
    );
}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer() {

    /* Shadow */

    ctx.globalAlpha =
        .3;

    circle(
        player.x +
            player.width / 2,

        player.y +
            player.height + 5,

        16,

        "#000"
    );

    ctx.globalAlpha =
        1;


    /* Body */

    rect(
        player.x,
        player.y,
        player.width,
        player.height,
        "#42d7ff"
    );


    /* Head */

    circle(
        player.x +
            player.width / 2,

        player.y - 7,

        12,

        "#ffd2b3"
    );


    /* Helmet */

    rect(
        player.x + 3,
        player.y - 18,
        22,
        7,
        "#25aee2"
    );


    /* Eyes */

    circle(
        player.x + 9,
        player.y - 8,
        2,
        "#111"
    );

    circle(
        player.x + 18,
        player.y - 8,
        2,
        "#111"
    );
}


/* =========================================================
   PHYSICS
========================================================= */

function updatePlayer() {

    if (gameWon)
        return;


    /* Movement */

    let moving = false;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        player.vx =
            -MOVE_SPEED;

        moving = true;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        player.vx =
            MOVE_SPEED;

        moving = true;
    }


    if (!moving) {

        player.vx *= .78;

    }


    /* Gravity */

    player.vy +=
        GRAVITY;


    if (
        player.vy >
        MAX_FALL_SPEED
    ) {

        player.vy =
            MAX_FALL_SPEED;
    }


    player.x +=
        player.vx;

    player.y +=
        player.vy;


    /* Prevent going backwards */

    if (
        player.x < 0
    ) {

        player.x = 0;

    }


    player.grounded =
        false;


    /* Platform collision */

    for (
        const p of platforms
    ) {

        const playerBottom =
            player.y +
            player.height;

        const wasAbove =
            playerBottom -
            player.vy <=
            p.y + 5;

        const horizontal =
            player.x +
                player.width >
                p.x &&
            player.x <
                p.x + p.w;

        const landing =
            playerBottom >= p.y &&
            playerBottom <=
                p.y + 18 &&
            player.vy >= 0;

        if (
            horizontal &&
            landing &&
            wasAbove
        ) {

            player.y =
                p.y -
                player.height;

            player.vy =
                0;

            player.grounded =
                true;


            /* Checkpoint */

            const index =
                platforms.indexOf(p);

            if (
                p.checkpoint &&
                index >
                    currentCheckpoint
            ) {

                currentCheckpoint =
                    index;

                document
                    .getElementById(
                        "checkpoint"
                    )
                    .textContent =
                    Math.min(
                        currentCheckpoint + 1,
                        8
                    );
            }


            /* Finish */

            if (
                p.finish
            ) {

                winGame();

            }

        }

    }


    /* Coins */

    coins.forEach(
        coin => {

            if (
                coin.got
            ) return;

            const dx =
                player.x +
                player.width / 2 -
                coin.x;

            const dy =
                player.y +
                player.height / 2 -
                coin.y;

            if (
                Math.hypot(
                    dx,
                    dy
                ) < 30
            ) {

                coin.got =
                    true;

                coinsCollected++;

                document
                    .getElementById(
                        "coins"
                    )
                    .textContent =
                    coinsCollected;
            }

        }
    );


    /* Respawn */

    if (
        player.y >
        750
    ) {

        respawn();

    }


    /* Camera */

    const targetX =
        player.x -
        canvas.width * .35;

    cameraX +=
        (
            targetX -
            cameraX
        ) * .09;


    if (
        cameraX < 0
    ) {

        cameraX = 0;

    }


    const targetY =
        player.y -
        canvas.height * .55;

    cameraY +=
        (
            targetY -
            cameraY
        ) * .07;


    if (
        cameraY < 0
    ) {

        cameraY = 0;

    }
}


/* =========================================================
   RESPAWN
========================================================= */

function respawn() {

    const cp =
        checkpoints[
            Math.min(
                currentCheckpoint,
                checkpoints.length - 1
            )
        ];


    player.x =
        cp.x;

    player.y =
        cp.y;

    player.vx =
        0;

    player.vy =
        0;

    player.grounded =
        false;


    cameraX =
        Math.max(
            0,
            player.x -
            canvas.width * .35
        );
}


/* =========================================================
   WIN
========================================================= */

function winGame() {

    if (
        gameWon
    ) return;

    gameWon =
        true;


    const time =
        (
            (
                performance.now() -
                startTime
            ) / 1000
        ).toFixed(1);


    document
        .getElementById(
            "finalText"
        )
        .innerHTML =

        `
        You conquered the skyline! 🌆
        <br><br>
        ⏱️ Time:
        <b>${time}s</b>
        <br>
        🪙 Coins:
        <b>${coinsCollected}/10</b>
        `;


    document
        .getElementById(
            "message"
        )
        .style.display =
        "flex";
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    /* Update */

    updatePlayer();


    /* Timer */

    if (
        !gameWon
    ) {

        const elapsed =
            (
                (
                    performance.now() -
                    startTime
                ) / 1000
            ).toFixed(1);

        document
            .getElementById(
                "time"
            )
            .textContent =
            elapsed;
    }


    /* Draw */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawSky();

    drawCity();

    drawPlatforms();

    drawCoins();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   START
========================================================= */

gameLoop();

</script>

</body>
</html>
