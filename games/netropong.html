<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Retro Pong Arcade</title>
    <!-- Tailwind CSS for modern layout & UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #05050a;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3);
        }

        .neon-glow-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.5), 0 0 30px rgba(255, 0, 127, 0.3);
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 2px solid rgba(0, 243, 255, 0.6);
        }

        .menu-btn {
            transition: all 0.2s ease-in-out;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 127, 0.2));
            border: 2px solid #00f3ff;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(255, 0, 127, 0.4));
        }

        .menu-btn.active {
            border-color: #ff007f;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
        }

        /* CRT Scanline effect */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen relative">

    <div class="absolute inset-0 scanlines z-20 pointer-events-none"></div>
    <div class="absolute w-[600px] h-[600px] bg-cyan-900/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute w-[600px] h-[600px] bg-pink-900/10 rounded-full blur-3xl pointer-events-none translate-x-48 translate-y-32"></div>

    <!-- Main Game Container -->
    <div class="relative z-10 flex flex-col items-center max-w-5xl w-full px-4">
        
        <!-- Header / Scores -->
        <div class="flex justify-between w-full max-w-[800px] mb-3 px-6 items-center">
            <div class="flex flex-col items-start">
                <span class="text-xs text-cyan-400 font-bold uppercase tracking-widest">Player 1 (W / S)</span>
                <span id="p1-score" class="text-4xl font-black neon-glow text-cyan-400">0</span>
            </div>
            
            <div class="flex flex-col items-center">
                <h1 class="text-xl font-black tracking-widest text-white neon-glow">N E O N &bull; P O N G</h1>
                <span id="rally-counter" class="text-xs text-gray-400 mt-1">Rally: 0</span>
            </div>

            <div class="flex flex-col items-end">
                <span id="p2-label" class="text-xs text-pink-400 font-bold uppercase tracking-widest">AI Opponent</span>
                <span id="p2-score" class="text-4xl font-black neon-glow-pink text-pink-500">0</span>
            </div>
        </div>

        <!-- Canvas Wrapper -->
        <div class="relative rounded-xl overflow-hidden neon-border bg-black/80 shadow-2xl">
            <canvas id="pongCanvas" width="800" height="450" class="block w-full max-w-[800px] h-auto aspect-[16/9]"></canvas>

            <!-- Start / Menu Screen Overlay -->
            <div id="menu-screen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 transition-all duration-300">
                <h2 class="text-4xl md:text-5xl font-black mb-2 text-cyan-400 neon-glow tracking-wider">RETRO PONG</h2>
                <p class="text-gray-400 text-sm mb-6 tracking-wide">Select game mode & difficulty to begin</p>

                <!-- Mode Selection -->
                <div class="flex gap-4 mb-6">
                    <button id="mode-1p" onclick="setGameMode('1p')" class="menu-btn active px-6 py-3 rounded-lg text-sm font-bold tracking-wider text-cyan-300">1 Player vs AI</button>
                    <button id="mode-2p" onclick="setGameMode('2p')" class="menu-btn px-6 py-3 rounded-lg text-sm font-bold tracking-wider text-pink-300">2 Player Local</button>
                </div>

                <!-- AI Difficulty Selection (shown only in 1P mode) -->
                <div id="difficulty-container" class="flex flex-col items-center mb-6">
                    <span class="text-xs text-gray-400 mb-2 uppercase tracking-widest">AI Difficulty</span>
                    <div class="flex gap-3">
                        <button id="diff-easy" onclick="setDifficulty('easy')" class="menu-btn px-4 py-2 rounded text-xs font-bold text-green-400">Easy</button>
                        <button id="diff-medium" onclick="setDifficulty('medium')" class="menu-btn active px-4 py-2 rounded text-xs font-bold text-yellow-400">Medium</button>
                        <button id="diff-hard" onclick="setDifficulty('hard')" class="menu-btn px-4 py-2 rounded text-xs font-bold text-red-400">Hard</button>
                    </div>
                </div>

                <button onclick="startGame()" class="menu-btn px-8 py-4 rounded-xl text-lg font-black tracking-widest text-white bg-gradient-to-r from-cyan-500 to-pink-500 shadow-lg cursor-pointer">
                    START MATCH 🎮
                </button>
            </div>

            <!-- Pause Screen Overlay -->
            <div id="pause-screen" class="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center z-30 hidden">
                <h2 class="text-3xl font-black mb-4 text-cyan-400 neon-glow">GAME PAUSED</h2>
                <div class="flex gap-4">
                    <button onclick="resumeGame()" class="menu-btn px-6 py-3 rounded-lg font-bold text-cyan-300">Resume</button>
                    <button onclick="returnToMenu()" class="menu-btn px-6 py-3 rounded-lg font-bold text-pink-300">Main Menu</button>
                </div>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameover-screen" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-30 hidden">
                <h2 id="winner-text" class="text-4xl md:text-5xl font-black mb-2 text-cyan-400 neon-glow">PLAYER 1 WINS!</h2>
                <p id="final-stats" class="text-gray-300 text-sm mb-6 tracking-wide">Max Rally: 14 | Score: 5 - 2</p>
                <div class="flex gap-4">
                    <button onclick="startGame()" class="menu-btn px-6 py-3 rounded-lg font-bold text-cyan-300">Play Again</button>
                    <button onclick="returnToMenu()" class="menu-btn px-6 py-3 rounded-lg font-bold text-pink-300">Main Menu</button>
                </div>
            </div>
        </div>

        <!-- Controls Footer -->
        <div class="flex justify-between w-full max-w-[800px] mt-4 px-2 text-xs text-gray-400">
            <div><span class="text-cyan-400 font-bold">P1 Controls:</span> W (Up) / S (Down)</div>
            <div><span class="text-white font-bold">ESC / Space:</span> Pause Game</div>
            <div id="p2-controls-hint"><span class="text-pink-400 font-bold">P2 Controls:</span> Up / Down Arrows</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const menuScreen = document.getElementById('menu-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');
        const p2LabelEl = document.getElementById('p2-label');
        const p2ControlsHint = document.getElementById('p2-controls-hint');
        const rallyCounterEl = document.getElementById('rally-counter');
        const winnerText = document.getElementById('winner-text');
        const finalStats = document.getElementById('final-stats');

        // Game state variables
        let gameMode = '1p'; // '1p' or '2p'
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let maxScore = 5;

        // Sound synthesizer using Web Audio API
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'paddle') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'wall') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'score') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        const paddleWidth = 14;
        const paddleHeight = 90;
        const ballSize = 12;

        const p1 = {
            x: 25,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 7
        };

        const p2 = {
            x: canvas.width - 25 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            dy: 0,
            speed: 6.5
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: ballSize,
            speedX: 5,
            speedY: 3,
            maxSpeed: 14,
            baseSpeed: 5,
            spin: 0
        };

        // Particle system for impacts
        let particles = [];
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let currentRally = 0;
        let maxRallyAchieved = 0;

        // Key tracking dictionary
        const keys = {};

        window.addEventListener('keydown', (e) => {
            initAudio();
            keys[e.code] = true;

            if (e.code === 'Space' || e.code === 'Escape') {
                if (gameState === 'PLAYING') {
                    pauseGame();
                } else if (gameState === 'PAUSED') {
                    resumeGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-1p').classList.toggle('active', mode === '1p');
            document.getElementById('mode-2p').classList.toggle('active', mode === '2p');
            
            const diffContainer = document.getElementById('difficulty-container');
            if (mode === '1p') {
                diffContainer.style.display = 'flex';
                p2LabelEl.textContent = 'AI Opponent';
                p2ControlsHint.style.display = 'none';
            } else {
                diffContainer.style.display = 'none';
                p2LabelEl.textContent = 'Player 2';
                p2ControlsHint.style.display = 'block';
            }
        }

        function setDifficulty(diff) {
            aiDifficulty = diff;
            ['easy', 'medium', 'hard'].forEach(d => {
                document.getElementById(`diff-${d}`).classList.toggle('active', d === diff);
            });
            if (diff === 'easy') p2.speed = 4.5;
            if (diff === 'medium') p2.speed = 6.2;
            if (diff === 'hard') p2.speed = 8.0;
        }

        function startGame() {
            menuScreen.classList.add('hidden');
            pauseScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            
            p1.score = 0;
            p2.score = 0;
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            currentRally = 0;
            maxRallyAchieved = 0;

            resetBall(Math.random() > 0.5 ? 1 : -1);
            gameState = 'PLAYING';
        }

        function pauseGame() {
            gameState = 'PAUSED';
            pauseScreen.classList.remove('hidden');
        }

        function resumeGame() {
            pauseScreen.classList.add('hidden');
            gameState = 'PLAYING';
        }

        function returnToMenu() {
            pauseScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            gameState = 'MENU';
        }

        function resetBall(direction = 1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX = direction * ball.baseSpeed;
            ball.speedY = (Math.random() * 4 - 2);
            ball.spin = 0;
            currentRally = 0;
            rallyCounterEl.textContent = `Rally: 0`;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Player 1 Movement (W / S)
            if (keys['KeyW'] || keys['KeyW']) {
                p1.y -= p1.speed;
            }
            if (keys['KeyS']) {
                p1.y += p1.speed;
            }

            // Player 2 Movement (Arrows or AI)
            if (gameMode === '2p') {
                if (keys['ArrowUp']) {
                    p2.y -= p2.speed;
                }
                if (keys['ArrowDown']) {
                    p2.y += p2.speed;
                }
            } else {
                // Intelligent AI tracking ball with slight reaction imperfections based on difficulty
                let aiTargetY = ball.y - p2.height / 2;
                let errorMargin = 30;
                if (aiDifficulty === 'easy') errorMargin = 65;
                if (aiDifficulty === 'hard') errorMargin = 10;

                // Only react actively when ball moves towards AI or is close
                if (ball.speedX > 0 || aiDifficulty === 'hard') {
                    if (p2.y + p2.height / 2 < ball.y - errorMargin) {
                        p2.y += p2.speed * (aiDifficulty === 'easy' ? 0.7 : aiDifficulty === 'medium' ? 0.9 : 1.1);
                    } else if (p2.y + p2.height / 2 > ball.y + errorMargin) {
                        p2.y -= p2.speed * (aiDifficulty === 'easy' ? 0.7 : aiDifficulty === 'medium' ? 0.9 : 1.1);
                    }
                }
            }

            // Keep paddles inside canvas bounds
            p1.y = Math.max(0, Math.min(canvas.height - p1.height, p1.y));
            p2.y = Math.max(0, Math.min(canvas.height - p2.height, p2.y));

            // Ball movement with spin effect
            ball.y += ball.speedY + ball.spin;
            ball.x += ball.speedX;

            // Top and Bottom wall collisions
            if (ball.y - ball.size <= 0) {
                ball.y = ball.size;
                ball.speedY *= -1;
                playSound('wall');
                createSparks(ball.x, ball.y, '#00f3ff');
            } else if (ball.y + ball.size >= canvas.height) {
                ball.y = canvas.height - ball.size;
                ball.speedY *= -1;
                playSound('wall');
                createSparks(ball.x, ball.y, '#00f3ff');
            }

            // Paddle 1 Collision Check (Left)
            if (
                ball.x - ball.size <= p1.x + p1.width &&
                ball.x + ball.size >= p1.x &&
                ball.y >= p1.y &&
                ball.y <= p1.y + p1.height
            ) {
                playSound('paddle');
                currentRally++;
                if (currentRally > maxRallyAchieved) maxRallyAchieved = currentRally;
                rallyCounterEl.textContent = `Rally: ${currentRally}`;

                // Calculate bounce angle based on strike position
                let hitOffset = (ball.y - (p1.y + p1.height / 2)) / (p1.height / 2);
                let bounceAngle = hitOffset * (Math.PI / 3); // Max 60 degrees

                let currentSpeed = Math.hypot(ball.speedX, ball.speedY);
                let nextSpeed = Math.min(ball.maxSpeed, currentSpeed * 1.05);

                ball.speedX = nextSpeed * Math.cos(bounceAngle);
                ball.speedY = nextSpeed * Math.sin(bounceAngle);

                // Add spin if player is moving paddle up/down
                if (keys['KeyW']) ball.spin = -1.2;
                else if (keys['KeyS']) ball.spin = 1.2;
                else ball.spin = 0;

                ball.x = p1.x + p1.width + ball.size;
                createSparks(ball.x, ball.y, '#00f3ff');
            }

            // Paddle 2 Collision Check (Right)
            if (
                ball.x + ball.size >= p2.x &&
                ball.x - ball.size <= p2.x + p2.width &&
                ball.y >= p2.y &&
                ball.y <= p2.y + p2.height
            ) {
                playSound('paddle');
                currentRally++;
                if (currentRally > maxRallyAchieved) maxRallyAchieved = currentRally;
                rallyCounterEl.textContent = `Rally: ${currentRally}`;

                let hitOffset = (ball.y - (p2.y + p2.height / 2)) / (p2.height / 2);
                let bounceAngle = hitOffset * (Math.PI / 3);

                let currentSpeed = Math.hypot(ball.speedX, ball.speedY);
                let nextSpeed = Math.min(ball.maxSpeed, currentSpeed * 1.05);

                ball.speedX = -nextSpeed * Math.cos(bounceAngle);
                ball.speedY = nextSpeed * Math.sin(bounceAngle);

                if (gameMode === '2p') {
                    if (keys['ArrowUp']) ball.spin = -1.2;
                    else if (keys['ArrowDown']) ball.spin = 1.2;
                    else ball.spin = 0;
                } else {
                    ball.spin = (Math.random() - 0.5) * 1.5;
                }

                ball.x = p2.x - ball.size;
                createSparks(ball.x, ball.y, '#ff007f');
            }

            // Scoring points
            if (ball.x < 0) {
                playSound('score');
                p2.score++;
                p2ScoreEl.textContent = p2.score;
                checkGameOver();
                if (gameState === 'PLAYING') resetBall(1);
            } else if (ball.x > canvas.width) {
                playSound('score');
                p1.score++;
                p1ScoreEl.textContent = p1.score;
                checkGameOver();
                if (gameState === 'PLAYING') resetBall(-1);
            }

            // Update particle effects
            particles.forEach((p, index) => {
                p.update();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function createSparks(x, y, color) {
            for (let i = 0; i < 14; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function checkGameOver() {
            if (p1.score >= maxScore || p2.score >= maxScore) {
                gameState = 'GAMEOVER';
                gameoverScreen.classList.remove('hidden');
                
                let winnerName = p1.score >= maxScore ? 'PLAYER 1 WINS!' : (gameMode === '1p' ? 'AI OPPONENT WINS!' : 'PLAYER 2 WINS!');
                winnerText.textContent = winnerName;
                winnerText.className = `text-4xl md:text-5xl font-black mb-2 ${p1.score >= maxScore ? 'text-cyan-400 neon-glow' : 'text-pink-500 neon-glow-pink'}`;
                finalStats.textContent = `Score: ${p1.score} - ${p2.score} | Max Rally: ${maxRallyAchieved}`;
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw glowing center net
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // Draw center circle ambient
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Player 1 Paddle (Cyan Neon)
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#00f3ff';
            ctx.roundRect(p1.x, p1.y, p1.width, p1.height, 6);
            ctx.fill();

            // Draw Player 2 / AI Paddle (Pink Neon)
            ctx.shadowColor = '#ff007f';
            ctx.fillStyle = '#ff007f';
            ctx.roundRect(p2.x, p2.y, p2.width, p2.height, 6);
            ctx.fill();

            // Draw Ball (White glowing core)
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();

            // Reset shadow for particles
            ctx.shadowBlur = 0;

            // Draw Particles
            particles.forEach(p => p.draw());
        }

        // Main Game Loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start animation loop on load
        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
