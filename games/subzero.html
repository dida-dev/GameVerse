<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Zero Courier</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #070913; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 15px; text-align: center; }
        .game-container { position: relative; background: #0f172a; border: 2px solid #1e293b; border-radius: 12px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        canvas { display: block; background: #020617; border-radius: 8px; }
        .ui-panel { display: flex; justify-content: space-between; width: 620px; margin-top: 15px; font-size: 0.95rem; font-weight: bold; }
        .stat { background: #1e293b; padding: 8px 15px; border-radius: 6px; border: 1px solid #334155; }
        .stat span { color: #38bdf8; }
        .thermal-bar-container { width: 150px; height: 14px; background: #0f172a; border-radius: 7px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px; border: 1px solid #475569; }
        .thermal-fill { height: 100%; width: 0%; background: #ef4444; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <h1>Sub-Zero Courier</h1>
    <p>Use <b>Arrow Keys</b> or <b>W/A/S/D</b> to pilot the drone. Deliver the thermal package to the green landing pad without overheating or crashing!</p>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <div class="ui-panel">
        <div class="stat">Sector: <span id="sectorVal">1</span></div>
        <div class="stat">Thermal Leak: <span id="thermalVal">0</span>% <div class="thermal-bar-container"><div class="thermal-fill" id="thermalFill"></div></div></div>
        <div class="stat">Score: <span id="scoreVal">0</span></div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let sector = 1;
let thermal = 0; // 0 to 100%
let gameOver = false;
let gameWon = false;

// Drone state
let drone = {
    x: 50,
    y: 200,
    vx: 0,
    vy: 0,
    radius: 12,
    speed: 0.25,
    friction: 0.985
};

// Input handling
let keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// Cavern layout (obstacles array: {x, y, w, h})
let walls = [];
let landingPad = { x: 520, y: 320, w: 60, h: 15 };

function initSector() {
    drone.x = 50;
    drone.y = 200;
    drone.vx = 0;
    drone.vy = 0;
    thermal = 0;
    gameOver = false;
    gameWon = false;

    // Generate random cave stalactites and stalagmites
    walls = [
        { x: 0, y: 0, w: 600, h: 40 },   // Top boundary
        { x: 0, y: 360, w: 600, h: 40 }, // Bottom boundary
    ];

    // Procedural random obstacle pillars inside the cave
    let numPillars = 3 + sector;
    for (let i = 0; i < numPillars; i++) {
        let wx = 120 + i * (400 / numPillars);
        let isTop = i % 2 === 0;
        let wh = 80 + Math.random() * 80;
        walls.push({
            x: wx,
            y: isTop ? 40 : 360 - wh,
            w: 40,
            h: wh
        });
    }

    // Place landing pad near the end
    landingPad = { x: 520, y: 150 + Math.random() * 150, w: 50, h: 12 };
}

function update() {
    if (gameOver || gameWon) return;

    // Apply thrust from inputs
    if (keys['ArrowUp'] || keys['w'] || keys['W']) drone.vy -= drone.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) drone.vy += drone.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) drone.vx -= drone.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) drone.vx += drone.speed;

    // Apply friction/drag
    drone.vx *= drone.friction;
    drone.vy *= drone.friction;

    // Update position
    drone.x += drone.vx;
    drone.y += drone.vy;

    // Canvas boundary checks
    if (drone.x - drone.radius < 0) { drone.x = drone.radius; drone.vx *= -0.5; addThermal(3); }
    if (drone.x + drone.radius > canvas.width) { drone.x = canvas.width - drone.radius; drone.vx *= -0.5; addThermal(3); }
    if (drone.y - drone.radius < 0) { drone.y = drone.radius; drone.vy *= -0.5; addThermal(3); }
    if (drone.y + drone.radius > canvas.height) { drone.y = canvas.height - drone.radius; drone.vy *= -0.5; addThermal(3); }

    // Wall collision checks (AABB vs Circle approximation)
    for (let wall of walls) {
        if (
            drone.x + drone.radius > wall.x &&
            drone.x - drone.radius < wall.x + wall.w &&
            drone.y + drone.radius > wall.y &&
            drone.y - drone.radius < wall.y + wall.h
        ) {
            // Collision detected! Bounce back and increase heat
            drone.vx *= -0.6;
            drone.vy *= -0.6;
            addThermal(8 + sector * 2);
            
            // Push out of wall slightly to prevent sticking
            if (drone.x < wall.x + wall.w / 2) drone.x = wall.x - drone.radius;
            else drone.x = wall.x + wall.w + drone.radius;
        }
    }

    // Landing pad check
    if (
        drone.x > landingPad.x &&
        drone.x < landingPad.x + landingPad.w &&
        drone.y + drone.radius >= landingPad.y &&
        drone.y + drone.radius <= landingPad.y + landingPad.h + 5
    ) {
        if (Math.abs(drone.vx) < 2 && Math.abs(drone.vy) < 2) {
            gameWon = true;
            score += 500 - Math.floor(thermal * 3);
            setTimeout(() => {
                sector++;
                initSector();
            }, 1800);
        } else {
            // Landed too hard!
            addThermal(15);
            drone.vy = -2; // bounce off
        }
    }
}

function addThermal(amount) {
    thermal += amount;
    if (thermal >= 100) {
        thermal = 100;
        gameOver = true;
    }
    document.getElementById('thermalVal').innerText = Math.floor(thermal);
    document.getElementById('thermalFill').style.width = thermal + '%';
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw cavern walls
    ctx.fillStyle = '#1e293b';
    for (let wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    }

    // Draw landing pad
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(landingPad.x, landingPad.y, landingPad.w, landingPad.h);
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur = 10;
    ctx.fillRect(landingPad.x, landingPad.y, landingPad.w, landingPad.h);
    ctx.shadowBlur = 0; // reset

    // Draw Drone
    ctx.save();
    ctx.translate(drone.x, drone.y);
    
    // Outer glow based on thermal level
    ctx.shadowColor = thermal > 70 ? '#ef4444' : '#38bdf8';
    ctx.shadowBlur = 12;

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(0, 0, drone.radius, 0, Math.PI * 2);
    ctx.fill();

    // Inner core package
    ctx.fillStyle = thermal > 70 ? '#ef4444' : '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, drone.radius / 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // UI overlays on canvas if game over / won
    if (gameOver) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("THERMAL MELTDOWN! (Press R to Retry)", canvas.width / 2, canvas.height / 2);
    } else if (gameWon) {
        ctx.fillStyle = 'rgba(34, 197, 94, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("SECTOR DELIVERED! Loading next...", canvas.width / 2, canvas.height / 2);
    }

    // Update UI text
    document.getElementById('sectorVal').innerText = sector;
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('thermalVal').innerText = Math.floor(thermal);
    document.getElementById('thermalFill').style.width = thermal + '%';
}

window.addEventListener('keydown', (e) => {
    if ((e.key === 'r' || e.key === 'R') && gameOver) {
        sector = 1;
        score = 0;
        initSector();
    }
});

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initSector();
gameLoop();
</script>
</body>
</html>
