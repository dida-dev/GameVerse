<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crystal Crush: Neon Pop</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #09090e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #120c24 0%, #09090e 100%);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }
        .stat-box {
            text-align: center;
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #00f3ff;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        #board-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: pointer;
            border-radius: 12px;
            background: rgba(10, 10, 18, 0.7);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(180, 0, 255, 0.1);
        }
        footer {
            padding: 15px 20px 25px 20px;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #b000ff);
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 243, 255, 0.3);
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        #overlay h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #00f3ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
        #overlay p {
            color: #a0a0b0;
            font-size: 14px;
            margin: 0 0 25px 0;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div id="score-val" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Best</div>
            <div id="high-score-val" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time</div>
            <div id="time-val" class="stat-value">60s</div>
        </div>
    </header>

    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <footer>
        <button class="btn" id="sound-btn">Audio: ON</button>
        <button class="btn" id="restart-btn">Restart</button>
    </footer>

    <div id="overlay">
        <h1 id="overlay-title">CRYSTAL CRUSH</h1>
        <p id="overlay-desc">Match 3 or more neon crystals horizontally or vertically before time runs out!</p>
        <button class="btn" id="start-btn" style="font-size: 18px; padding: 12px 35px;">START GAME</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const COLS = 6;
    const ROWS = 6;
    let tileSize = 60;
    
    let board = [];
    let score = 0;
    let highScore = localStorage.getItem('crystal_high_score') || 0;
    let timeLeft = 60;
    let gameActive = false;
    let timerInterval = null;
    let soundEnabled = true;

    // Selection & Animation state
    let selectedCell = null;
    let animQueue = [];
    let isProcessing = false;
    let particles = [];
    let floatingTexts = [];

    // Colors / Gem Types
    const GEM_TYPES = 5; // 0 to 4
    const GEM_COLORS = [
        { primary: '#ff0055', glow: '#ff77aa', shape: 'circle' },
        { primary: '#00f3ff', glow: '#88f9ff', shape: 'diamond' },
        { primary: '#b000ff', glow: '#e088ff', shape: 'star' },
        { primary: '#00ff66', glow: '#88ffaa', shape: 'square' },
        { primary: '#ffaa00', glow: '#ffdd77', shape: 'triangle' }
    ];

    document.getElementById('high-score-val').innerText = highScore;

    // Web Audio Setup
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!soundEnabled || !audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playPopSound(combo = 1) {
        playTone(300 + (combo * 80), 'sine', 0.15, 0.15);
    }
    function playSwapSound() {
        playTone(220, 'triangle', 0.1, 0.1);
    }
    function playFailSound() {
        playTone(120, 'sawtooth', 0.2, 0.15);
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const maxW = wrapper.clientWidth - 20;
        const maxH = wrapper.clientHeight - 20;
        const size = Math.min(maxW, maxH, 400);
        
        canvas.width = size;
        canvas.height = size;
        tileSize = size / COLS;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Board Generation
    function createBoard() {
        do {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = Math.floor(Math.random() * GEM_TYPES);
                }
            }
        } while (checkMatches().length > 0 || !hasPossibleMoves());
    }

    function checkMatches() {
        let matched = [];
        // Horizontal
        for (let r = 0; r < ROWS; r++) {
            let matchLen = 1;
            for (let c = 0; c < COLS; c++) {
                if (c < COLS - 1 && board[r][c] !== null && board[r][c] === board[r][c+1]) {
                    matchLen++;
                } else {
                    if (matchLen >= 3) {
                        for (let i = c - matchLen + 1; i <= c; i++) {
                            if (!matched.some(m => m.r === r && m.c === i)) {
                                matched.push({ r, c: i });
                            }
                        }
                    }
                    matchLen = 1;
                }
            }
        }
        // Vertical
        for (let c = 0; c < COLS; c++) {
            let matchLen = 1;
            for (let r = 0; r < ROWS; r++) {
                if (r < ROWS - 1 && board[r][c] !== null && board[r][c] === board[r+1][c]) {
                    matchLen++;
                } else {
                    if (matchLen >= 3) {
                        for (let i = r - matchLen + 1; i <= r; i++) {
                            if (!matched.some(m => m.r === i && m.c === c)) {
                                matched.push({ r: i, c });
                            }
                        }
                    }
                    matchLen = 1;
                }
            }
        }
        return matched;
    }

    function hasPossibleMoves() {
        // Simple check: can any swap create a match?
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // Test right neighbor
                if (c < COLS - 1) {
                    swapCells(r, c, r, c+1);
                    let m = checkMatches().length > 0;
                    swapCells(r, c, r, c+1);
                    if (m) return true;
                }
                // Test bottom neighbor
                if (r < ROWS - 1) {
                    swapCells(r, c, r+1, c);
                    let m = checkMatches().length > 0;
                    swapCells(r, c, r+1, c);
                    if (m) return true;
                }
            }
        }
        return false;
    }

    function swapCells(r1, c1, r2, c2) {
        let temp = board[r1][c1];
        board[r1][c1] = board[r2][c2];
        board[r2][c2] = temp;
    }

    // Particle & Floating Text FX
    function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 4;
            particles.push({
                x: x + tileSize / 2,
                y: y + tileSize / 2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: color,
                size: 3 + Math.random() * 3
            });
        }
    }

    function spawnFloatingText(x, y, text) {
        floatingTexts.push({
            x: x + tileSize / 2,
            y: y,
            text: text,
            life: 1.0,
            vy: -1.5
        });
    }

    // Game Loop & Resolution Cascade
    async function processBoard() {
        isProcessing = true;
        let combo = 0;

        while (true) {
            let matches = checkMatches();
            if (matches.length === 0) break;

            combo++;
            let points = matches.length * 10 * combo;
            score += points;
            document.getElementById('score-val').innerText = score;

            // Visual effects for matches
            matches.forEach(m => {
                const color = GEM_COLORS[board[m.r][m.c]].primary;
                spawnParticles(m.c * tileSize, m.r * tileSize, color);
                board[m.r][m.c] = null;
            });

            if (matches.length >= 4) {
                spawnFloatingText(matches[0].c * tileSize, matches[0].r * tileSize, `COMBO x${combo}!`);
            }
            playPopSound(combo);

            draw();
            await sleep(250);

            // Gravity / Fall down
            for (let c = 0; c < COLS; c++) {
                let emptyRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] !== null) {
                        if (r !== emptyRow) {
                            board[emptyRow][c] = board[r][c];
                            board[r][c] = null;
                        }
                        emptyRow--;
                    }
                }
                // Fill top empty spaces with new gems
                for (let r = emptyRow; r >= 0; r--) {
                    board[r][c] = Math.floor(Math.random() * GEM_TYPES);
                }
            }

            draw();
            await sleep(250);
        }

        // Check if no moves left, shuffle board
        if (!hasPossibleMoves()) {
            spawnFloatingText(canvas.width / 2 - 30, canvas.height / 2, "SHUFFLE!");
            createBoard();
        }

        isProcessing = false;
        draw();
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Input Handling (Touch & Click)
    let touchStartCell = null;

    canvas.addEventListener('pointerdown', (e) => {
        if (!gameActive || isProcessing) return;
        initAudio();

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);

        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

        if (!selectedCell) {
            selectedCell = { r, c };
            playSwapSound();
        } else {
            // Check if adjacent
            const dr = Math.abs(selectedCell.r - r);
            const dc = Math.abs(selectedCell.c - c);

            if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                // Try swap
                const r1 = selectedCell.r, c1 = selectedCell.c;
                selectedCell = null;

                swapCells(r1, c1, r, c);
                draw();

                let matches = checkMatches();
                if (matches.length > 0) {
                    processBoard();
                } else {
                    // Swap back if invalid
                    playFailSound();
                    swapCells(r1, c1, r, c);
                    draw();
                }
            } else {
                // Select new cell
                selectedCell = { r, c };
                playSwapSound();
            }
        }
        draw();
    });

    // Rendering
    function drawGem(ctx, type, x, y, size) {
        const gem = GEM_COLORS[type];
        if (!gem) return;

        ctx.save();
        ctx.shadowColor = gem.glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = gem.primary;

        const cx = x + size / 2;
        const cy = y + size / 2;
        const r = size * 0.35;

        ctx.beginPath();
        if (gem.shape === 'circle') {
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
        } else if (gem.shape === 'diamond') {
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r, cy);
            ctx.lineTo(cx, cy + r);
            ctx.lineTo(cx - r, cy);
            ctx.closePath();
            ctx.fill();
        } else if (gem.shape === 'square') {
            ctx.roundRect(cx - r, cy - r, r * 2, r * 2, 6);
            ctx.fill();
        } else if (gem.shape === 'triangle') {
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r, cy + r * 0.8);
            ctx.lineTo(cx - r, cy + r * 0.8);
            ctx.closePath();
            ctx.fill();
        } else if (gem.shape === 'star') {
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(cx + Math.cos((18 + i * 72) * Math.PI / 180) * r, cy - Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(cx + Math.cos((54 + i * 72) * Math.PI / 180) * (r * 0.5), cy - Math.sin((54 + i * 72) * Math.PI / 180) * (r * 0.5));
            }
            ctx.closePath();
            ctx.fill();
        }

        // Inner specular highlight
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw grid lines / cell backgrounds
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = c * tileSize;
                const y = r * tileSize;

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, tileSize, tileSize);

                // Draw gem
                const type = board[r][c];
                if (type !== null && type !== undefined) {
                    drawGem(ctx, type, x, y, tileSize);
                }

                // Draw selection highlight
                if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 15;
                    ctx.strokeRect(x + 3, y + 3, tileSize - 6, tileSize - 6);
                    ctx.shadowBlur = 0;
                }
            }
        }

        // Draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;

            if (p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Draw floating text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.life -= 0.02;

            if (ft.life <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = ft.life;
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 10;
            ctx.fillText(ft.text, ft.x - 15, ft.y);
            ctx.restore();
        }
    }

    // Game Control Flow
    function startGame() {
        initAudio();
        score = 0;
        timeLeft = 60;
        gameActive = true;
        selectedCell = null;
        particles = [];
        floatingTexts = [];

        document.getElementById('score-val').innerText = score;
        document.getElementById('time-val').innerText = timeLeft + 's';
        document.getElementById('overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('overlay').style.display = 'none';
        }, 300);

        createBoard();
        draw();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            document.getElementById('time-val').innerText = timeLeft + 's';

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('crystal_high_score', highScore);
            document.getElementById('high-score-val').innerText = highScore;
        }

        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        setTimeout(() => overlay.style.opacity = '1', 10);

        document.getElementById('overlay-title').innerText = "TIME'S UP!";
        document.getElementById('overlay-desc').innerText = `Final Score: ${score}\nBest Score: ${highScore}`;
        document.getElementById('start-btn').innerText = "PLAY AGAIN";
    }

    // Button Listeners
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', () => {
        endGame();
        startGame();
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-btn').innerText = soundEnabled ? "Audio: ON" : "Audio: OFF";
    });

    // Initial draw preview
    createBoard();
    draw();
</script>

</body>
</html>
