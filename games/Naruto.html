<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>Ninja Attack Mobile</title>

<style>

  #hubBtn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 100;
  padding: 10px 16px;
  border: 2px solid rgba(255,255,255,.35);
  border-radius: 12px;
  background: rgba(20,20,20,.75);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#hubBtn:active {
  transform: scale(.94);
  background: #333;
}


* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  font-family: Arial, sans-serif;
  background: #080b12;
}

#game {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(circle at 75% 18%, #fff4bd 0 35px, transparent 36px),
    linear-gradient(#0c1324 0%, #17243c 62%, #0b0b0b 62%);
}

/* Lune */
#moonGlow {
  position: absolute;
  width: 130px;
  height: 130px;
  right: calc(15% - 15px);
  top: 5%;
  border-radius: 50%;
  background: rgba(255,244,189,.12);
  box-shadow: 0 0 50px rgba(255,244,189,.25);
}

/* Sol */
#ground {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 38%;
  background:
    repeating-linear-gradient(
      0deg,
      #141414 0 18px,
      #1e1e1e 19px 20px
    );
  border-top: 5px solid #584328;
}

/* HUD */
#hud {
  position: absolute;
  z-index: 50;
  top: 10px;
  left: 10px;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(0,0,0,.58);
  border: 1px solid rgba(255,255,255,.2);
  color: white;
  font-size: 15px;
  line-height: 1.35;
}

#healthBar {
  width: 150px;
  height: 12px;
  margin: 3px 0 4px;
  overflow: hidden;
  border-radius: 10px;
  background: #333;
}

#health {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,#e60000,#ff6262);
  transition: width .15s;
}

/* PERSONNAGE */
#player {
  position: absolute;
  width: 54px;
  height: 78px;
  z-index: 20;
  transform-origin: center bottom;
}

.head {
  position: absolute;
  width: 40px;
  height: 40px;
  left: 7px;
  top: 0;
  border-radius: 50%;
  background: #090909;
  border: 3px solid #303030;
}

.eye {
  position: absolute;
  top: 15px;
  width: 7px;
  height: 5px;
  background: white;
  border-radius: 50%;
  z-index: 3;
}

.eye.left { left: 12px; }
.eye.right { right: 12px; }

.mask {
  position: absolute;
  left: 2px;
  top: 20px;
  width: 42px;
  height: 14px;
  background: #202020;
}

.body {
  position: absolute;
  left: 10px;
  top: 37px;
  width: 34px;
  height: 35px;
  border-radius: 8px;
  background: #090909;
}

.leg {
  position: absolute;
  top: 65px;
  width: 13px;
  height: 23px;
  background: #090909;
}

.leg.left {
  left: 11px;
  transform: rotate(8deg);
}

.leg.right {
  right: 11px;
  transform: rotate(-8deg);
}

/* Arme / épée */
.sword {
  position: absolute;
  left: 29px;
  top: 38px;
  width: 62px;
  height: 7px;
  border-radius: 5px;
  background: linear-gradient(90deg,#bbb,#fff,#bbb);
  transform: rotate(-35deg);
  box-shadow: 0 0 6px white;
  transform-origin: left center;
}

/* Zone d'attaque */
.attackHitbox {
  position: absolute;
  z-index: 15;
  width: 100px;
  height: 75px;
  pointer-events: none;
}

/* ENNEMIS */
.enemy {
  position: absolute;
  width: 52px;
  height: 75px;
  z-index: 15;
}

.enemy .head {
  background: #521313;
}

.enemy .body {
  background: #751b1b;
}

.enemy .leg {
  background: #421010;
}

.enemy .eye {
  background: #ffd000;
}

/* Pièces */
.coin {
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 3px solid #ffd84a;
  background: radial-gradient(circle,#fff47c,#ffae00);
  box-shadow: 0 0 15px #ffc400;
  z-index: 10;
}

/* Texte */
.floatText {
  position: absolute;
  z-index: 100;
  color: #ffe05b;
  font-size: 19px;
  font-weight: bold;
  pointer-events: none;
  animation: float .7s forwards;
}

@keyframes float {
  to {
    transform: translateY(-45px);
    opacity: 0;
  }
}

/* CONTROLES MOBILE */
#controls {
  position: absolute;
  z-index: 80;
  left: 0;
  right: 0;
  bottom: max(15px, env(safe-area-inset-bottom));
  height: 145px;
  pointer-events: none;
}

#joystick {
  position: absolute;
  left: 20px;
  bottom: 10px;
  display: flex;
  gap: 12px;
  pointer-events: auto;
}

.ctrl {
  width: 68px;
  height: 68px;
  border: 2px solid rgba(255,255,255,.45);
  border-radius: 50%;
  color: white;
  background: rgba(30,30,30,.7);
  font-size: 27px;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}

.ctrl:active {
  background: rgba(255,255,255,.35);
  transform: scale(.94);
}

/* A / B */
#actions {
  position: absolute;
  right: 20px;
  bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  pointer-events: auto;
}

.action {
  width: 74px;
  height: 74px;
  border: 3px solid rgba(255,255,255,.5);
  border-radius: 50%;
  color: white;
  font-size: 25px;
  font-weight: 900;
  box-shadow: 0 5px 15px rgba(0,0,0,.5);
}

#attackBtn {
  background: #c92836;
}

#jumpBtn {
  background: #2868c9;
}

.action:active {
  transform: scale(.9);
}

/* Game over */
#gameOver {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 200;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: rgba(0,0,0,.88);
  color: white;
}

#gameOver h1 {
  margin: 0 0 10px;
  color: #ff3434;
  font-size: 48px;
  text-shadow: 0 0 20px red;
}

#restart {
  padding: 14px 25px;
  border: 0;
  border-radius: 12px;
  background: #e63946;
  color: white;
  font-size: 19px;
  font-weight: bold;
}

/* Desktop */
@media (min-width: 800px) {
  #controls {
    display: none;
  }
}
</style>
</head>

<body>

<div id="game">

  <button id="hubBtn">🏠 Hub</button>


  <div id="moonGlow"></div>
  <div id="ground"></div>

  <div id="hud">
    🥷 Ninja Attack
    <div id="healthBar">
      <div id="health"></div>
    </div>
    ❤️ <span id="hpText">100</span>
    &nbsp; ⭐ <span id="score">0</span>
    &nbsp; 🪙 <span id="coins">0</span>

    <br/>

    <span id="how to play :">how to play :<br/>
    arrows to move A to attack
    </span>


  </div>

  <div id="player">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mask"></div>
    </div>
    <div class="body"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
    <div class="sword"></div>
  </div>

  <!-- CONTROLES -->
  <div id="controls">

    <div id="joystick">
      <button class="ctrl" id="leftBtn">◀</button>
      <button class="ctrl" id="rightBtn">▶</button>
    </div>

    <div id="actions">
      <button class="action" id="jumpBtn">B</button>
      <button class="action" id="attackBtn">A</button>
    </div>

  </div>

  <div id="gameOver">
    <div>
      <h1>GAME OVER</h1>
      <p>Score : <b id="finalScore">0</b></p>
      <button id="restart">PLAY AGAIN ? 🥷</button>
    </div>
  </div>

</div>

<script>
/* =========================
   VARIABLES
========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");

const healthBar = document.getElementById("health");
const hpText = document.getElementById("hpText");
const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");

let playerX = 150;
let playerY = 0;

let velocityY = 0;

let hp = 100;
let score = 0;
let coins = 0;

let gameRunning = true;
let attacking = false;

let movingLeft = false;
let movingRight = false;

let enemies = [];
let coinList = [];

let lastDamage = 0;

const gravity = 0.85;
const jumpPower = 17;

/* =========================
   SOL
========================= */

function groundHeight() {
  return window.innerHeight * 0.38;
}

/* =========================
   JOUEUR
========================= */

function jump() {
  if (!gameRunning) return;

  // Peut sauter seulement depuis le sol
  if (playerY <= 0) {
    playerY = 1;
    velocityY = jumpPower;
  }
}

function movePlayer() {

  if (movingLeft) {
    playerX -= 5;
  }

  if (movingRight) {
    playerX += 5;
  }

  playerX = Math.max(
    0,
    Math.min(window.innerWidth - 55, playerX)
  );

  velocityY -= gravity;
  playerY += velocityY;

  if (playerY <= 0) {
    playerY = 0;
    velocityY = 0;
  }

  player.style.left = playerX + "px";

  player.style.bottom =
    (groundHeight() + playerY) + "px";
}

/* =========================
   ATTAQUE
========================= */

function attack() {

  if (!gameRunning || attacking) return;

  attacking = true;

  // Animation
  player.style.transform =
    "rotate(-12deg) scale(1.08)";

  // Vérification immédiate
  setTimeout(() => {

    if (!gameRunning) return;

    enemies.forEach((enemy, index) => {

      const playerCenter =
        playerX + 27;

      const enemyCenter =
        enemy.x + 26;

      const distance =
        Math.abs(playerCenter - enemyCenter);

      /*
        L'attaque fonctionne devant ET
        légèrement derrière le ninja.
      */
      if (distance < 105 &&
          Math.abs(enemy.y - playerY) < 80) {

        killEnemy(index);
      }
    });

  }, 80);

  setTimeout(() => {

    attacking = false;
    player.style.transform = "";

  }, 280);
}

/* =========================
   ENNEMIS
========================= */

function createEnemy() {

  if (!gameRunning) return;

  const element =
    document.createElement("div");

  element.className = "enemy";

  element.innerHTML = `
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mask"></div>
    </div>
    <div class="body"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>
  `;

  const fromLeft =
    Math.random() < .5;

  const enemy = {
    element: element,
    x: fromLeft ? -70 : window.innerWidth + 70,
    y: 0,
    speed: 1.4 + Math.random() * 1.4
  };

  game.appendChild(element);
  enemies.push(enemy);
}

function killEnemy(index) {

  const enemy = enemies[index];

  score += 100;
  scoreText.textContent = score;

  showText(
    enemy.x,
    groundHeight() + 65,
    "+100 ⭐"
  );

  enemy.element.remove();

  enemies.splice(index, 1);
}

/* =========================
   PIÈCES
========================= */

function createCoin() {

  if (!gameRunning) return;

  const element =
    document.createElement("div");

  element.className = "coin";

  const coin = {
    element: element,
    x: 60 + Math.random() *
      Math.max(1, window.innerWidth - 120),
    y: 30 + Math.random() * 180
  };

  element.style.left =
    coin.x + "px";

  element.style.bottom =
    (groundHeight() + coin.y) + "px";

  game.appendChild(element);
  coinList.push(coin);
}

/* =========================
   DÉGÂTS
========================= */

function damagePlayer() {

  const now = Date.now();

  // Invincibilité temporaire
  if (now - lastDamage < 900) return;

  lastDamage = now;

  hp -= 10;

  hp = Math.max(0, hp);

  healthBar.style.width =
    hp + "%";

  hpText.textContent = hp;

  player.style.filter =
    "brightness(3)";

  setTimeout(() => {
    player.style.filter = "";
  }, 130);

  if (hp <= 0) {
    endGame();
  }
}

/* =========================
   TEXTE FLOTTANT
========================= */

function showText(x, y, text) {

  const el =
    document.createElement("div");

  el.className = "floatText";
  el.textContent = text;

  el.style.left = x + "px";
  el.style.top = y + "px";

  game.appendChild(el);

  setTimeout(() => {
    el.remove();
  }, 700);
}

/* =========================
   UPDATE
========================= */

function update() {

  if (!gameRunning) return;

  movePlayer();

  /*
    ENNEMIS
  */
  enemies.forEach(enemy => {

    if (enemy.x < playerX) {
      enemy.x += enemy.speed;
    } else {
      enemy.x -= enemy.speed;
    }

    enemy.element.style.left =
      enemy.x + "px";

    enemy.element.style.bottom =
      groundHeight() + "px";

    const distance =
      Math.abs(enemy.x - playerX);

    if (distance < 42 &&
        Math.abs(enemy.y - playerY) < 55) {

      damagePlayer();
    }
  });

  /*
    PIÈCES
  */
  for (let i = coinList.length - 1; i >= 0; i--) {

    const coin = coinList[i];

    const dx =
      Math.abs(coin.x - playerX);

    const dy =
      Math.abs(coin.y - playerY);

    if (dx < 45 && dy < 65) {

      coins++;
      score += 25;

      coinsText.textContent = coins;
      scoreText.textContent = score;

      showText(
        coin.x,
        window.innerHeight -
          groundHeight() -
          coin.y,
        "+25"
      );

      coin.element.remove();
      coinList.splice(i, 1);
    }
  }

  requestAnimationFrame(update);
}

/* =========================
   TOUCH CONTROLS
========================= */

function holdButton(button, onStart, onEnd) {

  button.addEventListener(
    "touchstart",
    function(e) {
      e.preventDefault();
      onStart();
    },
    { passive: false }
  );

  button.addEventListener(
    "touchend",
    function(e) {
      e.preventDefault();
      onEnd();
    },
    { passive: false }
  );

  button.addEventListener(
    "touchcancel",
    function(e) {
      e.preventDefault();
      onEnd();
    },
    { passive: false }
  );

  /*
    Permet aussi de tester sur PC.
  */
  button.addEventListener(
    "mousedown",
    function(e) {
      e.preventDefault();
      onStart();
    }
  );

  button.addEventListener(
    "mouseup",
    function(e) {
      e.preventDefault();
      onEnd();
    }
  );

  button.addEventListener(
    "mouseleave",
    onEnd
  );
}

/* Gauche */
holdButton(
  document.getElementById("leftBtn"),
  () => movingLeft = true,
  () => movingLeft = false
);

/* Droite */
holdButton(
  document.getElementById("rightBtn"),
  () => movingRight = true,
  () => movingRight = false
);

/* A = ATTAQUE */
document.getElementById("attackBtn")
  .addEventListener("touchstart", e => {
    e.preventDefault();
    attack();
  }, { passive: false });

document.getElementById("attackBtn")
  .addEventListener("mousedown", e => {
    e.preventDefault();
    attack();
  });

/* B = SAUT */
document.getElementById("jumpBtn")
  .addEventListener("touchstart", e => {
    e.preventDefault();
    jump();
  }, { passive: false });

document.getElementById("jumpBtn")
  .addEventListener("mousedown", e => {
    e.preventDefault();
    jump();
  });

/* =========================
   CLAVIER
========================= */

document.addEventListener("keydown", e => {

  const key = e.key.toLowerCase();

  if (key === "arrowleft" || key === "q") {
    movingLeft = true;
  }

  if (key === "arrowright" || key === "d") {
    movingRight = true;
  }

  if (key === " " ||
      key === "arrowup") {
    jump();
  }

  if (key === "a" ||
      key === "f") {
    attack();
  }
});

document.addEventListener("keyup", e => {

  const key = e.key.toLowerCase();

  if (key === "arrowleft" || key === "q") {
    movingLeft = false;
  }

  if (key === "arrowright" || key === "d") {
    movingRight = false;
  }
});

/* =========================
   GAME OVER
========================= */

function endGame() {

  gameRunning = false;

  document.getElementById("finalScore")
    .textContent = score;

  document.getElementById("gameOver")
    .style.display = "flex";
}

document.getElementById("restart")
  .addEventListener("click", () => {
    location.reload();
  });

/* =========================
   SPAWN
========================= */

setInterval(createEnemy, 1600);
setInterval(createCoin, 2200);

setTimeout(createEnemy, 700);
setTimeout(createCoin, 1200);

/* =========================
   Back To Hub
========================= */

document.getElementById("hubBtn").addEventListener("click", () => {
  window.location.href = "../index.html";
});

/* START */
update();
</script>

</body>
</html>
