<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print a Brainrot</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #15152b, #302060);
        color: white;
        overflow-x: hidden;
    }

    header {
        background: rgba(0,0,0,.35);
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(255,255,255,.1);
    }

    header h1 {
        font-size: 28px;
        color: #ff4df3;
        text-shadow: 0 0 15px #ff4df3;
    }

    .money {
        background: #17172b;
        padding: 10px 18px;
        border-radius: 20px;
        color: #ffd83d;
        font-weight: bold;
        box-shadow: 0 0 15px rgba(255,216,61,.2);
    }

    main {
        max-width: 1100px;
        margin: auto;
        padding: 30px 20px;
    }

    .printer {
        background: rgba(255,255,255,.08);
        border: 2px solid rgba(255,255,255,.12);
        border-radius: 25px;
        padding: 35px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }

    .printer h2 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .printer p {
        color: #aaa;
        margin-bottom: 25px;
    }

    .print-button {
        border: none;
        background: linear-gradient(135deg, #ff3cac, #784bff);
        color: white;
        padding: 18px 45px;
        border-radius: 15px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(255,60,172,.35);
        transition: .15s;
    }

    .print-button:hover {
        transform: translateY(-3px) scale(1.03);
    }

    .print-button:active {
        transform: scale(.95);
    }

    .printer-machine {
        width: 230px;
        height: 150px;
        margin: 0 auto 25px;
        background: #39394f;
        border-radius: 15px;
        border: 5px solid #242438;
        position: relative;
    }

    .printer-machine::before {
        content: "";
        position: absolute;
        width: 90px;
        height: 15px;
        background: #11111d;
        top: 25px;
        left: 65px;
        border-radius: 5px;
    }

    .printer-machine::after {
        content: "🖨️";
        font-size: 55px;
        position: absolute;
        top: 55px;
        left: 80px;
    }

    .brainrots {
        margin-top: 35px;
    }

    .brainrots h2 {
        margin-bottom: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 18px;
    }

    .card {
        background: rgba(255,255,255,.08);
        border: 2px solid rgba(255,255,255,.1);
        border-radius: 18px;
        padding: 20px;
        text-align: center;
        animation: pop .3s ease;
    }

    .card .emoji {
        font-size: 65px;
        margin-bottom: 10px;
    }

    .card h3 {
        margin-bottom: 8px;
    }

    .rarity {
        font-size: 13px;
        font-weight: bold;
        padding: 5px 10px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 10px;
    }

    .common {
        background: #555;
    }

    .rare {
        background: #1687ff;
    }

    .epic {
        background: #a52cff;
    }

    .legendary {
        background: #ff9d00;
        color: #17100a;
    }

    .mythic {
        background: #ff174f;
        box-shadow: 0 0 15px #ff174f;
    }

    .empty {
        text-align: center;
        color: #777;
        padding: 40px;
        border: 2px dashed #444;
        border-radius: 15px;
    }

    .notification {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: #18182b;
        border: 2px solid #ff4df3;
        padding: 15px 25px;
        border-radius: 12px;
        opacity: 0;
        pointer-events: none;
        transition: .3s;
        z-index: 10;
    }

    .notification.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @keyframes pop {
        from {
            opacity: 0;
            transform: scale(.7);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @media(max-width:600px) {
        .printer {
            padding: 25px 15px;
        }

        .printer h2 {
            font-size: 25px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>🧠 PRINT A BRAINROT</h1>
    <div class="money">💵 $<span id="money">100</span></div>
</header>

<div class="notification" id="notification"></div>

<main>

    <section class="printer">

        <div class="printer-machine"></div>

        <h2>Brainrot Printer</h2>
        <p>Put $10 into the printer and get a random brainrot!</p>

        <button class="print-button" onclick="printBrainrot()">
            🖨️ PRINT BRAINROT — $10
        </button>

    </section>

    <section class="brainrots">
        <h2>🧠 Your Brainrots</h2>

        <div id="collection" class="grid">
            <div class="empty">
                You haven't printed any brainrots yet...
            </div>
        </div>
    </section>

</main>

<script>

let money = 100;

const brainrots = [
    {
        name: "Tralalero Tralala",
        emoji: "🦈",
        rarity: "Common",
        chance: 55
    },
    {
        name: "Bombardiro Crocodilo",
        emoji: "🐊",
        rarity: "Rare",
        chance: 25
    },
    {
        name: "Tung Tung Tung Sahur",
        emoji: "🥁",
        rarity: "Epic",
        chance: 13
    },
    {
        name: "Brr Brr Patapim",
        emoji: "🌳",
        rarity: "Legendary",
        chance: 6
    },
    {
        name: "Trippi Troppi",
        emoji: "🍤",
        rarity: "Mythic",
        chance: 1
    }
];

const collection = [];

function updateMoney() {
    document.getElementById("money").textContent = money;
}

function getRandomBrainrot() {

    const random = Math.random() * 100;

    let total = 0;

    for (const brainrot of brainrots) {

        total += brainrot.chance;

        if (random <= total) {
            return brainrot;
        }
    }

    return brainrots[0];
}

function printBrainrot() {

    if (money < 10) {
        showNotification("❌ You need $10 to print!");
        return;
    }

    money -= 10;

    const brainrot = getRandomBrainrot();

    collection.push(brainrot);

    updateMoney();
    renderCollection();

    showNotification(
        `🎉 You printed ${brainrot.name}!`
    );
}

function renderCollection() {

    const container = document.getElementById("collection");

    if (collection.length === 0) {
        container.innerHTML = `
            <div class="empty">
                You haven't printed any brainrots yet...
            </div>
        `;
        return;
    }

    container.innerHTML = "";

    collection.forEach((brainrot) => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="emoji">${brainrot.emoji}</div>

            <span class="rarity ${brainrot.rarity.toLowerCase()}">
                ${brainrot.rarity}
            </span>

            <h3>${brainrot.name}</h3>

            <p>🧠 Brainrot acquired!</p>
        `;

        container.appendChild(card);
    });
}

function showNotification(message) {

    const notification =
        document.getElementById("notification");

    notification.textContent = message;
    notification.classList.add("show");

    setTimeout(() => {
        notification.classList.remove("show");
    }, 2000);
}

updateMoney();

</script>

</body>
</html>
