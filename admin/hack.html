        let index = 0;
        let isMatrixMode = false;
        let matrixAnimation = null;

        const codeContent = document.getElementById('code-content');
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const speed = 3;

        // Configuration de la pluie binaire
        let columns = [];
        const fontSize = 16;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const totalColumns = Math.floor(canvas.width / fontSize);
            columns = Array(totalColumns).fill(1);
        }

        // Animation qui dessine les lignes qui tombent
        function drawMatrix() {
            // Un fond noir semi-transparent crée l'effet de traînée (fade)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0'; // Couleur verte
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < columns.length; i++) {
                // Choisit au hasard entre 0 et 1
                const text = Math.round(Math.random()).toString();
                const x = i * fontSize;
                const y = columns[i] * fontSize;

                ctx.fillText(text, x, y);

                // Si le bit dépasse le bas de l'écran, on le renvoie en haut aléatoirement
                if (y > canvas.height && Math.random() > 0.975) {

        function startMatrix() {

            canvas.style.display = 'block';

            matrixAnimation = setInterval(drawMatrix, 33);

        function stopMatrix() {
            clearInterval(matrixAnimation);
            canvas.style.display = 'none';
