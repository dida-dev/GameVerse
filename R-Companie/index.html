<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCorp - Python Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #1e293b; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; }
        .brand { text-align: center; margin-bottom: 30px; color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn-auth { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; color: #0f172a; font-size: 16px; font-weight: bold; cursor: pointer; }
        .toggle-link { text-align: center; margin-top: 20px; font-size: 14px; color: #cbd5e1; }
        .toggle-link span { color: #38bdf8; cursor: pointer; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand">
        <h2>NexusCorp</h2>
        <p id="portalSubtitle">Employee Workspace Login</p>
    </div>
    
    <form id="authForm">
        <div class="form-group" id="nameGroup" style="display: none;">
            <label for="username">Full Name</label>
            <input type="text" id="username" placeholder="e.g. Alex Carter">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="name@company.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-auth" id="submitBtn">Sign In</button>
    </form>

    <div class="toggle-link" id="togglePortal">
        Don't have an account? <span id="toggleAction">Create Account</span>
    </div>
</div>

<script>
    let isLoginMode = true;
    const authForm = document.getElementById('authForm');
    const nameGroup = document.getElementById('nameGroup');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const portalSubtitle = document.getElementById('portalSubtitle');
    const togglePortal = document.getElementById('togglePortal');

    togglePortal.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            portalSubtitle.innerText = "Employee Workspace Login";
            nameGroup.style.display = "none";
            submitBtn.innerText = "Sign In";
            togglePortal.innerHTML = `Don't have an account? <span id="toggleAction">Create Account</span>`;
        } else {
            portalSubtitle.innerText = "Create Your Corporate Profile";
            nameGroup.style.display = "block";
            submitBtn.innerText = "Register Account";
            togglePortal.innerHTML = `Already have an account? <span id="toggleAction">Sign In Instead</span>`;
        }
    });

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const targetUrl = isLoginMode ? '/api/login' : '/api/register';
        const payload = {
            email: emailInput.value.trim(),
            password: passwordInput.value,
            username: usernameInput.value.trim()
        };

        // Send data directly to our running Python script backend
        fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                sessionStorage.setItem('corporateUsername', data.username);
                window.location.href = 'dashboard.html';
            } else {
                alert("❌ Account Error: " + data.message);
            }
        })
        .catch(err => alert("Could not connect to Python backend. Is server.py running?"));
    });
</script>
</body>
</html>
