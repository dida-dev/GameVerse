<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpo rt" content="width=device-width, initial-scale=1.0">
    <title>Chat Web - Corporate HQ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; background-color: #dadbd3; height: 100vh; overflow: hidden; }

        .sidebar { width: 340px; background: #ffffff; display: flex; flex-direction: column; border-right: 1px solid #e9edef; }
        .sidebar-header { height: 60px; background-color: #f0f2f5; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .my-avatar { width: 40px; height: 40px; background: #00a884; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .sidebar-menu { list-style: none; padding: 10px 0; flex: 1; overflow-y: auto; background: #fff; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 12px 16px; color: #111b21; text-decoration: none; font-size: 16px; border-bottom: 1px solid #f0f2f5; transition: 0.2s; }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background: #f0f2f5; }
        .logout { padding: 15px; border-top: 1px solid #e9edef; text-align: center; background: #f0f2f5; }
        .logout a { color: #ea0038; text-decoration: none; font-size: 14px; font-weight: bold; }
        
            .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: #efeae2;
        position: relative;
        min-height: 0;
        }

        .chat-header { height: 60px; background: #f0f2f5; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e9edef; z-index: 1; }
        .group-avatar { width: 40px; height: 40px; background: #25d366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .header-info h3 { font-size: 16px; color: #111b21; font-weight: 500; }
        .header-info p { font-size: 13px; color: #667781; }
        
        /* Fixed scroll box setup */
        .message-pane { flex: 1; padding: 20px 5%; overflow-y: scroll; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
        
        .msg { max-width: 65%; padding: 6px 9px 8px 9px; border-radius: 7px; font-size: 14.2px; line-height: 19px; color: #111b21; position: relative; display: flex; flex-direction: column; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); word-break: break-word; }
        .msg .username { font-size: 12.8px; font-weight: 600; color: #35a661; margin-bottom: 2px; }
        
        .msg.received { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .msg.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; align-self: flex-end; margin-top: 2px; margin-bottom: -4px; min-width: 50px; }
        .msg-time { font-size: 11px; color: #667781; }
        .msg-check { font-size: 15px; color: #53bdeb; line-height: 1; }

        .uploaded-media { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 5px; display: block; object-fit: contain; }

        .input-bar { height: 62px; background: #f0f2f5; padding: 10px 24px; display: flex; align-items: center; gap: 12px; z-index: 1; }
        .input-bar input { flex: 1; padding: 9px 12px; background: #ffffff; border: none; border-radius: 8px; outline: none; font-size: 15px; color: #111b21; }
        
        .attach-btn { background: #e9edef; color: #54656f; font-size: 20px; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .attach-btn:hover { background: #d9dbde; }

        .input-bar button.send-btn { background: #00a884; color: white; border: none; padding: 9px 22px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .input-bar button.send-btn:hover { background: #008f72; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="my-avatar" id="myAvatarLetter">U</div>
            <div style="font-weight: 600; color:#111b21; font-size: 15px;">Chats</div>
        </div>
        <ul class="sidebar-menu">
            <li class="active">
                <a href="#">
                    <div class="group-avatar">📢</div>
                    <div style="flex:1;">
                        <strong style="font-size: 15px;"># corporate-hq</strong>
                        <div style="font-size: 13px; color: #667781; margin-top: 2px;">Media Upload Feed</div>
                    </div>
                </a>
            </li>
            <li><a href="dashboard.html">🏠 Return to Dashboard</a></li>
        </ul>
        <div class="logout"><a href="index.html" onclick="localStorage.clear(); sessionStorage.clear();">Log Out</a></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="group-avatar">📢</div>
            <div class="header-info">
                <h3># corporate-hq</h3>
                <p id="activeBadge">Connecting profiles...</p>
            </div>
        </div>

        <div class="message-pane" id="messagePane"></div>

        <div class="input-bar">
            <input type="file" id="fileInput" accept="image/png, image/jpeg, image/gif" style="display: none;">
            <button class="attach-btn" id="attachBtn" title="Attach Photo or GIF">📎</button>
            <input type="text" id="messageInput" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const myName = sessionStorage.getItem('corporateUsername') || "Anonymous User";
        document.getElementById('myAvatarLetter').innerText = myName.charAt(0).toUpperCase();
        
        if (!sessionStorage.getItem('localUserId')) {
            sessionStorage.setItem('localUserId', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const myId = sessionStorage.getItem('localUserId');
        document.getElementById('activeBadge').innerText = `Logged in as: ${myName}`;

        const messagePane = document.getElementById('messagePane');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            if (file.size > 1500000) {
                alert("❌ File is too large! Please choose an image or GIF under 1.5MB.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64String = event.target.result;
                commitMessage("", base64String);
            };
            reader.readAsDataURL(file);
            this.value = '';
        });

        function displayMessages() {
            messagePane.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('localChatHistory')) || [];
            
            history.forEach(data => {
                const msgDiv = document.createElement('div');
                const isMe = (data.userId === myId);
                msgDiv.classList.add('msg', isMe ? 'sent' : 'received');
                
                const nameLabel = isMe ? '' : `<span class="username">${data.user}</span>`;
                const timeString = data.time ? data.time : new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const checkmark = isMe ? `<span class="msg-check">✓✓</span>` : '';

                let textHtml = '';
                if (data.text) {
                    textHtml = `<div class="text-content"></div>`;
                }

                let mediaHtml = '';
                if (data.media) {
                    mediaHtml = `<img src="${data.media}" class="uploaded-media" alt="Shared Image"/>`;
                }

                msgDiv.innerHTML = `
                    ${nameLabel}
                    ${textHtml}
                    ${mediaHtml}
                    <div class="msg-meta">
                        <span class="msg-time">${timeString}</span>
                        ${checkmark}
                    </div>
                `;
                
                if (data.text) {
                    msgDiv.querySelector('.text-content').textContent = data.text;
                }

                messagePane.appendChild(msgDiv);
            });

            // Smooth scroll anchor trigger 
            setTimeout(() => {
                messagePane.scrollTo({
                    top: messagePane.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function commitMessage(textBody, mediaData = null) {
            const history = JSON.parse(localStorage.getItem('localChatHistory')) || [];
            const now = new Date();
            const formattedTime = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            history.push({
                userId: myId,
                user: myName,
                text: textBody,
                media: mediaData,
                time: formattedTime
            });
            
            try {
                localStorage.setItem('localChatHistory', JSON.stringify(history));
                displayMessages();
            } catch(e) {
                alert("❌ Chat local storage memory full! Clear your chat history or use a smaller file.");
            }
        }

        function sendTextMessage() {
            const text = messageInput.value.trim();
            if (text !== '') {
                commitMessage(text);
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendTextMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(); });

        window.addEventListener('storage', (e) => {
            if (e.key === 'localChatHistory') {
                displayMessages();
            }
        });

        displayMessages();
    </script>
</body>
</html>
